[package]
name = "sms-auth"
description = "authkestra-op ClientStore/ClientAssertionStore over oauth_clients/client_assertions (R1), and standing up the OP itself: key management, CompositeOpStore, OpConfig (#20)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
cratestack.workspace = true
sms-api.workspace = true
sms-core.workspace = true
authkestra-op.workspace = true
# TokenManager/Engine/MemoryStore — op.rs's key management and the stores
# CompositeOpStore's unused (client_credentials-only, #20) authorization
# code/refresh/device-code slots need to type-check.
authkestra-engine.workspace = true
rsa.workspace = true
rand.workspace = true
argon2.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# oidc_flow_live.rs's own live suite: a real in-process server, a real
# client keypair, a real HTTP round trip against it.
authkestra-axum.workspace = true
axum.workspace = true
base64.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
serde.workspace = true
# The four live suites in tests/ get their DATABASE_URL from this instead
# of the environment.
sms-test-support.workspace = true

[lints]
workspace = true
