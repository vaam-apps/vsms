[package]
name = "sms-api"
description = "Generated CrateStack surface for the SMS gateway: models, policies, REST router, procedures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
cratestack.workspace = true
cratestack-codec-json.workspace = true
sms-encoding.workspace = true
sms-msisdn.workspace = true
# provision_client (#23)'s pack() for the sentinel-delimited scopes/
# grantTypes columns — sms-core has no internal dependencies of its own,
# so pulling it in here doesn't risk a cycle with sms-auth (which depends
# on both sms-api and sms-core already).
#
# Also rbac.rs's `require_permission` (#24, Layer 2): the same sentinel-
# delimited membership test `AppClient.scopes`/`OauthClient.scopes` already
# use for their DB columns, reused here for the JWT `scope` claim rather
# than reinvented — see sms-core's own module doc for why the sentinel form
# matters even though `contains`/`unpack` tolerate the plain OAuth form too.
sms-core.workspace = true
# dlr.rs's real dependency: the SmsProvider trait's DeliveryUpdate/
# DeliveryOutcome/RawCallback/ProviderError types — never a concrete
# adapter, the same reason sms-worker depends on this and not on
# sms-provider-orange-cm directly.
sms-provider.workspace = true
# auth.rs's GatewayAuth (#21): JWKS-backed validation. authkestra-engine
# for Claims/extract_bearer_token, authkestra-resource for JwksCache,
# jsonwebtoken for Validation — see auth.rs's own doc for why JwtStrategy
# itself isn't used directly (its cache/validation fields are private).
# provision_client (#23) reuses TokenManager::new_asymmetric/public_jwk from
# the same crate to derive the client's public JWK, mirroring
# sms_auth::op::rotate_signing_key's own pattern for the OP's key — sms-api
# can't depend on sms-auth (sms-auth depends on sms-api), so the small
# keygen snippet is duplicated here rather than shared.
authkestra-engine.workspace = true
authkestra-resource.workspace = true
jsonwebtoken.workspace = true
# provision_client (#23)'s RSA keypair generation — same crates and version
# sms-auth::op::rotate_signing_key uses for the OP's own signing key.
rsa.workspace = true
rand.workspace = true

chrono.workspace = true
serde.workspace = true
# `Claims.extra` (authkestra_engine::token::Claims, auth.rs) is a
# `HashMap<String, serde_json::Value>` — needed to read the `perms` claim
# out of it in `GatewayAuth::authenticate`.
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["time"] }
# dlr_ingestion_live_postgres.rs's FixedProvider — a test-only SmsProvider
# fake, needing the same #[async_trait] the real trait is declared with.
async-trait.workspace = true
# examples/send_test_message.rs — the #36 acceptance gate's seed/send tool.
clap.workspace = true
anyhow.workspace = true

[lints]
workspace = true
