[package]
name = "sms-fake-orange"
description = "A fault-injecting fake of Orange Cameroon's SMS HTTP API — a participant in the send/DLR lifecycle (inbound stubbing, an autonomous DLR scheduler, a request ledger), not a response stub. Test-only: fuzzes the message state machine for invariant violations. Does not, and cannot, close #36 — see docs/runbooks/36-handset-gate.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# Pure-ish, dev/test-only crate: no cratestack, no schema dependency. It
# knows Orange's own wire shapes (the submit response envelope,
# `deliveryInfoNotification` — the same shapes `sms-provider-orange-cm`
# already models) and HTTP, nothing about `Message`/`MessageState`. Callers
# (a live test suite) own translating "invariant to check" into "database
# query" — this crate only ever fakes the provider's side of the wire.
wiremock.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
rand.workspace = true
tracing.workspace = true

[lints]
workspace = true
