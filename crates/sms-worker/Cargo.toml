[package]
name = "sms-worker"
description = "The worker as a library: role selection and (from #28/#29 on) leases and claim loops. The binary is app/sms-worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# For cratestack::sqlx only (lease.rs's R1 exception) — cratestack::sqlx
# re-exports sqlx-core/sqlx-postgres directly rather than the sqlx umbrella
# crate (see cratestack-sqlx's own module doc), so this is the same
# connection type every other raw-sqlx R1 exception in this workspace uses,
# not a second sqlx dependency tree.
cratestack.workspace = true
# claim.rs's real dependency: the expanded Message/MessageState/etc. types
# and the delegate methods that read and write them. include_server_schema!
# is still invoked exactly once, in sms-api's own lib.rs — depending on
# sms-api here links its already-compiled output, the same way sms-auth
# already does, not a second expansion.
sms-api.workspace = true
# dispatch.rs's real dependency: the SmsProvider trait itself, so this crate
# can hold `Arc<dyn SmsProvider>` without depending on any one adapter.
sms-provider.workspace = true
# dispatch.rs converts the schema's Encoding onto SmsProvider::submit's
# SubmitRequest.encoding — the reverse of sms-api's own encoding_of.
sms-encoding.workspace = true
async-trait.workspace = true
chrono.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
# test-util on top of dependencies' time — this crate's own tests pause the
# clock to prove a stub role never resolves without waiting on a real timer.
tokio = { workspace = true, features = ["test-util"] }
# dispatch.rs's own live tests submit against a real OrangeCmProvider
# pointed at a wiremock server — the only adapter that exists yet.
sms-provider-orange-cm.workspace = true
wiremock.workspace = true
serde_json.workspace = true

[lints]
workspace = true
