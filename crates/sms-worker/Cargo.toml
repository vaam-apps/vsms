[package]
name = "sms-worker"
description = "The worker as a library: role selection and (from #28/#29 on) leases and claim loops. The binary is app/sms-worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# For cratestack::sqlx only (lease.rs's R1 exception) — cratestack::sqlx
# re-exports sqlx-core/sqlx-postgres directly rather than the sqlx umbrella
# crate (see cratestack-sqlx's own module doc), so this is the same
# connection type every other raw-sqlx R1 exception in this workspace uses,
# not a second sqlx dependency tree.
cratestack.workspace = true
# claim.rs's real dependency: the expanded Message/MessageState/etc. types
# and the delegate methods that read and write them. include_server_schema!
# is still invoked exactly once, in sms-api's own lib.rs — depending on
# sms-api here links its already-compiled output, the same way sms-auth
# already does, not a second expansion.
sms-api.workspace = true
# dispatch.rs's real dependency: the SmsProvider trait itself, so this crate
# can hold `Arc<dyn SmsProvider>` without depending on any one adapter.
sms-provider.workspace = true
# dispatch.rs converts the schema's Encoding onto SmsProvider::submit's
# SubmitRequest.encoding — the reverse of sms-api's own encoding_of.
sms-encoding.workspace = true
# routing.rs's own dependency: national-number digits for Route.matchPrefix
# (Msisdn::national()), the same convention OperatorPrefixTable already
# uses — never a hand-rolled E.164 parse.
sms-msisdn.workspace = true
# #62: the pure route-selection engine. routing.rs is the I/O glue —
# fetches Route/Provider rows, converts the schema's own enums onto this
# crate's mirrored ones, and applies the resulting Decision.
sms-routing.workspace = true
# hooks.rs's real dependency: sign_header, generate_secret's sibling
# constants (header names), and the canonical-string contract #41 already
# proved cross-language. This crate never reimplements signing.
sms-webhook.workspace = true
# #70/#71: the four worker-side gauges (singleton lease held, dispatch
# in-flight submits, drain's oldest-undelivered age, reap_outbox's poison
# rows) — see that crate's own module doc for why these live there rather
# than here, and why routing this crate's own write-error sites through
# sms-api's map_database_error (already a dependency below) is what makes
# the fifth metric, sms_sm001_total, comprehensive rather than gateway-only.
sms-metrics.workspace = true
async-trait.workspace = true
chrono.workspace = true
# routing.rs's own production draw for sms_routing::select_route's weighted
# tie-break — the *only* place this crate ever touches an RNG (see that
# module's own doc for why the engine itself never does).
rand.workspace = true
# hooks.rs's own outbound HTTP client — same 0.12/rustls-tls resolution
# sms-provider-orange-cm already uses (see AGENTS.md's "aws-lc-rs enters
# this tree from authkestra alone" section: this is the `ring` path, not
# the reqwest-0.13/authkestra one that needed an explicit CryptoProvider
# install).
reqwest.workspace = true
# hooks.rs builds and parses the §8.4 envelope (WebhookAttempt.payload is
# already a JSON string; the envelope wraps it, never re-encodes it as a
# nested string).
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
# test-util on top of dependencies' time — this crate's own tests pause the
# clock to prove a stub role never resolves without waiting on a real timer.
tokio = { workspace = true, features = ["test-util"] }
# dispatch.rs's own live tests submit against a real OrangeCmProvider
# pointed at a wiremock server — the only adapter that exists yet.
sms-provider-orange-cm.workspace = true
wiremock.workspace = true
# The four live suites in tests/ (claim/dispatch/jobs/live_postgres.rs) get
# their DATABASE_URL from this instead of the environment.
sms-test-support.workspace = true
# chaos_live_postgres.rs's own fault-injecting Orange fake.
sms-fake-orange.workspace = true
# chaos_live_postgres.rs stands up a minimal in-process axum server for
# `POST /dlr/{providerKey}` — the real one lives in `app/sms-gateway`, a
# binary crate with no `lib.rs` (same reason `oidc_flow_live.rs` duplicates
# `op.rs`'s own route assembly, see AGENTS.md), so this is the same small
# duplication, not a new pattern.
axum.workspace = true

[lints]
workspace = true
