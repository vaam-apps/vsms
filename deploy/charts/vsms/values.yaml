# deploy/charts/vsms/values.yaml — every key below traces to a real
# `#[arg(long, env = "...")]` in backends/apps/sms-gateway/src/main.rs or
# backends/apps/sms-worker/src/main.rs, a docker-compose.yml service block, or an
# frontends/apps/admin/ env var — the same "nothing speculative" convention
# deploy/.env.example documents for the compose path. Read
# docs/runbooks/deployment.adoc's "Kubernetes (Helm)" section alongside this
# file before a real install.
#
# Fields referenced with `{{ ... }}` below are evaluated by the bjw-s
# common library's own `tpl` pass over specific value classes only —
# `env` values, `image.{repository,tag,digest}`, `persistence.*.name`,
# and `ingress.*.hosts` are documented ("Template enabled") and confirmed
# against common's own templates/lib/**/*.tpl before relying on it here.
# `image.pullPolicy` is NOT one of them — confirmed live, not assumed:
# common/templates/lib/container/_spec.tpl reads
# `$containerObject.image.pullPolicy` straight into `imagePullPolicy:`
# with no `tpl` call around it (unlike repository/tag/digest one template
# up in `_imageSpecificationToImage.tpl`), so a `{{ ... }}` string there
# renders as a literal, invalid Kubernetes enum value instead of being
# evaluated — caught by `helm template` failing on every container with
# "invalid map key" before this was fixed. Every controller below sets it
# as a plain literal for that reason, not cross-referenced from
# `.Values.image.pullPolicy`. Scalar/typed fields (replicas, resources,
# enabled, job.*) are NOT passed through `tpl` either — those stay plain
# values, set directly per controller, never cross-referenced from the
# convenience namespaces below.
#
# **This chart deliberately keeps `migrate`/`seedDispatch`/
# `rotateSigningKey` as three separate, granular pre-install hooks
# rather than growing a single `bootstrap` hook mirroring the compose
# path's own `sms-gateway bootstrap` (review round 1, item 7).** The
# compose runbook's `bootstrap` exists to collapse four manual
# `docker compose run --rm` invocations into one for a human typing
# commands at a terminal; a Helm hook is not typed by hand, so there is
# no equivalent "fewer commands to remember" benefit here, and the three
# hooks already need distinct weights (`-20`/`-15`/`-10`) to run in the
# right order regardless of whether they're one Job or three — see
# `rotateSigningKey`'s own comment for why it stays `pre-install`-only
# (never `pre-upgrade`), unlike the other two. A single combined hook
# would also make the chart's own `helm template` output harder to
# reason about per-step (one Job's logs instead of three), for no
# offsetting gain.
#
# **Console-client and first-operator provisioning (compose's own
# `provision-console-client`/`secrets-fix-perms`/`seed-console-client`/
# `provision-user`) have no Helm-hook equivalent at all yet** — a real,
# named gap, not an oversight: those need a writable path for the
# private key that ends up readable by `admin`'s own pod (a
# `Secret`/`emptyDir`-based equivalent of compose's host-bind-mount +
# `chown`-to-runtime-uid mechanism), which this chart doesn't build. The
# manual equivalent today, run once against a live install:
#
#   kubectl exec -it deploy/<release>-sms-gateway -- /usr/local/bin/sms-gateway \
#     create-app --database-url "$DATABASE_URL" --slug <slug> --name "<name>"
#   kubectl exec -it deploy/<release>-sms-gateway -- /usr/local/bin/sms-gateway \
#     provision-client --database-url "$DATABASE_URL" --app-id <the App id> \
#     --label "admin console" --scope sms:send --scope sms:read \
#     --scope job:read --scope job:enqueue --scope worker:read \
#     --scope provider:read --scope route:read --scope dashboard:read \
#     --key-out /tmp/console-private-key.pem --client-id-out /tmp/console-client-id
#   kubectl cp <sms-gateway-pod>:/tmp/console-private-key.pem ./console-private-key.pem
#   kubectl create secret generic vsms-console-key \
#     --from-file=console-private-key.pem=./console-private-key.pem
#   kubectl exec -it deploy/<release>-sms-gateway -- /usr/local/bin/sms-gateway \
#     seed-console-client --database-url "$DATABASE_URL" --redirect-uri <ADMIN_BASE_URL>/api/auth/callback
#   kubectl exec -it deploy/<release>-sms-gateway -- /usr/local/bin/sms-gateway \
#     provision-user --database-url "$DATABASE_URL" --email <you> --display-name "<name>" --role-key owner
#
# (`--database-url` can be omitted if `DATABASE_URL` is already in the
# pod's own environment, which the `sms-gateway` Deployment's containers
# already have.) A real Helm-hook-shaped fix is tracked as future work,
# not attempted here.

global:
  # Set by templates/common.yaml from .Release.Name when left empty — see
  # that file's own comment for why (the same pattern
  # bjw-s-labs/app-template's own templates/common.yaml uses).
  nameOverride: ""

# ---------------------------------------------------------------------------
# Images — one registry/owner pair, one tag, shared by all four images this
# chart deploys (sms-gateway, sms-worker, admin, and the migrate runner —
# release.yml's matrix builds and pushes all four to GHCR under this exact
# owner). All four are always published together by the same workflow run,
# so a single shared tag is correct, not a simplification that will drift.
# ---------------------------------------------------------------------------
image:
  registry: ghcr.io
  repositoryOwner: vymalo
  # Required. One of: a semver release tag without the leading "v" (e.g.
  # "0.4.0"), "main" (mutable, moves with every push to main), or
  # "sha-<12-hex>" (immutable, pinned to one commit) — see release.yml's
  # own comment for exactly which tags each image gets on each trigger.
  tag: ""
  pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# Secrets — referenced, never templated in (#145's own acceptance note).
# Every entry names a Secret this chart does not create; the operator's own
# secret manager (sealed-secrets, external-secrets, a plain `kubectl create
# secret`, whatever they already run) owns creating it. Nothing under
# deploy/charts/vsms ever writes one of these values into a ConfigMap, an
# env `value:`, or a rendered manifest.
# ---------------------------------------------------------------------------
existingSecrets:
  # Must contain a key holding the full postgres:// connection string —
  # the same shape docker-compose.yml's own DATABASE_URL assembles from
  # POSTGRES_USER/PASSWORD/DB. This chart does not run Postgres — see
  # #145's own scope note: "do not vendor a database dependency."
  database:
    name: ""
    key: DATABASE_URL
  # #134/#140 — HMAC-SHA256 pepper behind Message.msisdnHash/bodyHash.
  # Minimum 32 bytes; sms-gateway validates this at boot and refuses to
  # bind on a missing or too-short value. Generate with
  # `openssl rand -base64 48`, exactly like the compose path.
  hashPepper:
    name: ""
    key: SMS_HASH_PEPPER
  # Orange Cameroon's OAuth2 client_credentials secret. The client id and
  # sender number are not secret in the same sense (see .Values.orange
  # below) and stay plain values, matching deploy/.env.example's own split.
  orange:
    name: ""
    key: ORANGE_CM_CLIENT_SECRET
  # 32+ characters of real entropy — it encrypts the console's session
  # cookie (AES-256-GCM, frontends/apps/admin/lib/oidc.ts). Generate with
  # `openssl rand -hex 32`. A secret rather than a value for the obvious
  # reason: anything holding it can mint a session for any account.
  consoleSessionSecret:
    name: ""
    key: SMS_CONSOLE_SESSION_SECRET
  # Must contain a key literally named `console-private-key.pem` — the
  # admin console's private_key_jwt keypair (#111/#134), minted once by
  # `sms-gateway provision-client` and never stored anywhere else in this
  # system. Mounted whole (persistence.console-private-key below) rather
  # than read through a single secretKeyRef env var, because the console
  # reads it as a file path (SMS_CONSOLE_PRIVATE_KEY_PATH), the same way
  # deploy/docker-compose.yml mounts deploy/secrets/console-private-key.pem
  # read-only rather than passing key material through an env var.
  consolePrivateKey:
    name: ""

# ---------------------------------------------------------------------------
# Cross-cutting config, referenced only from templated env-value strings
# below (never from a plain typed field — see this file's own header).
# ---------------------------------------------------------------------------

# Every token sms-gateway's OP mints carries this as `iss`; the admin
# console validates incoming tokens against exactly this value too
# (SMS_AUTH_ISSUER) — one field, not two, because a mismatch between them
# is silent until the first token validation fails (AGENTS.md's own
# warning about SMS_OIDC_ISSUER, verbatim).
oidcIssuer: ""

orange:
  clientId: ""
  senderNumber: ""
  baseUrl: https://api.orange.com
  # receiptRequest.notifyURL on every submit (#95) — optional, only the
  # dispatch role (sms-worker) uses it. Leave empty unless a real Orange
  # sandbox requires an explicit notifyURL rather than relying on
  # callbackData alone — see backends/apps/sms-worker/src/main.rs's own doc comment.
  dlrNotifyUrl: ""

worker:
  # Comma-separated, no spaces — any of dispatch,drain,scheduler,hooks,jobs
  # (smpp is scaffold-only, milestone 7). Matches deploy/.env.example's own
  # default: one node running every role, the compose stack's shape.
  # Splitting into a second, scale-to-N-only controller (--roles hooks,jobs)
  # is a day-2 step, not something this chart's default topology needs —
  # see #145's own note on backends/crates/sms-worker/src/lease.rs's Cardinality:
  # dispatch/drain/scheduler are Singleton (RoleLease-guarded — extra
  # replicas idle on standby, never double-run), hooks/jobs are ScaleToN.
  roles: dispatch,drain,scheduler,hooks,jobs

admin:
  # R4 (CONTRIBUTING.md): the admin console is optional, and this chart
  # must install and run a working gateway+worker with it switched off.
  # Default true so an existing install's behaviour is unchanged by this
  # field's own addition. Setting this false skips the admin Deployment
  # and Service entirely (not started-then-idle, not present-but-
  # unconfigured — see templates/common.yaml's own comment for the
  # mechanism) and every value below stops being required. `helm template
  # --set admin.enabled=false` with none of them set is the acceptance
  # bar this field exists to satisfy.
  enabled: true
  # The public origin a browser reaches the console at. Required — see the
  # ADMIN_BASE_URL comment on the container's env block for why an
  # in-cluster address does not work here.
  baseUrl: ""
  # Must equal what `sms-gateway seed-console-client --client-id` and
  # `sms-gateway serve --console-client-id` were given; GatewayAuth's
  # audience check refuses any other value.
  oidcClientId: sms-console
  # No provisioning CLI path exists yet from inside this chart (same gap
  # docs/runbooks/deployment.adoc's compose path documents by hand) — set
  # this after provisioning a client the same way that runbook describes.
  consoleClientId: ""
  # #56/#57: job:read/job:enqueue gate the Jobs screen, worker:read gates
  # the Workers screen (Layer 2, `sms_api::rbac::require_permission`) — the
  # client provisioned for `consoleClientId` above must be granted these
  # scopes too (`sms-gateway provision-client --scope ...`), or a correctly
  # configured token still gets a 403 reading either screen.
  consoleScope: "sms:send sms:read job:read job:enqueue worker:read"
  messageStreamPollMs: 2000
  appName: vsms Admin Console

# ---------------------------------------------------------------------------
# Controllers — one Deployment per long-running process, plus two
# Helm-hook Jobs that must complete, in order, before either Deployment's
# Pods are ever scheduled.
# ---------------------------------------------------------------------------
controllers:
  # Applies backends/migrations/postgres/{0001_init,0002_bootstrap} — see
  # backends/apps/sms-migrate/src/main.rs's own module doc for why this is safe to
  # run concurrently or repeatedly (a session advisory lock plus a
  # `schema_migrations` tracking table this deploy path owns; the runner
  # itself is a small Rust binary — the schema SQL is embedded via
  # `include_str!` at compile time rather than shelled out to `psql`).
  # Hooked to
  # both pre-install and pre-upgrade, unlike rotateSigningKey below,
  # because it is genuinely idempotent — a second run against an
  # already-migrated database is a documented no-op, not a repeated
  # mutation. hook-weight -20 so it always runs before seedDispatch's -15
  # and rotateSigningKey's -10 within the same Helm phase.
  migrate:
    type: job
    annotations:
      helm.sh/hook: pre-install,pre-upgrade
      helm.sh/hook-weight: '-20'
      helm.sh/hook-delete-policy: before-hook-creation
    job:
      backoffLimit: 3
      ttlSecondsAfterFinished: 300
    pod:
      restartPolicy: Never
    containers:
      main:
        image:
          repository: '{{ printf "%s/%s/vsms-migrate" .Values.image.registry .Values.image.repositoryOwner }}'
          tag: '{{ required "image.tag is required" .Values.image.tag }}'
          pullPolicy: IfNotPresent
        env:
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: '{{ required "existingSecrets.database.name is required — see docs/runbooks/deployment.adoc" .Values.existingSecrets.database.name }}'
                key: '{{ .Values.existingSecrets.database.key }}'
        resources: {}

  # `sms-gateway seed-dispatch` (renamed from `seed-provider` in #62) —
  # creates (or reactivates) the `active` `Provider` row keyed `orange_cm`
  # that `resolve_provider_row_id` (backends/apps/sms-gateway/src/main.rs) resolves
  # at startup, **and** a catch-all `Route` pointing at it. #148: nothing
  # seeded the `Provider` row before this hook existed, and — the same
  # startup-ordering trap rotateSigningKey below already documents for the
  # OP's signing key — `resolve_provider_row_id` is called before `serve`
  # ever binds its listener, so a fresh install crash-looped the gateway
  # forever with no window for an operator to seed anything by hand
  # between the pre-install hooks completing and the gateway Deployment
  # being created. #62 added the `Route` half to this same hook, found
  # live while closing out that PR's own review: #62's routing engine
  # made `dispatch` refuse every message with no matching `Route` (a
  # deliberate cutover from routing's old "any active provider"
  # placeholder), and this hook — the only seeding path a Helm-based
  # deployment ever runs — only ever created the `Provider` half, which
  # would have left every chart install after #62 merged running healthy
  # with every message silently landing in `rejected` forever.
  #
  # hook-weight -15: after migrate (-20, the providers/routes tables have
  # to exist first) and before rotateSigningKey (-10). The two are
  # otherwise independent — a Provider/Route pair and an OP signing key
  # are unrelated domains, and this could just as well run after
  # rotateSigningKey or at the same weight — but picking a distinct weight
  # between them keeps the three hooks a single, strictly-ordered chain
  # (migrate -> seedDispatch -> rotateSigningKey -> Deployments) rather
  # than leaving two hooks free to race at a shared weight, and this one
  # is cheap: a handful of single-row create-or-reactivate writes with no
  # dependency on the OP's signing key at all.
  #
  # Hooked to both pre-install and pre-upgrade, like migrate and unlike
  # rotateSigningKey: `sms-gateway seed-dispatch` is idempotent on both
  # halves — the `Provider` half is create + catch the `23505` on
  # `Provider.key`'s `@unique` index (this repo's documented dedupe
  # pattern); `Route` has no unique column to catch a conflict on, so
  # that half looks up an existing route for the provider first instead
  # (see the subcommand's own doc comment for the small accepted TOCTOU
  # window that shape carries) — so a second run against an
  # already-seeded, already-active deployment is a documented no-op, not
  # a repeated mutation the way rotating a signing key on every upgrade
  # would be.
  seedDispatch:
    type: job
    annotations:
      helm.sh/hook: pre-install,pre-upgrade
      helm.sh/hook-weight: '-15'
      helm.sh/hook-delete-policy: before-hook-creation
    job:
      backoffLimit: 3
      ttlSecondsAfterFinished: 300
    pod:
      restartPolicy: Never
    containers:
      main:
        image:
          repository: '{{ printf "%s/%s/vsms-sms-gateway" .Values.image.registry .Values.image.repositoryOwner }}'
          tag: '{{ .Values.image.tag }}'
          pullPolicy: IfNotPresent
        # The image ENTRYPOINT is already the binary (see
        # backends/apps/sms-gateway/Dockerfile) — only the subcommand goes here.
        # No --key/--kind/etc. overrides: the subcommand's own defaults
        # (key=orange_cm, kind=orange_cm_http) already match the only
        # adapter Serve/dispatch actually wire up (see .Values.orange
        # above), the same "nothing speculative" convention this file's
        # own header documents. The Route half has no flags at all — a
        # hardcoded catch-all, per the subcommand's own doc.
        args: ['seed-dispatch']
        env:
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: '{{ required "existingSecrets.database.name is required" .Values.existingSecrets.database.name }}'
                key: '{{ .Values.existingSecrets.database.key }}'
        resources: {}

  # `sms-gateway rotate-signing-key` — mints the OP's first RS256 signing
  # key. #145's own acceptance note, verbatim: sms-gateway's `serve` arm
  # calls `load_signing_keys(...)?` *before* binding its listener, so a
  # fresh database makes the container exit immediately and crash-loop —
  # this Job has to complete, not just start, before the gateway
  # Deployment's Pods are ever scheduled. A Helm pre-install hook gives
  # exactly that ordering natively: Helm does not create any other
  # release resource until every pre-install hook Job has succeeded,
  # which also rules out the two anti-patterns #145 names explicitly (a
  # post-install step, or waiting on gateway readiness — both would
  # deadlock, the gateway can never become ready without this).
  #
  # pre-install only, deliberately not pre-upgrade: unlike migrate, this
  # command is NOT idempotent — every run mints a brand new key with an
  # overlap window (AGENTS.md: "safe to do as routine key hygiene, not
  # just a bootstrap step"), so hooking it to pre-upgrade would rotate the
  # signing key on every `helm upgrade`, silently, which is a real
  # operational surprise this chart should not default to. Deliberate
  # routine rotation later is a real operator action: `kubectl create job
  # --from=job/<release>-rotate-signing-key <name> -n <namespace>` re-runs
  # this exact Job spec on demand — see
  # docs/runbooks/deployment.adoc's chart section. The `before-hook-creation`
  # delete policy still leaves the most recent run's Job object in place
  # after success (only a *new* hook invocation deletes the prior one), so
  # that command has something to copy from.
  rotateSigningKey:
    type: job
    annotations:
      helm.sh/hook: pre-install
      helm.sh/hook-weight: '-10'
      helm.sh/hook-delete-policy: before-hook-creation
    job:
      backoffLimit: 3
      ttlSecondsAfterFinished: 300
    pod:
      restartPolicy: Never
    containers:
      main:
        image:
          repository: '{{ printf "%s/%s/vsms-sms-gateway" .Values.image.registry .Values.image.repositoryOwner }}'
          tag: '{{ .Values.image.tag }}'
          pullPolicy: IfNotPresent
        # The image ENTRYPOINT is already the binary (see
        # backends/apps/sms-gateway/Dockerfile) — only the subcommand goes here,
        # the same "run --rm sms-gateway rotate-signing-key" shape
        # docs/runbooks/deployment.adoc's compose step 3 already documents,
        # in that step's own "What bootstrap does, step by step" ->
        # "The first OP signing key" subsection (review round 1, item 7 —
        # step 3 became the combined `bootstrap` step; this chart
        # deliberately keeps its own hooks granular rather than growing a
        # `bootstrap` hook of its own, see this file's own header comment
        # on why).
        args: ['rotate-signing-key']
        env:
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: '{{ required "existingSecrets.database.name is required" .Values.existingSecrets.database.name }}'
                key: '{{ .Values.existingSecrets.database.key }}'
        resources: {}

  gateway:
    type: deployment
    replicas: 1
    containers:
      main:
        image:
          repository: '{{ printf "%s/%s/vsms-sms-gateway" .Values.image.registry .Values.image.repositoryOwner }}'
          tag: '{{ required "image.tag is required" .Values.image.tag }}'
          pullPolicy: IfNotPresent
        env:
          # main.rs's own default (127.0.0.1:8080) is a bare-metal-deploy
          # default only — inside a Pod, loopback is this container's own
          # netns, unreachable from the Service. See
          # backends/apps/sms-gateway/Dockerfile's own ENV for the same override.
          SMS_LISTEN_ADDR:
            value: '0.0.0.0:8080'
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: '{{ required "existingSecrets.database.name is required" .Values.existingSecrets.database.name }}'
                key: '{{ .Values.existingSecrets.database.key }}'
          SMS_DB_MAX_CONNECTIONS:
            value: '10'
          SMS_OIDC_ISSUER:
            value: '{{ required "oidcIssuer is required — must equal the gateway public https origin" .Values.oidcIssuer }}'
          ORANGE_CM_CLIENT_ID:
            value: '{{ required "orange.clientId is required" .Values.orange.clientId }}'
          ORANGE_CM_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: '{{ required "existingSecrets.orange.name is required" .Values.existingSecrets.orange.name }}'
                key: '{{ .Values.existingSecrets.orange.key }}'
          ORANGE_CM_SENDER_NUMBER:
            value: '{{ required "orange.senderNumber is required" .Values.orange.senderNumber }}'
          ORANGE_CM_BASE_URL:
            value: '{{ .Values.orange.baseUrl }}'
          SMS_HASH_PEPPER:
            valueFrom:
              secretKeyRef:
                name: '{{ required "existingSecrets.hashPepper.name is required" .Values.existingSecrets.hashPepper.name }}'
                key: '{{ .Values.existingSecrets.hashPepper.key }}'
          RUST_LOG:
            value: 'sms_gateway=info,sms_api=info,cratestack=info'
        probes:
          # #157: /healthz stays liveness-only by design
          # (backends/apps/sms-gateway/src/health.rs's own doc: "It does not touch the
          # database") — a DB outage should surface as failed requests, not
          # as an orchestrator killing a container it cannot fix by
          # restarting it. /readyz is the new, separate route that *does*
          # round-trip the database (a bare SELECT 1, no application table),
          # so a pod whose database has gone away is pulled out of the
          # gateway Service's endpoints without also being restarted.
          liveness:
            enabled: true
            type: HTTP
            path: /healthz
            port: 8080
            spec:
              initialDelaySeconds: 5
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            type: HTTP
            path: /readyz
            port: 8080
            spec:
              # Deliberately not the defaults, and not copied from
              # liveness's own numbers — a readiness probe that flips too
              # eagerly turns one brief database blip into every replica
              # going unready at once (#157's own "stampede" warning).
              # periodSeconds=5 * failureThreshold=3 gives ~15s of
              # sustained failure before a pod is pulled from the Service's
              # endpoints — long enough to ride out a Postgres failover or
              # a momentary connection-pool hiccup, short enough that a
              # genuine outage still stops receiving traffic quickly.
              # timeoutSeconds=3 sits just above /readyz's own internal 2s
              # budget (health.rs's READINESS_TIMEOUT), so a slow database
              # round-trip is reported by the route itself (a fast,
              # explicit 503) rather than by the probe's own timeout (which
              # would look identical to a hung process from outside).
              #
              # No successThreshold here on purpose, not merely left at the
              # Kubernetes default (1, which is what's wanted — one good
              # round-trip should be enough to trust again). Checked live
              # against common 4.6.2's own
              # templates/lib/container/fields/_probes.tpl: the non-`custom`
              # HTTP-probe branch copies exactly `initialDelaySeconds`,
              # `failureThreshold`, `timeoutSeconds`, `periodSeconds` out of
              # `spec` — a `successThreshold` key here would be silently
              # dropped from the rendered manifest, not defaulted, the same
              # "will compile/render and be silently wrong" shape AGENTS.md
              # warns about for a different templating layer. Confirmed with
              # `helm template`: the key does not appear in the rendered
              # `readinessProbe` either way.
              initialDelaySeconds: 5
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 3
          startup:
            # Generous — this process opens a DB pool and loads OP signing
            # keys before it ever binds the listener (the same ordering
            # that makes rotateSigningKey's hook load-bearing); a slow
            # Postgres on first boot should not be killed as a false
            # startup failure.
            enabled: true
            type: HTTP
            path: /healthz
            port: 8080
            spec:
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 30
        resources: {}

  worker:
    type: deployment
    # Safe above 1 even though several roles are Cardinality::Singleton:
    # backends/crates/sms-worker/src/lease.rs's RoleLease means only one replica
    # ever actually holds dispatch/drain/scheduler at a time, the rest
    # idle on standby — see AGENTS.md's #28 section for the verified
    # kill -9 failover behaviour this relies on. Defaults to 1 anyway,
    # matching deploy/docker-compose.yml's own single-node shape; raise
    # deliberately for standby capacity, not because more replicas do
    # more work under the default --roles (hooks/jobs are the only
    # ScaleToN roles here, and they're a small fraction of the work).
    replicas: 1
    pod:
      # RoleLease release on SIGTERM (backends/crates/sms-worker/src/lib.rs's
      # run_singleton) plus SHUTDOWN_GRACE (backends/apps/sms-worker/src/main.rs,
      # 10s) needs real headroom beyond Kubernetes' own 30s default only
      # if a lease's Postgres round-trip is slow; kept modestly above the
      # binary's own grace constant rather than equal to it.
      terminationGracePeriodSeconds: 30
    containers:
      main:
        image:
          repository: '{{ printf "%s/%s/vsms-sms-worker" .Values.image.registry .Values.image.repositoryOwner }}'
          tag: '{{ required "image.tag is required" .Values.image.tag }}'
          pullPolicy: IfNotPresent
        env:
          SMS_WORKER_ROLES:
            value: '{{ .Values.worker.roles }}'
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: '{{ required "existingSecrets.database.name is required" .Values.existingSecrets.database.name }}'
                key: '{{ .Values.existingSecrets.database.key }}'
          SMS_WORKER_DB_MAX_CONNECTIONS:
            value: '10'
          ORANGE_CM_CLIENT_ID:
            value: '{{ .Values.orange.clientId }}'
          ORANGE_CM_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: '{{ required "existingSecrets.orange.name is required" .Values.existingSecrets.orange.name }}'
                key: '{{ .Values.existingSecrets.orange.key }}'
          ORANGE_CM_SENDER_NUMBER:
            value: '{{ .Values.orange.senderNumber }}'
          ORANGE_CM_BASE_URL:
            value: '{{ .Values.orange.baseUrl }}'
          ORANGE_CM_DLR_NOTIFY_URL:
            value: '{{ .Values.orange.dlrNotifyUrl }}'
          RUST_LOG:
            value: 'sms_worker=info,sms_worker_bin=info'
        probes:
          # #70/#71 gave this binary a `/metrics` listener (9091,
          # SMS_WORKER_METRICS_LISTEN_ADDR) — but liveness/readiness still
          # use the heartbeat file, not that route: `/metrics` answers "what
          # do the counters read," not "is this process alive and unstuck."
          # main.rs touches SMS_WORKER_HEALTH_FILE every 15s regardless of
          # --roles; a stale mtime means a hung tokio runtime, not just an
          # idling role. This chart does not yet wire the metrics port into
          # a Service/ServiceMonitor — deliberately out of scope for #70/#71,
          # which targets `deploy/docker-compose.yml` as the deployment path
          # AGENTS.md documents as real ("Docker Compose on one VM... Kubernetes
          # only when you have a reason that isn't résumé-driven"). Follow-up,
          # not done here: expose containerPort 9091 and a Service/
          # ServiceMonitor once a Prometheus Operator install is actually
          # part of this chart's own scope.
          # `backends/apps/sms-worker/Dockerfile`'s runtime image is distroless
          # `static`, which has no `/bin/sh`/`test`/`stat` for the old
          # shell one-liner to run at all — `sms-worker healthcheck`
          # (backends/apps/sms-worker/src/main.rs) reproduces the identical check
          # (same file, same 90s staleness threshold) in std-only Rust,
          # invoked directly rather than through a shell.
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /usr/local/bin/sms-worker
                  - healthcheck
              initialDelaySeconds: 20
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /usr/local/bin/sms-worker
                  - healthcheck
              initialDelaySeconds: 20
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 3
        resources: {}

  admin:
    type: deployment
    replicas: 1
    containers:
      main:
        image:
          repository: '{{ printf "%s/%s/vsms-admin" .Values.image.registry .Values.image.repositoryOwner }}'
          tag: '{{ required "image.tag is required" .Values.image.tag }}'
          pullPolicy: IfNotPresent
        env:
          # #194 replaced the DASHBOARD_AUTH Basic gate with a real
          # authorization_code + PKCE login — a hard cutover, so those
          # three vars are gone rather than optional. ADMIN_BASE_URL must
          # be the public origin a browser reaches the console at: the
          # redirect_uri registered by `sms-gateway seed-console-client`
          # is compared as a whole string (RFC 6749 3.1.2), never by
          # prefix, so an in-cluster Service address here breaks login.
          ADMIN_BASE_URL:
            value: '{{ required "admin.baseUrl is required — the public console origin" .Values.admin.baseUrl }}'
          SMS_CONSOLE_OIDC_CLIENT_ID:
            value: '{{ .Values.admin.oidcClientId }}'
          SMS_CONSOLE_SESSION_SECRET:
            valueFrom:
              secretKeyRef:
                name: '{{ required "existingSecrets.consoleSessionSecret.name is required" .Values.existingSecrets.consoleSessionSecret.name }}'
                key: '{{ .Values.existingSecrets.consoleSessionSecret.key }}'
          # Cluster-internal DNS to the gateway Service, never the
          # public origin — mirrors deploy/docker-compose.yml's own
          # `http://sms-gateway:8080` (plain http: Caddy/an ingress is
          # the only TLS terminator, same reasoning that file's own
          # comment gives for skipping @vsms/env's mTLS cross-field rule).
          # "-gateway" is the Service identifier below
          # (service.gateway); common's own resource-naming rule appends
          # the identifier as a suffix whenever more than one Service is
          # defined in one release, which is always true here (gateway +
          # admin) — see bjw-s.common.lib.determineResourceNameFromValues.
          SMS_API_URL:
            value: 'http://{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-gateway:8080'
          SMS_AUTH_ISSUER:
            value: '{{ required "oidcIssuer is required" .Values.oidcIssuer }}'
          SMS_CONSOLE_CLIENT_ID:
            value: '{{ required "admin.consoleClientId is required" .Values.admin.consoleClientId }}'
          SMS_CONSOLE_PRIVATE_KEY_PATH:
            value: '/secrets/console-private-key.pem'
          SMS_CONSOLE_SCOPE:
            value: '{{ .Values.admin.consoleScope }}'
          MESSAGE_STREAM_POLL_MS:
            value: '{{ .Values.admin.messageStreamPollMs }}'
          NEXT_PUBLIC_APP_NAME:
            value: '{{ .Values.admin.appName }}'
          NODE_ENV:
            value: production
        probes:
          # frontends/apps/admin/app/api/health is unauthenticated on purpose (#139 —
          # middleware.ts's matcher excludes it explicitly) and touches
          # no external dependency, so liveness and readiness share it
          # the same way the gateway's /healthz does.
          liveness:
            enabled: true
            type: HTTP
            path: /api/health
            port: 8080
            spec:
              initialDelaySeconds: 5
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            type: HTTP
            path: /api/health
            port: 8080
            spec:
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
        resources: {}

# ---------------------------------------------------------------------------
# Services — one per long-running HTTP surface reachable via a k8s Service.
# sms-worker's own /metrics listener (#70/#71) has neither a Service nor a
# containerPort entry here yet — see its `probes:` block above for why
# that's a deliberate, named scope cut for this chart, not an oversight.
# ---------------------------------------------------------------------------
service:
  gateway:
    controller: gateway
    primary: true
    ports:
      http:
        port: 8080
        protocol: HTTP
  admin:
    controller: admin
    primary: true
    ports:
      http:
        port: 8080
        protocol: HTTP

# ---------------------------------------------------------------------------
# Ingress — disabled by default. An operator running Kubernetes has an
# opinion about their own ingress controller and TLS story (the same
# reasoning #145 gives for not vendoring a database); enable and fill in
# per-environment rather than assuming one shape here.
# ---------------------------------------------------------------------------
ingress:
  gateway:
    enabled: false
    className: ''
    annotations: {}
    hosts:
      - host: api.example.com
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: gateway
              port: http
    tls: []
  admin:
    enabled: false
    className: ''
    annotations: {}
    hosts:
      - host: admin.example.com
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: admin
              port: http
    tls: []

# ---------------------------------------------------------------------------
# The admin console's private_key_jwt private key — mounted whole from an
# existingSecret, never templated into an env var. See
# existingSecrets.consolePrivateKey above for the required key name.
# ---------------------------------------------------------------------------
persistence:
  console-private-key:
    type: secret
    name: '{{ .Values.existingSecrets.consolePrivateKey.name }}'
    advancedMounts:
      admin:
        main:
          - path: /secrets
            readOnly: true
