# deploy/charts/vsms/values.yaml — every key below traces to a real
# `#[arg(long, env = "...")]` in backends/apps/sms-gateway/src/main.rs or
# backends/apps/sms-worker/src/main.rs, a docker-compose.yml service block, an
# frontends/apps/admin/ env var, or the YAML deployment configuration (`config`
# below) — the same "nothing speculative" convention deploy/.env.example
# documents for the compose path. Read docs/runbooks/deployment.adoc's
# "Kubernetes (Helm)" section alongside this file before a real install.
#
# VSC-1: what a deployment DECIDES — the pepper's source, the pool sizes, the
# rate limits, every SMS provider and its credentials — is not a value of this
# chart. It is the YAML overlay under `config.overlay`, opaque text to Helm,
# read by sms-gateway and sms-worker alike (docs/architecture.md, section 9.4).
# The structured `orange.*`, `mtn.*` and `awsSms.*` values this chart used to
# carry are gone, and the chart refuses a release that still sets them.
#
# Fields referenced with `{{ ... }}` below are evaluated by the bjw-s
# common library's own `tpl` pass over specific value classes only —
# `env` values, `image.{repository,tag,digest}`, `persistence.*.name`,
# and `ingress.*.hosts` are documented ("Template enabled") and confirmed
# against common's own templates/lib/**/*.tpl before relying on it here.
# `image.pullPolicy` is NOT one of them — confirmed live, not assumed:
# common/templates/lib/container/_spec.tpl reads
# `$containerObject.image.pullPolicy` straight into `imagePullPolicy:`
# with no `tpl` call around it (unlike repository/tag/digest one template
# up in `_imageSpecificationToImage.tpl`), so a `{{ ... }}` string there
# renders as a literal, invalid Kubernetes enum value instead of being
# evaluated — caught by `helm template` failing on every container with
# "invalid map key" before this was fixed. Every controller below sets it
# as a plain literal for that reason, not cross-referenced from
# `.Values.image.pullPolicy`. Scalar/typed fields (replicas, resources,
# enabled, job.*) are NOT passed through `tpl` either — those stay plain
# values, set directly per controller, never cross-referenced from the
# convenience namespaces below.
#
# **This chart deliberately keeps `migrate`/`seedDispatch` as separate,
# granular pre-install hooks rather than growing a single `bootstrap` hook
# mirroring the compose path's own `sms-gateway bootstrap` (review round
# 1, item 7).** The compose runbook's `bootstrap` exists to collapse
# manual `docker compose run --rm` invocations into one for a human typing
# commands at a terminal; a Helm hook is not typed by hand, so there is
# no equivalent "fewer commands to remember" benefit here, and the hooks
# already need distinct weights (`-20`/`-15`) to run in the right order
# regardless of whether they're one Job or two. A single combined hook
# would also make the chart's own `helm template` output harder to
# reason about per-step (one Job's logs instead of two), for no
# offsetting gain. (A third hook, `rotateSigningKey`, minted the signing
# key of the embedded OpenID Provider; VS-4 deleted both.)
#
# **The console's two one-time steps have no Helm-hook equivalent**, by design
# and not as a gap: the composer's service key is generated by the operator
# (its private half must never reach vsms), and a person's console key is made
# by their own browser and vouched for by a vaam admin phone. The manual steps,
# run once against a live install (docs/runbooks/deployment.adoc, "The
# composer's key" and "Pairing the console"):
#
#   openssl genpkey -algorithm ed25519 -out console-composer.pem
#   kubectl create secret generic vsms-console-composer-key \
#     --from-file=console-composer.pem=./console-composer.pem
#   kubectl exec -it deploy/<release>-sms-gateway -- /usr/local/bin/sms-gateway \
#     register-client --database-url "$DATABASE_URL" --app <slug> \
#     --client-name console-composer --label "console composer" \
#     --scope sms:send --scope sms:read --public-key <its public half, base64url>
#   kubectl exec -it deploy/<release>-sms-gateway -- /usr/local/bin/sms-gateway \
#     server-keys          # the two public values for admin.serverKeys
#   # First operator, when no vaam admin phone is bound yet (break-glass):
#   kubectl exec -it deploy/<release>-sms-gateway -- /usr/local/bin/sms-gateway \
#     provision-user --database-url "$DATABASE_URL" --email <you> --display-name "<name>" --role-key owner
#   kubectl exec -it deploy/<release>-sms-gateway -- /usr/local/bin/sms-gateway \
#     pair-console-key --database-url "$DATABASE_URL" --user <you> --public-key <the k of the pairing QR>
#
# (`--database-url` can be omitted if `DATABASE_URL` is already in the
# pod's own environment, which the `sms-gateway` Deployment's containers
# already have.)

global:
  # Set by templates/common.yaml from .Release.Name when left empty — see
  # that file's own comment for why (the same pattern
  # bjw-s-labs/app-template's own templates/common.yaml uses).
  nameOverride: ""

# ---------------------------------------------------------------------------
# Images — one registry/owner pair, one tag, shared by all four images this
# chart deploys (sms-gateway, sms-worker, admin, and the migrate runner —
# release.yml's matrix builds and pushes all four to GHCR under this exact
# owner). All four are always published together by the same workflow run,
# so a single shared tag is correct, not a simplification that will drift.
# ---------------------------------------------------------------------------
image:
  registry: ghcr.io
  repositoryOwner: vaam-apps
  # Required. One of: a semver release tag without the leading "v" (e.g.
  # "0.4.0"), "main" (mutable, moves with every push to main), or
  # "sha-<12-hex>" (immutable, pinned to one commit) — see release.yml's
  # own comment for exactly which tags each image gets on each trigger.
  tag: ""
  pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# Secrets — referenced, never templated in (#145's own acceptance note).
# Every entry names a Secret this chart does not create; the operator's own
# secret manager (sealed-secrets, external-secrets, a plain `kubectl create
# secret`, whatever they already run) owns creating it. Nothing under
# deploy/charts/vsms ever writes one of these values into a ConfigMap, an
# env `value:`, or a rendered manifest.
# ---------------------------------------------------------------------------
existingSecrets:
  # Must contain a key holding the full postgres:// connection string —
  # the same shape docker-compose.yml's own DATABASE_URL assembles from
  # POSTGRES_USER/PASSWORD/DB. This chart does not run Postgres — see
  # #145's own scope note: "do not vendor a database dependency."
  database:
    name: ""
    key: DATABASE_URL
  # #134/#140 — HMAC-SHA256 pepper behind Message.msisdnHash/bodyHash.
  # Minimum 32 bytes; sms-gateway validates this at boot and refuses to
  # bind on a missing or too-short value. Generate with
  # `openssl rand -base64 48`, exactly like the compose path. Delivered as
  # the environment variable SMS_HASH_PEPPER, which the base configuration
  # reads as `${SMS_HASH_PEPPER}` (`security.hash_pepper`). Only sms-gateway gets
  # it: sms-worker does not load `security.*` and is not given the secret.
  hashPepper:
    name: ""
    key: SMS_HASH_PEPPER
  # The three provider secrets below are optional, and each feeds the
  # `${...}` placeholder of the same name in your overlay: the gateway and the
  # worker get the environment variable when `name` is set, and neither when it
  # is empty. A provider's client id, sender number and the rest are not secret
  # and are written in the overlay itself.
  #
  # Orange Cameroon's OAuth2 client_credentials secret: `${ORANGE_CM_CLIENT_SECRET}`.
  orange:
    name: ""
    key: ORANGE_CM_CLIENT_SECRET
  # MTN MADAPI's OAuth2 client_credentials secret: `${MTN_CLIENT_SECRET}`.
  # Leave name empty for a deployment without MTN.
  mtn:
    name: ""
    key: MTN_CLIENT_SECRET
  # AWS End User Messaging SMS: the IAM user's secret access key:
  # `${AWS_SMS_SECRET_ACCESS_KEY}`. The access key ID is a plain value in the
  # overlay, the same id/secret split Orange and MTN use. Only the worker's
  # sending half uses the value, but both processes load the one document, so a
  # placeholder in the overlay needs the variable in both.
  awsSms:
    name: ""
    key: AWS_SMS_SECRET_ACCESS_KEY
  # The gateway's two Ed25519 envelope signing keys (PKCS#8 PEM,
  # `openssl genpkey -algorithm ed25519`), under the keys `envelope-current.pem`
  # and `envelope-next.pem`. REQUIRED: the gateway refuses to start without
  # both. The same `current` key SEALS every webhook delivery (VS-8): the worker
  # mounts that one file alone (`persistence.envelope-keys` below, `subPath`)
  # because its `hooks` role seals `sealed` endpoints' deliveries with it (an
  # `hmac`-only deployment could leave it out), and never gets `next`, which
  # signs nothing. Integrators and webhook receivers pin the public halves
  # `sms-gateway server-keys` prints. Mounted as files, never read through an
  # env var, like the composer key below.
  envelopeKeys:
    name: ""
  # Must contain a key literally named `console-composer.pem` - the composer's
  # Ed25519 service key (PKCS#8 PEM), registered with `sms-gateway
  # register-client --client-name console-composer` and never stored anywhere
  # else in this system. Mounted whole (persistence.console-composer-key below)
  # rather than read through a single secretKeyRef env var, because the console
  # reads it as a file (SMS_COMPOSER_KEY_FILE), the same way
  # deploy/docker-compose.yml mounts deploy/secrets/console-composer.pem
  # read-only rather than passing key material through an env var. Optional:
  # without it every screen works and the composer reports it has no key.
  consoleComposerKey:
    name: ""

# ---------------------------------------------------------------------------
# Cross-cutting config, referenced only from templated env-value strings
# below (never from a plain typed field — see this file's own header).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# The YAML deployment configuration (VSC-1; docs/architecture.md, section 9.4).
#
# sms-gateway and sms-worker read `config/application.yml`, which the images
# bake at /config, and overlay `application-<profile>.yml` beside it. This chart
# mounts `config.overlay` as that overlay, with `subPath`, into BOTH the gateway
# and the worker, so they cannot disagree about a provider.
#
# `subPath` is load-bearing, not stylistic: the image bakes the whole `config/`
# directory, so mounting a ConfigMap AT /config would replace it and the base
# file would vanish (the process then refuses to start, naming a config file it
# can no longer see). `subPath` also means the mounted file does not live-update
# when the ConfigMap changes; the `checksum/configMaps` annotation bjw-s common
# puts on every pod template turns an overlay edit into a rolling restart
# instead, consistent with "no hot reload".
#
# The overlay is REQUIRED (templates/common.yaml refuses a release without it, and
# there is no flag to turn the ConfigMap off): the baked base file configures no
# provider, and a gateway with none refuses to start. A minimal one, Orange only:
#
#   config:
#     profile: prod
#     overlay: |
#       deployment:
#         name: vsms
#         livemode: true
#         public_base_url: https://sms.example.com
#       providers:
#         - code: orange_cm
#           credentials:
#             client_id: <the Orange client id>
#             client_secret: ${ORANGE_CM_CLIENT_SECRET}    # existingSecrets.orange
#           settings:
#             sender_number: "+237..."
#
# `livemode: true` turns on the rules a real deployment needs: https everywhere,
# no stub host, and every secret a `${VAR}` placeholder rather than a literal.
# `${VAR}` in the overlay must be set in the container environment, or the
# process refuses to start naming it; the three provider secrets and the pepper
# are wired from `existingSecrets` (the pepper to the gateway only), and anything
# else the overlay reads is added to BOTH controllers' `env` (controllers.gateway.containers.main.env and
# controllers.worker.containers.main.env). The key reference, every provider's
# settings and what is refused: docs/architecture.md, section 9.4.
# ---------------------------------------------------------------------------
config:
  # `SMS_PROFILE`. Selects a FILE, never a code path: the overlay below is
  # mounted as `application-<profile>.yml`, replacing the one the image bakes
  # under that name (the image's `prod` is the single-VM compose stack's).
  profile: prod
  # `SMS_CONFIG`: the baked base file. Changing this is almost certainly wrong.
  path: /config/application.yml
  # The overlay's text: YAML, opaque to Helm, rendered into a ConfigMap and
  # mounted. Required: there is no switch to leave it out. `${VAR}` is the
  # process's placeholder syntax, not Helm's, and `{{` is refused (guard
  # `config-overlay-template`) because common renders ConfigMap data through
  # `tpl`.
  overlay: ""

worker:
  # Comma-separated, no spaces — any of dispatch,drain,scheduler,hooks,jobs
  # (smpp is scaffold-only, milestone 7). Matches deploy/.env.example's own
  # default: one node running every role, the compose stack's shape.
  # Splitting into a second, scale-to-N-only controller (--roles hooks,jobs)
  # is a day-2 step, not something this chart's default topology needs —
  # see #145's own note on backends/crates/sms-worker/src/lease.rs's Cardinality:
  # dispatch/drain/scheduler are Singleton (RoleLease-guarded — extra
  # replicas idle on standby, never double-run), hooks/jobs are ScaleToN.
  roles: dispatch,drain,scheduler,hooks,jobs

admin:
  # R4 (CONTRIBUTING.md): the admin console is optional, and this chart
  # must install and run a working gateway+worker with it switched off.
  # Default true so an existing install's behaviour is unchanged by this
  # field's own addition. Setting this false skips the admin Deployment
  # and Service entirely (not started-then-idle, not present-but-
  # unconfigured — see templates/common.yaml's own comment for the
  # mechanism) and every value below stops being required. `helm template
  # --set admin.enabled=false` with none of them set is the acceptance
  # bar this field exists to satisfy.
  enabled: true
  # The gateway's two PUBLIC sealing keys, as `sms-gateway server-keys` prints
  # them (`current:` and `next:`; 32 bytes each, unpadded base64url). The
  # console's browser pins them and believes no answer sealed under any other
  # key, so they must be the pair the gateway signs with. Required while the
  # console is enabled. Public values: plain configuration, not a secret.
  serverKeys:
    current: ""
    next: ""
  messageStreamPollMs: 2000
  appName: vsms Admin Console

# ---------------------------------------------------------------------------
# Controllers — one Deployment per long-running process, plus two
# Helm-hook Jobs that must complete, in order, before either Deployment's
# Pods are ever scheduled.
# ---------------------------------------------------------------------------
controllers:
  # Applies backends/migrations/postgres/{0001_init,0002_bootstrap} — see
  # backends/apps/sms-migrate/src/main.rs's own module doc for why this is safe to
  # run concurrently or repeatedly (a session advisory lock plus a
  # `schema_migrations` tracking table this deploy path owns; the runner
  # itself is a small Rust binary — the schema SQL is embedded via
  # `include_str!` at compile time rather than shelled out to `psql`).
  # Hooked to
  # both pre-install and pre-upgrade because it is genuinely idempotent — a
  # second run against an already-migrated database is a documented no-op,
  # not a repeated mutation. hook-weight -20 so it always runs before
  # seedDispatch's -15 within the same Helm phase.
  migrate:
    type: job
    annotations:
      helm.sh/hook: pre-install,pre-upgrade
      helm.sh/hook-weight: '-20'
      helm.sh/hook-delete-policy: before-hook-creation
    job:
      backoffLimit: 3
      ttlSecondsAfterFinished: 300
    pod:
      restartPolicy: Never
    containers:
      main:
        image:
          repository: '{{ printf "%s/%s/vsms-migrate" .Values.image.registry .Values.image.repositoryOwner }}'
          tag: '{{ required "image.tag is required" .Values.image.tag }}'
          pullPolicy: IfNotPresent
        env:
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: '{{ required "existingSecrets.database.name is required — see docs/runbooks/deployment.adoc" .Values.existingSecrets.database.name }}'
                key: '{{ .Values.existingSecrets.database.key }}'
        resources: {}

  # `sms-gateway seed-dispatch` (renamed from `seed-provider` in #62) —
  # creates (or reactivates) the `active` `Provider` row keyed `orange_cm`
  # that `resolve_provider_row_id` (backends/apps/sms-gateway/src/main.rs) resolves
  # at startup, **and** a catch-all `Route` pointing at it. #148: nothing
  # seeded the `Provider` row before this hook existed, and
  # `resolve_provider_row_id` is called before `serve`
  # ever binds its listener, so a fresh install crash-looped the gateway
  # forever with no window for an operator to seed anything by hand
  # between the pre-install hooks completing and the gateway Deployment
  # being created. #62 added the `Route` half to this same hook, found
  # live while closing out that PR's own review: #62's routing engine
  # made `dispatch` refuse every message with no matching `Route` (a
  # deliberate cutover from routing's old "any active provider"
  # placeholder), and this hook — the only seeding path a Helm-based
  # deployment ever runs — only ever created the `Provider` half, which
  # would have left every chart install after #62 merged running healthy
  # with every message silently landing in `rejected` forever.
  #
  # hook-weight -15: after migrate (-20, the providers/routes tables have
  # to exist first), keeping the hooks a single, strictly-ordered chain
  # (migrate -> seedDispatch -> Deployments), and this one is cheap: a
  # handful of single-row create-or-reactivate writes.
  #
  # Hooked to both pre-install and pre-upgrade, like migrate:
  # `sms-gateway seed-dispatch` is idempotent on both
  # halves — the `Provider` half is create + catch the `23505` on
  # `Provider.key`'s `@unique` index (this repo's documented dedupe
  # pattern); `Route` has no unique column to catch a conflict on, so
  # that half looks up an existing route for the provider first instead
  # (see the subcommand's own doc comment for the small accepted TOCTOU
  # window that shape carries) — so a second run against an
  # already-seeded, already-active deployment is a documented no-op, not
  # a repeated mutation.
  seedDispatch:
    type: job
    annotations:
      helm.sh/hook: pre-install,pre-upgrade
      helm.sh/hook-weight: '-15'
      helm.sh/hook-delete-policy: before-hook-creation
    job:
      backoffLimit: 3
      ttlSecondsAfterFinished: 300
    pod:
      restartPolicy: Never
    containers:
      main:
        image:
          repository: '{{ printf "%s/%s/vsms-sms-gateway" .Values.image.registry .Values.image.repositoryOwner }}'
          tag: '{{ .Values.image.tag }}'
          pullPolicy: IfNotPresent
        # The image ENTRYPOINT is already the binary (see
        # backends/apps/sms-gateway/Dockerfile) — only the subcommand goes here.
        # No --key/--kind/etc. overrides: the subcommand's own defaults
        # (key=orange_cm, kind=orange_cm_http) are this provider's. Each
        # provider has its own seed hook (seedDispatchAws below), because
        # sms-gateway resolves a Provider row for EVERY provider it is
        # configured with at startup. The Route half has no flags at all —
        # a hardcoded catch-all, per the subcommand's own doc.
        #
        # Switch it off (`controllers.seedDispatch.enabled: false`) when the
        # overlay has no `orange_cm` provider: seeding an Orange row and
        # catch-all Route in an AWS-only deployment would send half of all
        # traffic to a provider the worker holds no credentials for. Since
        # VSC-1 the chart cannot see which providers the (opaque) overlay
        # configures, so this is the operator's switch, not derived.
        args: ['seed-dispatch']
        env:
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: '{{ required "existingSecrets.database.name is required" .Values.existingSecrets.database.name }}'
                key: '{{ .Values.existingSecrets.database.key }}'
        resources: {}

  # The `aws_sms` counterpart of seedDispatch: same subcommand, same
  # idempotency, same Provider row + catch-all Route. Off by default; enable it
  # (`controllers.seedDispatchAws.enabled: true`) when the overlay has an
  # `aws_sms` provider - the gateway resolves a Provider row for every provider
  # it is configured with before it binds, so each one needs its seed. To record
  # the account's commercial terms on the row append `--max-tps <n>` and
  # `--cost-per-segment-xaf <n>` to `args` (the same numbers as the overlay's
  # `tps_ceiling` and `cost_per_segment_xaf`; the chart no longer derives them,
  # because it cannot read the overlay). Weight -14 puts it directly after
  # seedDispatch (-15) rather than racing it; the two touch different rows, so
  # the order is cosmetic.
  seedDispatchAws:
    enabled: false
    type: job
    annotations:
      helm.sh/hook: pre-install,pre-upgrade
      helm.sh/hook-weight: '-14'
      helm.sh/hook-delete-policy: before-hook-creation
    job:
      backoffLimit: 3
      ttlSecondsAfterFinished: 300
    pod:
      restartPolicy: Never
    containers:
      main:
        image:
          repository: '{{ printf "%s/%s/vsms-sms-gateway" .Values.image.registry .Values.image.repositoryOwner }}'
          tag: '{{ .Values.image.tag }}'
          pullPolicy: IfNotPresent
        args:
          - seed-dispatch
          - --key
          - aws_sms
          - --kind
          - aggregator_http
          - --display-name
          - AWS End User Messaging SMS
          - --credential-ref
          - env:AWS_SMS_SECRET_ACCESS_KEY
        env:
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: '{{ required "existingSecrets.database.name is required" .Values.existingSecrets.database.name }}'
                key: '{{ .Values.existingSecrets.database.key }}'
        resources: {}

  gateway:
    type: deployment
    replicas: 1
    pod:
      # The envelope keys are mounted 0440 (persistence.envelope-keys): the
      # distroless nonroot uid reads them through this group.
      securityContext:
        fsGroup: 65532
    containers:
      main:
        image:
          repository: '{{ printf "%s/%s/vsms-sms-gateway" .Values.image.registry .Values.image.repositoryOwner }}'
          tag: '{{ required "image.tag is required" .Values.image.tag }}'
          pullPolicy: IfNotPresent
        env:
          # main.rs's own default (127.0.0.1:8080) is a bare-metal-deploy
          # default only — inside a Pod, loopback is this container's own
          # netns, unreachable from the Service. See
          # backends/apps/sms-gateway/Dockerfile's own ENV for the same override.
          SMS_LISTEN_ADDR:
            value: '0.0.0.0:8080'
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: '{{ required "existingSecrets.database.name is required" .Values.existingSecrets.database.name }}'
                key: '{{ .Values.existingSecrets.database.key }}'
          # VSC-1: the YAML deployment configuration (the `config` block above).
          SMS_PROFILE:
            value: '{{ .Values.config.profile }}'
          SMS_CONFIG:
            value: '{{ .Values.config.path }}'
          # The base configuration reads these as `${SMS_HASH_PEPPER}` and so on.
          # The three provider secrets are stripped by templates/common.yaml
          # when their existingSecrets name is empty.
          SMS_HASH_PEPPER:
            valueFrom:
              secretKeyRef:
                name: '{{ required "existingSecrets.hashPepper.name is required" .Values.existingSecrets.hashPepper.name }}'
                key: '{{ .Values.existingSecrets.hashPepper.key }}'
          ORANGE_CM_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.existingSecrets.orange.name }}'
                key: '{{ .Values.existingSecrets.orange.key }}'
          MTN_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.existingSecrets.mtn.name }}'
                key: '{{ .Values.existingSecrets.mtn.key }}'
          AWS_SMS_SECRET_ACCESS_KEY:
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.existingSecrets.awsSms.name }}'
                key: '{{ .Values.existingSecrets.awsSms.key }}'
          # VS-3: the signed transport's two keys, mounted from
          # existingSecrets.envelopeKeys (persistence.envelope-keys below).
          SMS_ENVELOPE_SIGNING_KEY_FILE:
            value: /run/envelope/envelope-current.pem
          SMS_ENVELOPE_NEXT_SIGNING_KEY_FILE:
            value: /run/envelope/envelope-next.pem
          RUST_LOG:
            value: 'sms_gateway=info,sms_api=info,sms_provider_aws_sms=info,cratestack=info'
        probes:
          # #157: /healthz stays liveness-only by design
          # (backends/apps/sms-gateway/src/health.rs's own doc: "It does not touch the
          # database") — a DB outage should surface as failed requests, not
          # as an orchestrator killing a container it cannot fix by
          # restarting it. /readyz is the new, separate route that *does*
          # round-trip the database (a bare SELECT 1, no application table),
          # so a pod whose database has gone away is pulled out of the
          # gateway Service's endpoints without also being restarted.
          liveness:
            enabled: true
            type: HTTP
            path: /healthz
            port: 8080
            spec:
              initialDelaySeconds: 5
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            type: HTTP
            path: /readyz
            port: 8080
            spec:
              # Deliberately not the defaults, and not copied from
              # liveness's own numbers — a readiness probe that flips too
              # eagerly turns one brief database blip into every replica
              # going unready at once (#157's own "stampede" warning).
              # periodSeconds=5 * failureThreshold=3 gives ~15s of
              # sustained failure before a pod is pulled from the Service's
              # endpoints — long enough to ride out a Postgres failover or
              # a momentary connection-pool hiccup, short enough that a
              # genuine outage still stops receiving traffic quickly.
              # timeoutSeconds=3 sits just above /readyz's own internal 2s
              # budget (health.rs's READINESS_TIMEOUT), so a slow database
              # round-trip is reported by the route itself (a fast,
              # explicit 503) rather than by the probe's own timeout (which
              # would look identical to a hung process from outside).
              #
              # No successThreshold here on purpose, not merely left at the
              # Kubernetes default (1, which is what's wanted — one good
              # round-trip should be enough to trust again). Checked live
              # against common 4.6.2's own
              # templates/lib/container/fields/_probes.tpl: the non-`custom`
              # HTTP-probe branch copies exactly `initialDelaySeconds`,
              # `failureThreshold`, `timeoutSeconds`, `periodSeconds` out of
              # `spec` — a `successThreshold` key here would be silently
              # dropped from the rendered manifest, not defaulted, the same
              # "will compile/render and be silently wrong" shape AGENTS.md
              # warns about for a different templating layer. Confirmed with
              # `helm template`: the key does not appear in the rendered
              # `readinessProbe` either way.
              initialDelaySeconds: 5
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 3
          startup:
            # Generous — this process opens a DB pool, reads its envelope keys
            # and resolves its Provider rows before it ever binds the
            # listener; a slow Postgres on first boot should not be killed
            # as a false startup failure.
            enabled: true
            type: HTTP
            path: /healthz
            port: 8080
            spec:
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 30
        resources: {}

  worker:
    type: deployment
    # Safe above 1 even though several roles are Cardinality::Singleton:
    # backends/crates/sms-worker/src/lease.rs's RoleLease means only one replica
    # ever actually holds dispatch/drain/scheduler at a time, the rest
    # idle on standby — see AGENTS.md's #28 section for the verified
    # kill -9 failover behaviour this relies on. Defaults to 1 anyway,
    # matching deploy/docker-compose.yml's own single-node shape; raise
    # deliberately for standby capacity, not because more replicas do
    # more work under the default --roles (hooks/jobs are the only
    # ScaleToN roles here, and they're a small fraction of the work).
    replicas: 1
    pod:
      # RoleLease release on SIGTERM (backends/crates/sms-worker/src/lib.rs's
      # run_singleton) plus SHUTDOWN_GRACE (backends/apps/sms-worker/src/main.rs,
      # 10s) needs real headroom beyond Kubernetes' own 30s default only
      # if a lease's Postgres round-trip is slow; kept modestly above the
      # binary's own grace constant rather than equal to it.
      terminationGracePeriodSeconds: 30
      # The envelope key is mounted 0440 (persistence.envelope-keys): the
      # distroless nonroot uid reads it through this group.
      securityContext:
        fsGroup: 65532
    containers:
      main:
        image:
          repository: '{{ printf "%s/%s/vsms-sms-worker" .Values.image.registry .Values.image.repositoryOwner }}'
          tag: '{{ required "image.tag is required" .Values.image.tag }}'
          pullPolicy: IfNotPresent
        env:
          SMS_WORKER_ROLES:
            value: '{{ .Values.worker.roles }}'
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: '{{ required "existingSecrets.database.name is required" .Values.existingSecrets.database.name }}'
                key: '{{ .Values.existingSecrets.database.key }}'
          # VSC-1: the same YAML document as the gateway's, from the same
          # overlay mount, and so the same environment for its `${VAR}`s - bar
          # one. The worker does not load `security.*` (sms-config's
          # `Binary::Worker`), so the hash pepper is not delivered to it: a
          # process that never uses a secret does not get it.
          SMS_PROFILE:
            value: '{{ .Values.config.profile }}'
          SMS_CONFIG:
            value: '{{ .Values.config.path }}'
          ORANGE_CM_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.existingSecrets.orange.name }}'
                key: '{{ .Values.existingSecrets.orange.key }}'
          MTN_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.existingSecrets.mtn.name }}'
                key: '{{ .Values.existingSecrets.mtn.key }}'
          AWS_SMS_SECRET_ACCESS_KEY:
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.existingSecrets.awsSms.name }}'
                key: '{{ .Values.existingSecrets.awsSms.key }}'
          # VS-8: the `hooks` role seals a `sealed` endpoint's deliveries with
          # the gateway's CURRENT envelope signing key (an `hmac` endpoint
          # needs no key, VS-8R; without one, this worker claims no sealed
          # endpoint's attempt and warns, naming the flag, how many wait).
          # Only that one file is mounted into this pod.
          SMS_ENVELOPE_SIGNING_KEY_FILE:
            value: /run/envelope/current.pem
          RUST_LOG:
            value: 'sms_worker=info,sms_worker_bin=info'
        probes:
          # #70/#71 gave this binary a `/metrics` listener (9091,
          # SMS_WORKER_METRICS_LISTEN_ADDR) — but liveness/readiness still
          # use the heartbeat file, not that route: `/metrics` answers "what
          # do the counters read," not "is this process alive and unstuck."
          # main.rs touches SMS_WORKER_HEALTH_FILE every 15s regardless of
          # --roles; a stale mtime means a hung tokio runtime, not just an
          # idling role. This chart does not yet wire the metrics port into
          # a Service/ServiceMonitor — deliberately out of scope for #70/#71,
          # which targets `deploy/docker-compose.yml` as the deployment path
          # AGENTS.md documents as real ("Docker Compose on one VM... Kubernetes
          # only when you have a reason that isn't résumé-driven"). Follow-up,
          # not done here: expose containerPort 9091 and a Service/
          # ServiceMonitor once a Prometheus Operator install is actually
          # part of this chart's own scope.
          # `backends/apps/sms-worker/Dockerfile`'s runtime image is distroless
          # `static`, which has no `/bin/sh`/`test`/`stat` for the old
          # shell one-liner to run at all — `sms-worker healthcheck`
          # (backends/apps/sms-worker/src/main.rs) reproduces the identical check
          # (same file, same 90s staleness threshold) in std-only Rust,
          # invoked directly rather than through a shell.
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /usr/local/bin/sms-worker
                  - healthcheck
              initialDelaySeconds: 20
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /usr/local/bin/sms-worker
                  - healthcheck
              initialDelaySeconds: 20
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 3
        resources: {}

  admin:
    type: deployment
    replicas: 1
    containers:
      main:
        image:
          repository: '{{ printf "%s/%s/vsms-admin" .Values.image.registry .Values.image.repositoryOwner }}'
          tag: '{{ required "image.tag is required" .Values.image.tag }}'
          pullPolicy: IfNotPresent
        env:
          # Cluster-internal DNS to the gateway Service, never the
          # public origin — mirrors deploy/docker-compose.yml's own
          # `http://sms-gateway:8080` (plain http: Caddy/an ingress is
          # the only TLS terminator, same reasoning that file's own
          # comment gives for skipping @vsms/env's mTLS cross-field rule).
          # "-gateway" is the Service identifier below
          # (service.gateway); common's own resource-naming rule appends
          # the identifier as a suffix whenever more than one Service is
          # defined in one release, which is always true here (gateway +
          # admin) — see bjw-s.common.lib.determineResourceNameFromValues.
          SMS_API_URL:
            value: 'http://{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-gateway:8080'
          # The gateway's two PUBLIC sealing keys: the browser pins them.
          SMS_ENVELOPE_SERVER_KEY_CURRENT:
            value: '{{ required "admin.serverKeys.current is required - `sms-gateway server-keys` prints it" .Values.admin.serverKeys.current }}'
          SMS_ENVELOPE_SERVER_KEY_NEXT:
            value: '{{ required "admin.serverKeys.next is required - `sms-gateway server-keys` prints it" .Values.admin.serverKeys.next }}'
          # The composer's service key, mounted from existingSecrets.consoleComposerKey.
          SMS_COMPOSER_KEY_FILE:
            value: '/secrets/console-composer.pem'
          MESSAGE_STREAM_POLL_MS:
            value: '{{ .Values.admin.messageStreamPollMs }}'
          NEXT_PUBLIC_APP_NAME:
            value: '{{ .Values.admin.appName }}'
          NODE_ENV:
            value: production
        probes:
          # frontends/apps/admin/app/api/health is unauthenticated on purpose
          # (#139) and touches no external dependency, so liveness and readiness share it
          # the same way the gateway's /healthz does.
          liveness:
            enabled: true
            type: HTTP
            path: /api/health
            port: 8080
            spec:
              initialDelaySeconds: 5
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            type: HTTP
            path: /api/health
            port: 8080
            spec:
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
        resources: {}

# ---------------------------------------------------------------------------
# Services — one per long-running HTTP surface reachable via a k8s Service.
# sms-worker's own /metrics listener (#70/#71) has neither a Service nor a
# containerPort entry here yet — see its `probes:` block above for why
# that's a deliberate, named scope cut for this chart, not an oversight.
# ---------------------------------------------------------------------------
service:
  gateway:
    controller: gateway
    primary: true
    ports:
      http:
        port: 8080
        protocol: HTTP
  admin:
    controller: admin
    primary: true
    ports:
      http:
        port: 8080
        protocol: HTTP

# ---------------------------------------------------------------------------
# Ingress — disabled by default. An operator running Kubernetes has an
# opinion about their own ingress controller and TLS story (the same
# reasoning #145 gives for not vendoring a database); enable and fill in
# per-environment rather than assuming one shape here.
# ---------------------------------------------------------------------------
ingress:
  gateway:
    enabled: false
    className: ''
    annotations: {}
    hosts:
      - host: api.example.com
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: gateway
              port: http
    tls: []
  admin:
    enabled: false
    className: ''
    annotations: {}
    hosts:
      - host: admin.example.com
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: admin
              port: http
    tls: []

# ---------------------------------------------------------------------------
# The composer's service key - mounted whole from an existingSecret, never
# templated into an env var. See existingSecrets.consoleComposerKey above for
# the required key name.
# ---------------------------------------------------------------------------
persistence:
  # The YAML overlay (`config` above), a ConfigMap this chart renders, mounted
  # with `subPath` over `application-<profile>.yml` into the gateway and the
  # worker. templates/common.yaml defines the ConfigMap (common's `configMaps`
  # item `overlay`) and fills in `advancedMounts`, because the file name carries
  # the profile and a mount's `path` is not templated. It is named by
  # `identifier` and never by a name written here: one helper names the
  # ConfigMap and the volume that mounts it, so they cannot disagree.
  config-overlay:
    type: configMap
    identifier: overlay
    advancedMounts: {}
  # The gateway's envelope keys. `defaultMode` 0440 with the pods' `fsGroup`
  # (controllers.gateway.pod / controllers.worker.pod) lets the distroless
  # nonroot uid (65532) read them and nobody else; the worker mounts the
  # `current` key alone, at the path its flag names.
  envelope-keys:
    type: secret
    name: '{{ required "existingSecrets.envelopeKeys.name is required" .Values.existingSecrets.envelopeKeys.name }}'
    defaultMode: 288 # 0440 octal, spelled in decimal so no YAML parser reads it otherwise
    advancedMounts:
      gateway:
        main:
          - path: /run/envelope
            readOnly: true
      worker:
        main:
          - path: /run/envelope/current.pem
            subPath: envelope-current.pem
            readOnly: true
  console-composer-key:
    type: secret
    name: '{{ .Values.existingSecrets.consoleComposerKey.name }}'
    advancedMounts:
      admin:
        main:
          - path: /secrets
            readOnly: true
