---
{{- include "bjw-s.common.loader.init" . }}

{{/*
Same pattern bjw-s-labs/app-template's own templates/common.yaml uses
(that chart is itself nothing but this file plus a Chart.yaml dependency
on common) — set a sane default nameOverride from the release name so
`helm install vsms deploy/charts/vsms` without any --set flags still
produces predictable, DNS-safe resource names, while leaving
`.Values.global.nameOverride` free for an operator who wants something
else.
*/}}
{{- define "vsms.hardcodedValues" -}}
{{- if not .Values.global.nameOverride }}
global:
  nameOverride: "{{ .Release.Name }}"
{{- end }}
{{- end -}}
{{- $_ := mergeOverwrite .Values (include "vsms.hardcodedValues" . | fromYaml) -}}

{{/*
R4 (CONTRIBUTING.md): the admin console is optional, and installing this
chart with it switched off must not require a single console-only value.
`admin.enabled` is the toggle — applied here, not in values.yaml itself,
because values.yaml is loaded as plain data and is never templated as a
whole (only the specific field classes that file's own header documents
go through common's selective `tpl` pass — `env` values,
`image.{repository,tag,digest}`, `persistence.*.name`, `ingress.*.hosts`
— and a controller's own `enabled` flag is deliberately not one of them,
confirmed against common's own
templates/lib/controller/_enabled_controllers.tpl). This template *is*
a real Go-template pass, so it can mutate the merged values before
`generate` ever runs, the same trick already used above for
`global.nameOverride`.

`controllers.admin.enabled` and `service.admin.enabled` have to flip
together, not just the controller: common's own service validate step
(templates/lib/service/_validate.tpl) hard-`fail`s with "No enabled
controller found with this identifier" the instant a Service references
a controller that doesn't exist, so leaving `service.admin` on with its
controller off would break the render instead of quietly omitting it.
`ingress.admin` is forced off too, defensively — it already defaults to
`false` (deploy/charts/vsms/values.yaml's own "operator has an opinion
about their own ingress" section), but common's own ingress validate
does not check that its target Service is actually enabled, so an
operator who had separately turned it on would otherwise render a
dangling Ingress pointing at nothing.

`persistence.console-private-key` has to flip too, and not for the
reason first assumed while writing this: it is only *mounted* while
building the admin controller's own pod spec
(templates/lib/pod/fields/_volumes.tpl resolves `advancedMounts` per
controller identifier, so a disabled controller's mounts are simply
never visited) — but common's own global chart validate
(templates/lib/chart/_validate.tpl) walks every *enabled* persistence
item's `advancedMounts` unconditionally, independent of controller
rendering, and `fail`s "No enabled controller found with this
identifier" the moment one names a controller that isn't enabled.
Verified live, not assumed: `helm template --set admin.enabled=false`
hit exactly that error before this line was added.
*/}}
{{- if not .Values.admin.enabled }}
{{- $_ := set .Values.controllers.admin "enabled" false -}}
{{- $_ := set .Values.service.admin "enabled" false -}}
{{- $_ := set .Values.ingress.admin "enabled" false -}}
{{- $_ := set (index .Values.persistence "console-private-key") "enabled" false -}}
{{- end -}}

{{/*
MTN is optional, and an unconfigured MTN must leave *no* MTN env var
behind — not even an empty one. This is not tidiness; it is the
difference between a gateway that starts and one that does not.

`sms-gateway`/`sms-worker` take the MTN credentials as `Option<T>` clap
args bound to these env vars, and clap reads an env var that is *present
but empty* as a value, not as absence. Verified against clap 4 directly
rather than assumed:

  - `Option<String>` with `MTN_CLIENT_ID=""` yields `Some("")`, which
    trips `mtn_credentials`' all-or-none check ("all five must be set
    together, or none") and aborts startup.
  - `Option<f64>` with `MTN_TPS_CEILING=""` is worse still: clap fails to
    parse before any of this repo's own validation runs, with
    `invalid value '' for '--mtn-tps-ceiling': cannot parse float from
    empty string`. The container never starts, and the message points at
    a flag the operator never set.

values.yaml cannot express this itself — it is loaded as plain data and
only specific field *values* go through common's selective `tpl` pass
(see this file's own R4 note above), so a `{{ if }}` there could blank a
value but never remove the key. This template is a real Go-template pass
over the merged values, so it can delete the keys outright, the same
mutate-before-generate trick `global.nameOverride` and `admin.enabled`
already use.

Keyed on `mtn.clientId` alone: it is the first of the five the binary
requires, so a deployment that sets it and forgets the rest gets this
repo's own explicit all-or-none error rather than a silent half-config.
*/}}
{{- if not .Values.mtn.clientId }}
{{- range $controller := list "gateway" "worker" }}
{{- $env := (index $.Values.controllers $controller "containers" "main" "env") }}
{{- range $key := list "MTN_CLIENT_ID" "MTN_CLIENT_SECRET" "MTN_SERVICE_CODE" "MTN_SENDER_ID" "MTN_BASE_URL" "MTN_TPS_CEILING" "MTN_COST_PER_SEGMENT_XAF" "MTN_SUPPORTS_ALPHANUMERIC_SENDER" }}
{{- $_ := unset $env $key }}
{{- end }}
{{- end }}
{{- end -}}

{{/*
Providers. The gateway refuses to start with no provider configured at all
(Orange, MTN, or AWS' events topic), and the worker refuses `--roles
dispatch` likewise. Failing here instead gives the operator the message at
`helm template` time rather than as a crash-looping Pod.
*/}}
{{- if not (or .Values.orange.clientId .Values.mtn.clientId .Values.awsSms.region .Values.awsSms.eventsTopicArn) }}
{{- fail "no SMS provider is configured: set orange.clientId, mtn.clientId, awsSms.region and/or awsSms.eventsTopicArn" }}
{{- end }}

{{/*
Orange is optional now that it is not the only provider, and an AWS-only (or
MTN-only) deployment must leave *no* Orange env var behind - the same
present-but-empty hazard as MTN above (`ORANGE_CM_CLIENT_ID=""` is
`Some("")` to clap and trips the all-or-none check). ORANGE_CM_BASE_URL is
left alone: it always has a value and the binary defaults it anyway.

Stripping them also removes the chart's former render-time `required` on
orange.clientId; the "no provider at all" check above replaces it.

seedDispatch is switched off with it, for a reason beyond tidiness: it
seeds an `orange_cm` Provider row *and a catch-all Route*. In a deployment
whose worker holds no Orange credentials that route would still win the
weighted draw for about half of all messages, and dispatch would keep
retrying a provider it cannot resolve.
*/}}
{{- if not .Values.orange.clientId }}
{{- range $controller := list "gateway" "worker" }}
{{- $env := (index $.Values.controllers $controller "containers" "main" "env") }}
{{- range $key := list "ORANGE_CM_CLIENT_ID" "ORANGE_CM_CLIENT_SECRET" "ORANGE_CM_SENDER_NUMBER" }}
{{- $_ := unset $env $key }}
{{- end }}
{{- end }}
{{- $_ := set .Values.controllers.seedDispatch "enabled" false -}}
{{- end -}}

{{/*
AWS End User Messaging SMS is optional, and an unconfigured AWS must leave
*no* AWS_SMS_* env var behind, for the MTN reasons above. Two independent
switches because the two binaries are independent:

  - the worker's whole AWS block is keyed on `awsSms.region` (the first of
    the six it requires together, so a half-filled block gets the binary's
    own all-or-none error). Its three optional variables are additionally
    stripped one by one when empty, because an empty `Option<String>` is
    `Some("")` and an empty `AWS_SMS_MESSAGE_TYPE` fails to parse;
  - the gateway needs only `AWS_SMS_EVENTS_TOPIC_ARN` (no credentials), keyed
    on `awsSms.eventsTopicArn`.

`seedDispatchAws` is switched on by either, and its args are assembled here
because a controller's `args` list is not passed through `tpl`. Flags are
appended only when their value is set, so the subcommand's own defaults
apply otherwise. The gateway resolves a Provider row for every provider it
is configured with before binding its listener, which is why each provider
needs its own seed.
*/}}
{{- if not .Values.awsSms.region }}
{{- $env := (index $.Values.controllers "worker" "containers" "main" "env") }}
{{- range $key := list "AWS_SMS_REGION" "AWS_SMS_ACCESS_KEY_ID" "AWS_SMS_SECRET_ACCESS_KEY" "AWS_SMS_CONFIGURATION_SET" "AWS_SMS_TPS_CEILING" "AWS_SMS_COST_PER_SEGMENT_XAF" "AWS_SMS_ORIGINATION_IDENTITY" "AWS_SMS_MESSAGE_TYPE" "AWS_SMS_SUPPORTS_ALPHANUMERIC_SENDER" "AWS_SMS_ENDPOINT_URL" "AWS_SMS_TIME_TO_LIVE_SECONDS" }}
{{- $_ := unset $env $key }}
{{- end }}
{{- else }}
{{- $env := (index $.Values.controllers "worker" "containers" "main" "env") }}
{{- if not .Values.awsSms.originationIdentity }}{{- $_ := unset $env "AWS_SMS_ORIGINATION_IDENTITY" }}{{- end }}
{{- if not .Values.awsSms.messageType }}{{- $_ := unset $env "AWS_SMS_MESSAGE_TYPE" }}{{- end }}
{{- if not .Values.awsSms.endpointUrl }}{{- $_ := unset $env "AWS_SMS_ENDPOINT_URL" }}{{- end }}
{{- if not .Values.awsSms.timeToLiveSeconds }}{{- $_ := unset $env "AWS_SMS_TIME_TO_LIVE_SECONDS" }}{{- end }}
{{- end }}
{{- if not .Values.awsSms.eventsTopicArn }}
{{- $_ := unset (index $.Values.controllers "gateway" "containers" "main" "env") "AWS_SMS_EVENTS_TOPIC_ARN" }}
{{- end }}
{{- if or .Values.awsSms.region .Values.awsSms.eventsTopicArn }}
{{- $seed := list "seed-dispatch" "--key" "aws_sms" "--kind" "aggregator_http" "--display-name" "AWS End User Messaging SMS" "--credential-ref" "env:AWS_SMS_SECRET_ACCESS_KEY" }}
{{- if .Values.awsSms.tpsCeiling }}{{- $seed = concat $seed (list "--max-tps" (toString .Values.awsSms.tpsCeiling)) }}{{- end }}
{{- if .Values.awsSms.costPerSegmentXaf }}{{- $seed = concat $seed (list "--cost-per-segment-xaf" (toString .Values.awsSms.costPerSegmentXaf)) }}{{- end }}
{{- $_ := set .Values.controllers.seedDispatchAws "enabled" true -}}
{{- $_ := set .Values.controllers.seedDispatchAws.containers.main "args" $seed -}}
{{- end -}}

{{/*
SSO is optional, and an unconfigured SSO must leave *no* SSO env var behind
on the gateway - the same hazard as MTN above, for the same reason: a
present-but-empty env var is a value to clap, not an absence (and, for the
list-valued ones, a one-element list holding an empty string). The gateway
does normalise blanks to "unset" itself, so this is belt and braces rather
than the only line of defence, but the chart should not hand a process
variables it was told nothing about.

Keyed on `sso.issuer` alone: a deployment that sets it and forgets the rest
gets the chart's own `required` messages at render time, and the gateway's
own all-or-none error at start, rather than a silently half-configured SSO.
Only the gateway controller: the worker and the console need none of it (the
console learns SSO exists from the gateway's discovery document).
*/}}
{{- if not .Values.sso.issuer }}
{{- $env := (index $.Values.controllers "gateway" "containers" "main" "env") }}
{{- range $key := list "SMS_SSO_ISSUER" "SMS_SSO_CLIENT_ID" "SMS_SSO_CLIENT_SECRET" "SMS_SSO_REDIRECT_URI" "SMS_SSO_SCOPES" "SMS_SSO_REQUIRED_GROUP" "SMS_SSO_GROUPS_CLAIM" "SMS_SSO_ACCEPTED_AMR" "SMS_SSO_ACCEPTED_ACR" "SMS_SSO_JIT_ROLE" }}
{{- $_ := unset $env $key }}
{{- end }}
{{- end -}}

{{ include "bjw-s.common.loader.generate" . }}
