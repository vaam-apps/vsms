---
{{- include "bjw-s.common.loader.init" . }}

{{/*
Same pattern bjw-s-labs/app-template's own templates/common.yaml uses
(that chart is itself nothing but this file plus a Chart.yaml dependency
on common) — set a sane default nameOverride from the release name so
`helm install vsms deploy/charts/vsms` without any --set flags still
produces predictable, DNS-safe resource names, while leaving
`.Values.global.nameOverride` free for an operator who wants something
else.
*/}}
{{- define "vsms.hardcodedValues" -}}
{{- if not .Values.global.nameOverride }}
global:
  nameOverride: "{{ .Release.Name }}"
{{- end }}
{{- end -}}
{{- $_ := mergeOverwrite .Values (include "vsms.hardcodedValues" . | fromYaml) -}}

{{/*
R4 (CONTRIBUTING.md): the admin console is optional, and installing this
chart with it switched off must not require a single console-only value.
`admin.enabled` is the toggle — applied here, not in values.yaml itself,
because values.yaml is loaded as plain data and is never templated as a
whole (only the specific field classes that file's own header documents
go through common's selective `tpl` pass — `env` values,
`image.{repository,tag,digest}`, `persistence.*.name`, `ingress.*.hosts`
— and a controller's own `enabled` flag is deliberately not one of them,
confirmed against common's own
templates/lib/controller/_enabled_controllers.tpl). This template *is*
a real Go-template pass, so it can mutate the merged values before
`generate` ever runs, the same trick already used above for
`global.nameOverride`.

`controllers.admin.enabled` and `service.admin.enabled` have to flip
together, not just the controller: common's own service validate step
(templates/lib/service/_validate.tpl) hard-`fail`s with "No enabled
controller found with this identifier" the instant a Service references
a controller that doesn't exist, so leaving `service.admin` on with its
controller off would break the render instead of quietly omitting it.
`ingress.admin` is forced off too, defensively — it already defaults to
`false` (deploy/charts/vsms/values.yaml's own "operator has an opinion
about their own ingress" section), but common's own ingress validate
does not check that its target Service is actually enabled, so an
operator who had separately turned it on would otherwise render a
dangling Ingress pointing at nothing.

`persistence.console-private-key` has to flip too, and not for the
reason first assumed while writing this: it is only *mounted* while
building the admin controller's own pod spec
(templates/lib/pod/fields/_volumes.tpl resolves `advancedMounts` per
controller identifier, so a disabled controller's mounts are simply
never visited) — but common's own global chart validate
(templates/lib/chart/_validate.tpl) walks every *enabled* persistence
item's `advancedMounts` unconditionally, independent of controller
rendering, and `fail`s "No enabled controller found with this
identifier" the moment one names a controller that isn't enabled.
Verified live, not assumed: `helm template --set admin.enabled=false`
hit exactly that error before this line was added.
*/}}
{{- if not .Values.admin.enabled }}
{{- $_ := set .Values.controllers.admin "enabled" false -}}
{{- $_ := set .Values.service.admin "enabled" false -}}
{{- $_ := set .Values.ingress.admin "enabled" false -}}
{{- $_ := set (index .Values.persistence "console-private-key") "enabled" false -}}
{{- end -}}

{{/*
MTN is optional, and an unconfigured MTN must leave *no* MTN env var
behind — not even an empty one. This is not tidiness; it is the
difference between a gateway that starts and one that does not.

`sms-gateway`/`sms-worker` take the MTN credentials as `Option<T>` clap
args bound to these env vars, and clap reads an env var that is *present
but empty* as a value, not as absence. Verified against clap 4 directly
rather than assumed:

  - `Option<String>` with `MTN_CLIENT_ID=""` yields `Some("")`, which
    trips `mtn_credentials`' all-or-none check ("all five must be set
    together, or none") and aborts startup.
  - `Option<f64>` with `MTN_TPS_CEILING=""` is worse still: clap fails to
    parse before any of this repo's own validation runs, with
    `invalid value '' for '--mtn-tps-ceiling': cannot parse float from
    empty string`. The container never starts, and the message points at
    a flag the operator never set.

values.yaml cannot express this itself — it is loaded as plain data and
only specific field *values* go through common's selective `tpl` pass
(see this file's own R4 note above), so a `{{ if }}` there could blank a
value but never remove the key. This template is a real Go-template pass
over the merged values, so it can delete the keys outright, the same
mutate-before-generate trick `global.nameOverride` and `admin.enabled`
already use.

Keyed on `mtn.clientId` alone: it is the first of the five the binary
requires, so a deployment that sets it and forgets the rest gets this
repo's own explicit all-or-none error rather than a silent half-config.
*/}}
{{- if not .Values.mtn.clientId }}
{{- range $controller := list "gateway" "worker" }}
{{- $env := (index $.Values.controllers $controller "containers" "main" "env") }}
{{- range $key := list "MTN_CLIENT_ID" "MTN_CLIENT_SECRET" "MTN_SERVICE_CODE" "MTN_SENDER_ID" "MTN_BASE_URL" "MTN_TPS_CEILING" "MTN_COST_PER_SEGMENT_XAF" "MTN_SUPPORTS_ALPHANUMERIC_SENDER" }}
{{- $_ := unset $env $key }}
{{- end }}
{{- end }}
{{- end -}}

{{ include "bjw-s.common.loader.generate" . }}
