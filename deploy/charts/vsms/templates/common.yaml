---
{{- include "bjw-s.common.loader.init" . }}

{{/*
Same pattern bjw-s-labs/app-template's own templates/common.yaml uses
(that chart is itself nothing but this file plus a Chart.yaml dependency
on common) — set a sane default nameOverride from the release name so
`helm install vsms deploy/charts/vsms` without any --set flags still
produces predictable, DNS-safe resource names, while leaving
`.Values.global.nameOverride` free for an operator who wants something
else.
*/}}
{{- define "vsms.hardcodedValues" -}}
{{- if not .Values.global.nameOverride }}
global:
  nameOverride: "{{ .Release.Name }}"
{{- end }}
{{- end -}}
{{- $_ := mergeOverwrite .Values (include "vsms.hardcodedValues" . | fromYaml) -}}

{{/*
R4 (CONTRIBUTING.md): the admin console is optional, and installing this
chart with it switched off must not require a single console-only value.
`admin.enabled` is the toggle — applied here, not in values.yaml itself,
because values.yaml is loaded as plain data and is never templated as a
whole (only the specific field classes that file's own header documents
go through common's selective `tpl` pass — `env` values,
`image.{repository,tag,digest}`, `persistence.*.name`, `ingress.*.hosts`
— and a controller's own `enabled` flag is deliberately not one of them,
confirmed against common's own
templates/lib/controller/_enabled_controllers.tpl). This template *is*
a real Go-template pass, so it can mutate the merged values before
`generate` ever runs, the same trick already used above for
`global.nameOverride`.

`controllers.admin.enabled` and `service.admin.enabled` have to flip
together, not just the controller: common's own service validate step
(templates/lib/service/_validate.tpl) hard-`fail`s with "No enabled
controller found with this identifier" the instant a Service references
a controller that doesn't exist, so leaving `service.admin` on with its
controller off would break the render instead of quietly omitting it.
`ingress.admin` is forced off too, defensively — it already defaults to
`false` (deploy/charts/vsms/values.yaml's own "operator has an opinion
about their own ingress" section), but common's own ingress validate
does not check that its target Service is actually enabled, so an
operator who had separately turned it on would otherwise render a
dangling Ingress pointing at nothing.

`persistence.console-composer-key` has to flip too, and not for the
reason first assumed while writing this: it is only *mounted* while
building the admin controller's own pod spec
(templates/lib/pod/fields/_volumes.tpl resolves `advancedMounts` per
controller identifier, so a disabled controller's mounts are simply
never visited) — but common's own global chart validate
(templates/lib/chart/_validate.tpl) walks every *enabled* persistence
item's `advancedMounts` unconditionally, independent of controller
rendering, and `fail`s "No enabled controller found with this
identifier" the moment one names a controller that isn't enabled.
Verified live, not assumed: `helm template --set admin.enabled=false`
hit exactly that error before this line was added.
*/}}
{{- if not .Values.admin.enabled }}
{{- $_ := set .Values.controllers.admin "enabled" false -}}
{{- $_ := set .Values.service.admin "enabled" false -}}
{{- $_ := set .Values.ingress.admin "enabled" false -}}
{{- $_ := set (index .Values.persistence "console-composer-key") "enabled" false -}}
{{- end -}}

{{/*
VSC-1: the chart's guards. Each is a combination of values that is well-typed
and still cannot work, and each calls `fail`, which aborts `helm lint`,
`helm template`, `helm install` and `helm upgrade` alike. Every message starts
with `vsms chart guard "<name>":` so a test can assert which guard fired.

retired-values: the structured `orange.*`, `mtn.*` and `awsSms.*` values were
removed. They were the chart's copy of flags the binaries no longer have, and
silently ignoring a release that still sets them would deploy a gateway with no
provider (or, worse, with the one an earlier release configured and nobody
meant to keep). The same hard cutover the binaries make: refuse, and say where
the value went. `config.createOverlayConfigMap` goes the same way: it could only
ever be true, and a switch that cannot be turned off is dormant configuration.
*/}}
{{- range $retired := list "orange" "mtn" "awsSms" }}
{{- if hasKey $.Values $retired }}
{{- fail (printf "vsms chart guard \"retired-values\": values.%s was removed. A provider is no longer a chart value: it is a `providers` entry in the YAML overlay (config.overlay), read by sms-gateway and sms-worker alike, and its secret stays in existingSecrets.%s as the `${...}` placeholder of the same name (docs/architecture.md, section 9.4; docs/runbooks/deployment.adoc, \"Kubernetes (Helm)\"). Delete values.%s." $retired $retired $retired) }}
{{- end }}
{{- end }}
{{- if hasKey .Values.config "createOverlayConfigMap" }}
{{- fail "vsms chart guard \"retired-values\": values.config.createOverlayConfigMap was removed. The overlay ConfigMap is always rendered, because the overlay is always required (guard \"config-overlay\"); there is no switch to leave it out. Delete values.config.createOverlayConfigMap." }}
{{- end }}

{{/*
config-overlay: the baked base file configures no provider, and the gateway
refuses to start with none, so a release with no overlay is a crash-looping Pod
found at `kubectl get pods` instead of here. The overlay is always required;
there is no switch to leave it out. The profile names a file, so it is held to
what a file name in this position can safely be, and the overlay may not hold
`{{`: common renders a ConfigMap's data through `tpl`, and a YAML overlay has no
use for a template action.
*/}}
{{- if not (trim .Values.config.overlay) }}
{{- fail "vsms chart guard \"config-overlay\": config.overlay must hold the YAML overlay. The image's base configuration (/config/application.yml) lists no SMS provider, and sms-gateway refuses to start with none. See the comment above `config:` in values.yaml for a minimal overlay." }}
{{- end }}
{{- if contains "{{" .Values.config.overlay }}
{{- fail "vsms chart guard \"config-overlay-template\": config.overlay contains `{{`, which Helm would evaluate as a template action when it renders the ConfigMap. The overlay is YAML read by the process, and `${VAR}` (not `{{ }}`) is its placeholder syntax." }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9][a-z0-9-]*$" .Values.config.profile) }}
{{- fail (printf "vsms chart guard \"config-profile\": config.profile is %q; it names the file application-<profile>.yml and must match ^[a-z0-9][a-z0-9-]*$." .Values.config.profile) }}
{{- end }}

{{/*
The overlay's ConfigMap and its mount. The ConfigMap is common's own `configMaps`
item, and the persistence item below names it by `identifier`, so one helper
names both sides after the `global.nameOverride` set at the top of this file.
That is the point of doing it this way: a ConfigMap rendered from a separate
template file is rendered BEFORE this one (Helm orders by reverse path), computes
its name before `global.nameOverride` is set, and so is named for the release
while the Pods mount the name common derives; for any release name without
"vsms" in it they disagree, and the Pods hang in ContainerCreating.

The key is the file name the process looks for beside its base config
(`<stem>-<profile>.<ext>`, sms_config's profile_overlay_path), and it is mounted
with `subPath`, so it IS the mounted file name. A persistence item's `path` is
not passed through `tpl`, and the file name carries the profile, so both are
built here, in a real template pass: the same mutate-before-generate trick
`global.nameOverride` and `admin.enabled` use. `subPath` is load-bearing: see the
comment above `config:` in values.yaml. The gateway and the worker mount the
same file.

The operator's own `configMaps` (a ConfigMap of theirs, mounted through
`persistence`) are kept: the overlay is merged in beside them rather than
assigned over the map, which used to drop them (mounted by `identifier` the
render failed with a misleading "no enabled configMap" error, mounted by `name`
the ConfigMap was silently not rendered). Only the key `overlay`
is the chart's, and an operator's `configMaps.overlay` is refused
(guard `config-maps-overlay`).
*/}}
{{- $overlayFile := printf "application-%s.yml" .Values.config.profile }}
{{- $operatorConfigMaps := default (dict) .Values.configMaps }}
{{- if hasKey $operatorConfigMaps "overlay" }}
{{- fail "vsms chart guard \"config-maps-overlay\": values.configMaps.overlay is defined, and `overlay` is the key this chart renders config.overlay under. Use another key for your own ConfigMap: this one is the chart's, and replacing it would unmount the overlay." }}
{{- end }}
{{- $_ := set .Values "configMaps" (merge (dict "overlay" (dict "enabled" true "suffix" "config" "data" (dict $overlayFile .Values.config.overlay))) $operatorConfigMaps) -}}
{{- $overlayMount := list (dict "path" (printf "%s/%s" (dir .Values.config.path) $overlayFile) "subPath" $overlayFile "readOnly" true) }}
{{- $_ := set (index .Values.persistence "config-overlay") "advancedMounts" (dict "gateway" (dict "main" $overlayMount) "worker" (dict "main" $overlayMount)) -}}

{{/*
The process reads its configuration once, at start (no hot reload), and a
ConfigMap mounted with `subPath` does not update in place, so an edit to the
overlay has to restart the Pods. common does that: it puts a
`checksum/configMaps` annotation, a hash of every ConfigMap the chart renders,
on every controller's pod template (bjw-s common 4.6.2), so the template
changes exactly when the overlay does. This chart used to add a second
annotation of its own, `checksum/sms-config`, to the gateway and the worker; it
said the same thing and is gone. The one difference is the reach: common's
checksum also rolls the admin console and the migrate and seed Jobs' pods on an
overlay edit (docs/runbooks/deployment.adoc, "Kubernetes (Helm)").
.xtask/src/chart_render.rs holds it: it renders the chart twice with different
overlay text and requires the gateway's and the worker's `checksum/configMaps`
to differ.
*/}}

{{/*
A provider's secret is optional, and an unconfigured one must leave *no* env var
behind - not even an empty one. The overlay reads the secret as `${NAME}`, and an
env var that is present-but-empty is a secretKeyRef to a Secret named ""
(rejected by the API server), where an absent one is simply not there. values.yaml
cannot express this itself - it is loaded as plain data, and only specific field
*values* go through common's selective `tpl` pass (see this file's own R4 note
above) - so a `{{ if }}` there could blank a value but never remove the key.
This template is a real Go-template pass over the merged values, so it can
delete the keys outright, the same trick as above.

The pepper is the one secret that is never optional; its `required` is in
values.yaml.
*/}}
{{- range $secret := list (list "orange" "ORANGE_CM_CLIENT_SECRET") (list "mtn" "MTN_CLIENT_SECRET") (list "awsSms" "AWS_SMS_SECRET_ACCESS_KEY") }}
{{- if not (index $.Values.existingSecrets (index $secret 0) "name") }}
{{- range $controller := list "gateway" "worker" }}
{{- $_ := unset (index $.Values.controllers $controller "containers" "main" "env") (index $secret 1) }}
{{- end }}
{{- end }}
{{- end }}

{{ include "bjw-s.common.loader.generate" . }}
