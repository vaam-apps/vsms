{{/*
VSC-1: the YAML overlay (config.overlay), rendered into a ConfigMap that
templates/common.yaml mounts, with `subPath`, over
/config/application-<profile>.yml in the gateway and the worker.

The key is the file name the process looks for beside its base config
(`<stem>-<profile>.<ext>`, sms_config's profile_overlay_path). It is mounted
with `subPath`, so this key IS the mounted file name: get it wrong and the
process finds no overlay and says nothing, because a profile that names no
file loads the base alone. The guard "config-overlay" in common.yaml has
already refused an empty overlay by the time this renders.

The name must equal `persistence.config-overlay.name` in values.yaml.
*/}}
{{- if .Values.config.createOverlayConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bjw-s.common.lib.chart.names.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  application-{{ .Values.config.profile }}.yml: |
{{ .Values.config.overlay | indent 4 }}
{{- end }}
