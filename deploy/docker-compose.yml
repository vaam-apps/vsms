# §9.2's deployment shape: Docker Compose on one VM, Caddy terminating TLS
# in front of sms-gateway and admin, Postgres as the only coordination
# mechanism, sms-worker running the singleton + scale-to-N roles.
#
# `docker compose --env-file .env up -d --build` brings up the backend
# only: postgres, migrate, sms-gateway, sms-worker (plus backup and
# prometheus, both unconditional — R4: a backend-only deployment must
# stay observable). `admin` and `caddy` both carry `profiles: [console]`
# (CONTRIBUTING.md's R4 — "the admin console is optional, the backend
# must run without it") — add `--profile console` (or
# `COMPOSE_PROFILES=console`) to bring them up too. See
# docs/runbooks/deployment.md's own "Backend-only deployment" section for
# what a console-off run looks like end to end, and `admin`'s/`caddy`'s
# own comments below for exactly what each needs only once that profile
# is active.
#
# postgres's own port is intentionally never published to the host: every
# other service reaches it over this compose network's internal DNS
# (`postgres:5432`). This machine may already be running an unrelated
# postgres container on 5432 — nothing here should be able to collide
# with it even by accident.

name: vsms

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vsms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vsms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies backends/migrations/postgres/{0001_init,0002_bootstrap}
  # exactly once each (tracked in a `schema_migrations` table this deploy
  # path owns — see backends/apps/sms-migrate/src/main.rs's own module doc), guarded
  # by a Postgres advisory lock so a redeploy that starts this alongside a
  # still-running previous instance can't apply the same migration twice
  # concurrently. Exits 0 and stops; sms-gateway and sms-worker both wait
  # on `service_completed_successfully`, not just `service_started`.
  migrate:
    build:
      context: ..
      dockerfile: backends/apps/sms-migrate/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vsms}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-vsms}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  sms-gateway:
    build:
      context: ..
      dockerfile: backends/apps/sms-gateway/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vsms}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-vsms}
      # The externally reachable https origin Caddy fronts this service
      # at — never the in-container listen address. Every token this OP
      # mints carries this as `iss`; get it wrong and every token this
      # deployment issues validates against the wrong issuer.
      SMS_OIDC_ISSUER: ${SMS_OIDC_ISSUER:?set to the public https origin, e.g. https://api.example.com}
      ORANGE_CM_CLIENT_ID: ${ORANGE_CM_CLIENT_ID:?}
      ORANGE_CM_CLIENT_SECRET: ${ORANGE_CM_CLIENT_SECRET:?}
      ORANGE_CM_SENDER_NUMBER: ${ORANGE_CM_SENDER_NUMBER:?}
      ORANGE_CM_BASE_URL: ${ORANGE_CM_BASE_URL:-https://api.orange.com}
      # #134/#140: the server-held pepper behind Message.msisdnHash/bodyHash
      # (HMAC-SHA256, sms_api::pepper) — real secret material, minimum 32
      # bytes, validated at startup (`sms-gateway serve` refuses to bind on
      # a missing or too-short value, never silently at the first
      # sendMessage call). Only sms-gateway needs this; sms-worker never
      # computes either hash.
      SMS_HASH_PEPPER: ${SMS_HASH_PEPPER:?generate one via `openssl rand -base64 48`}
      # #153: IdempotencyLayer/RateLimitLayer configuration — see
      # docs/architecture.md §4.5/§4.6 and sms_api::router's own doc for
      # what each does and why these particular defaults are safe.
      # Optional: each falls back to `sms-gateway serve`'s own CLI default
      # (24h / burst 120 / 2 tok/s) when unset here, same as SMS_GATEWAY_LOG
      # below.
      SMS_IDEMPOTENCY_TTL_SECS: ${SMS_IDEMPOTENCY_TTL_SECS:-86400}
      SMS_RATE_LIMIT_BURST: ${SMS_RATE_LIMIT_BURST:-120}
      SMS_RATE_LIMIT_REFILL_PER_SECOND: ${SMS_RATE_LIMIT_REFILL_PER_SECOND:-2.0}
      # #163: the coarser, ConnectInfo-peer-keyed RateLimitLayer on top of
      # the per-principal one above — see sms_api::router's own doc for
      # why it closes the forged-sub bypass and why its budget is wider.
      SMS_SOURCE_RATE_LIMIT_BURST: ${SMS_SOURCE_RATE_LIMIT_BURST:-1200}
      SMS_SOURCE_RATE_LIMIT_REFILL_PER_SECOND: ${SMS_SOURCE_RATE_LIMIT_REFILL_PER_SECOND:-10.0}
      # #168: the /token client_id-keyed defence-in-depth limiter — see
      # backends/apps/sms-gateway/src/token_rate_limit.rs's own module doc for why
      # this exists alongside, not instead of, deploy/Caddyfile's edge
      # zones.
      SMS_TOKEN_RATE_LIMIT_BURST: ${SMS_TOKEN_RATE_LIMIT_BURST:-10}
      SMS_TOKEN_RATE_LIMIT_REFILL_PER_SECOND: ${SMS_TOKEN_RATE_LIMIT_REFILL_PER_SECOND:-0.3333333333333333}
      RUST_LOG: ${SMS_GATEWAY_LOG:-sms_gateway=info,sms_api=info,cratestack=info}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # #157: overrides the image's own baked-in `HEALTHCHECK`
    # (backends/apps/sms-gateway/Dockerfile), which is deliberately liveness-only
    # (`sms-gateway healthcheck` against /healthz — see
    # backends/apps/sms-gateway/src/health.rs's module doc for why that route never
    # touches the database). Compose has only
    # one health-check concept, and it drives two things: the container's
    # own reported status, and every `depends_on: condition: service_healthy`
    # below (admin, caddy) that waits on this service. Both are better
    # served by readiness than liveness here — `admin` and `caddy` should
    # not start routing to a gateway that's up but can't reach its
    # database, and an operator running `docker compose ps` should see
    # "unhealthy" reflect a real inability to serve, not just "the process
    # is running." /readyz does a bare `SELECT 1` on the pool (see
    # health.rs's own doc for why that's the R1-exception-worthy version of
    # this check, not a CrateStack delegate call).
    #
    # interval=5s, retries=3 (~15s to flip unhealthy) mirrors
    # deploy/charts/vsms/values.yaml's own readiness `periodSeconds`/
    # `failureThreshold` choice and its reasoning: long enough to ride out
    # a brief Postgres blip without flapping, short enough that a real
    # outage is visible quickly. timeout=3s matches the chart's own
    # readiness `timeoutSeconds`, sized just above /readyz's internal 2s
    # budget (health.rs's READINESS_TIMEOUT) so a slow database round-trip
    # is reported by the route itself, not by this healthcheck's own
    # timeout. start_period=10s matches the image's own liveness
    # `--start-period`, since /readyz can't return anything meaningful
    # before the process has even bound its listener.
    #
    # Exec-form (a JSON array, not `CMD-SHELL`): backends/apps/sms-gateway/Dockerfile's
    # runtime image is distroless `static`, which has no `/bin/sh` for
    # `CMD-SHELL` to invoke and no `curl` for it to run even if it could.
    # `sms-gateway healthcheck --path /readyz` (backends/apps/sms-gateway/src/main.rs)
    # is the same plain HTTP/1.1-over-a-raw-socket check the old `curl`
    # command ran, reproduced in `std`-only Rust.
    healthcheck:
      test: ['CMD', '/usr/local/bin/sms-gateway', 'healthcheck', '--path', '/readyz']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    # sms-gateway needs an active OP signing key to start AT ALL — found
    # live (#139): `Command::Serve` in backends/apps/sms-gateway/src/main.rs loads
    # signing keys before binding the listener, so a fresh database makes
    # this container crash-loop, not just fail its first /token request
    # (AGENTS.md's own M1 prose describes the latter; it's stale). Run
    # once, on a fresh database, BEFORE the first `up` of this service —
    # `run --rm`, not `exec`, since there's no running container to exec
    # into yet:
    #   docker compose run --rm sms-gateway rotate-signing-key
    # See docs/runbooks/deployment.md's step 3.
    #
    # Same trap, same fix, for the `orange_cm` Provider row (#148):
    # `resolve_provider_row_id` also runs before the listener binds, so a
    # database with no Provider row crash-loops this container exactly
    # like a missing signing key does. `seed-dispatch` (renamed from
    # `seed-provider` in #62, which also made it seed a catch-all Route —
    # a Provider row alone routes nothing since #62's routing engine
    # landed) is idempotent on both halves, so it's safe to run again
    # later too, not just on a fresh database:
    #   docker compose run --rm sms-gateway seed-dispatch
    # See docs/runbooks/deployment.md's step 4.

  sms-worker:
    build:
      context: ..
      dockerfile: backends/apps/sms-worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vsms}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-vsms}
      # §7.1's five implemented roles (smpp is M7 scaffold-only). §9.2's
      # own diagram runs a second, scale-to-N-only node
      # (--roles hooks,jobs) alongside this singleton-holding one once
      # load calls for it — not added here by default; see
      # docs/runbooks/deployment.md for that as a documented day-2 step
      # rather than a service this compose file stands up unused.
      SMS_WORKER_ROLES: ${SMS_WORKER_ROLES:-dispatch,drain,scheduler,hooks,jobs}
      ORANGE_CM_CLIENT_ID: ${ORANGE_CM_CLIENT_ID:?}
      ORANGE_CM_CLIENT_SECRET: ${ORANGE_CM_CLIENT_SECRET:?}
      ORANGE_CM_SENDER_NUMBER: ${ORANGE_CM_SENDER_NUMBER:?}
      ORANGE_CM_BASE_URL: ${ORANGE_CM_BASE_URL:-https://api.orange.com}
      RUST_LOG: ${SMS_WORKER_LOG:-sms_worker=info,sms_worker_bin=info}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # R4 (CONTRIBUTING.md): the admin console is optional, and a bare
  # `docker compose up` must bring up a working gateway + worker + migrate
  # with it switched off — not started-then-idle, not present-but-
  # unconfigured. `profiles: [console]` below is what actually gates it;
  # `docker compose --env-file .env --profile console up -d` (or
  # `COMPOSE_PROFILES=console`) is what turns it back on. See
  # docs/runbooks/deployment.md's own "Backend-only deployment" section.
  #
  # Every console-only var below moved from `:?` (hard required) to `:-`
  # (optional, defaults to empty) for a reason that isn't obvious from a
  # profile alone: Compose interpolates every service's `environment:`
  # block up front, while parsing the file, before it ever decides which
  # services the active profile set actually includes — confirmed live,
  # not assumed (`docker compose config` with `admin` still on `:?` and no
  # `--profile console` failed on `ADMIN_BASE_URL` even though `admin`
  # would never have been started). A `:?` here would fail *every*
  # `docker compose up`, console on or off, the moment the var is unset —
  # exactly the violation this PR closes. The application itself still
  # fails loudly on a genuine misconfiguration once it actually starts:
  # `@vsms/env`'s own zod validation refuses to boot without a real
  # `ADMIN_BASE_URL`/`SMS_CONSOLE_SESSION_SECRET`/`SMS_CONSOLE_CLIENT_ID`,
  # so the fail-loud property survives, just moved from "at `docker
  # compose up` for the whole stack" to "at container start for this one
  # service" — the correct scope once the service itself is opt-in.
  admin:
    build:
      context: ..
      dockerfile: frontends/apps/admin/Dockerfile
    restart: unless-stopped
    profiles: [console]
    environment:
      # #194 replaced the DASHBOARD_AUTH Basic gate with a real
      # authorization_code + PKCE login. It was a hard cutover, not a
      # parallel path, so those three vars are gone entirely rather than
      # optional. ADMIN_BASE_URL must be the public origin a browser
      # actually reaches this console at: the redirect_uri registered by
      # `sms-gateway seed-console-client` is compared as a whole string
      # (RFC 6749 3.1.2), not by prefix, so an internal or loopback
      # address here silently breaks every login.
      ADMIN_BASE_URL: ${ADMIN_BASE_URL:-}
      SMS_CONSOLE_OIDC_CLIENT_ID: ${SMS_CONSOLE_OIDC_CLIENT_ID:-sms-console}
      SMS_CONSOLE_SESSION_SECRET: ${SMS_CONSOLE_SESSION_SECRET:-}
      # Plain http: the gateway is reached over this compose network's own
      # internal DNS, never the public internet — Caddy is the only thing
      # that terminates TLS (§9.2). @vsms/env's own cross-field rule
      # would otherwise demand the three mTLS cert paths below for an
      # https:// upstream, which don't exist in this deployment.
      SMS_API_URL: http://sms-gateway:8080
      # SMS_OIDC_ISSUER is not console-only — sms-gateway itself requires
      # it unconditionally (see that service's own `:?` above), so this
      # reference is always safe to interpolate even though it's read a
      # second time here.
      SMS_AUTH_ISSUER: ${SMS_OIDC_ISSUER:?}
      # `sms-gateway provision-client` (not a stub — see
      # app/sms-gateway/src/main.rs's `Command::ProvisionClient`) mints
      # this pair: `--client-id-out`/`--key-out` write the values these
      # two vars need. See docs/runbooks/deployment.md's own console
      # section for the exact invocation — the private key is mounted
      # read-only below rather than passed through a plain env var.
      SMS_CONSOLE_CLIENT_ID: ${SMS_CONSOLE_CLIENT_ID:-}
      SMS_CONSOLE_PRIVATE_KEY_PATH: /secrets/console-private-key.pem
      SMS_CONSOLE_SCOPE: ${SMS_CONSOLE_SCOPE:-sms:send sms:read job:read job:enqueue worker:read}
      MESSAGE_STREAM_POLL_MS: ${MESSAGE_STREAM_POLL_MS:-2000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-vsms Admin Console}
      NODE_ENV: production
    volumes:
      - ./secrets/console-private-key.pem:/secrets/console-private-key.pem:ro
    depends_on:
      sms-gateway:
        condition: service_healthy

  # #69: the only thing standing between this deployment and unrecoverable
  # data loss. Nightly pg_dump (custom format) + a small unencrypted
  # manifest (postgres version, applied migration names, and a SHA-256
  # *fingerprint* of SMS_HASH_PEPPER — never the pepper itself), pushed to
  # an operator-supplied rclone remote. See
  # docs/runbooks/backup-restore.md for the pg_dump-vs-WAL decision, the
  # scripted restore drill (deploy/restore-drill.sh), and why the pepper
  # is part of the recoverable state, not just the database.
  #
  # BACKUP_RCLONE_REMOTE has no default on purpose — a bare
  # ${VAR:?...} means this service refuses to start rather than silently
  # backing up to nowhere. deploy/secrets/rclone.conf holds the remote's
  # own credentials (same gitignored-directory convention as
  # secrets/console-private-key.pem — see deployment.md's "Secrets"
  # section) and must exist before this service starts; an empty or
  # missing rclone.conf is fine only when BACKUP_RCLONE_REMOTE is a bare
  # local path (a drill, or a deliberately same-disk backup — see the
  # runbook for why that's not sufficient on its own for production).
  backup:
    build:
      context: ..
      dockerfile: deploy/backup.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vsms}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-vsms}
      SMS_HASH_PEPPER: ${SMS_HASH_PEPPER:?}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:?set to an rclone remote:path, e.g. s3:my-bucket/vsms-backups — see deploy/.env.example}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 3 * * *}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-true}
    volumes:
      - ./secrets/rclone.conf:/root/.config/rclone/rclone.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # R4: gated behind the same `console` profile as `admin`, not because
  # this edge is console-specific in what it fronts (it also terminates
  # TLS for sms-gateway's own domain) but because `deploy/Caddyfile` is
  # one file with two unconditional site blocks — `{$SMS_GATEWAY_DOMAIN}`
  # and `{$SMS_ADMIN_DOMAIN}` — and neither is owned by this PR (see its
  # own header for why: it's a third-party-module build, out of scope
  # here). There is no way to make only the second block optional without
  # editing that file, and gating this whole service is the only change
  # available that is both correct and doesn't touch it. A backend-only
  # compose deployment therefore gets no bundled TLS edge for sms-gateway
  # either — front it with your own reverse proxy/ingress, the same "BYO"
  # posture deploy/charts/vsms/values.yaml already takes for
  # `ingress.gateway` (disabled by default, operator's own opinion) — or
  # enable this profile anyway and simply never start `admin` itself
  # (`docker compose --profile console up -d sms-gateway sms-worker
  # migrate caddy`), accepting `SMS_ADMIN_DOMAIN` as a real DNS record
  # this deployment happens not to use.
  #
  # Not stock caddy:2-alpine — the Caddyfile uses `rate_limit` (#156),
  # a third-party module absent from the official image, so Caddy would
  # fail to parse its own config at startup and the edge would never come
  # up. deploy/caddy.Dockerfile is an xcaddy build adding it, pinned to a
  # specific upstream commit (no tagged release carries the `ipv6_prefix`
  # option this config needs).
  caddy:
    build:
      context: ..
      dockerfile: deploy/caddy.Dockerfile
    restart: unless-stopped
    profiles: [console]
    environment:
      # Not console-only in what they configure, but only interpolated
      # (and only load-bearing) when this service actually runs — see
      # this service's own comment above for why they can't be `:?`
      # regardless (Compose interpolates every service's environment
      # up front, independent of the active profile set; a required var
      # here would fail a bare `docker compose up` even with `caddy`
      # never started). Caddy itself still fails loudly on an empty site
      # address the moment `--profile console` is actually used without
      # them set.
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-}
      SMS_GATEWAY_DOMAIN: ${SMS_GATEWAY_DOMAIN:-}
      SMS_ADMIN_DOMAIN: ${SMS_ADMIN_DOMAIN:-}
    ports:
      # Not hardcoded 80/443: this machine may already have something
      # bound to those. Set to 80/443 in .env for a real deploy with a
      # public DNS record; the defaults here are for a local/demo run.
      - '${CADDY_HTTP_PORT:-8080}:80'
      - '${CADDY_HTTPS_PORT:-8443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      sms-gateway:
        condition: service_healthy
      admin:
        condition: service_healthy

  # #70/#71: scrapes sms-gateway:9090 and sms-worker:9091 (deploy/prometheus/
  # prometheus.yml) and evaluates deploy/prometheus/alerts.yml — the five
  # conditions #70's own issue names. Optional in the sense that nothing
  # else in this stack depends on it (sms-gateway/sms-worker already expose
  # their own /metrics regardless of whether anything scrapes them — see
  # backends/crates/sms-api/src/metrics.rs's own doc), but stood up unconditionally
  # here rather than behind a compose profile: this repository's own
  # delivery convention is to build a thing and make it live, not ship it
  # dormant behind a flag. No Alertmanager alongside it — this repo cannot
  # page anyone (see deploy/prometheus/alerts.yml's own header), so the
  # honest deliverable stops at "the rules evaluate and Prometheus's own
  # /alerts page shows firing state," which needs no receiver configured.
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      # Loopback only — this is an operator convenience for reaching the
      # Prometheus UI/API directly (`curl localhost:9099/api/v1/alerts`),
      # never fronted by Caddy and never meant to be internet-reachable.
      # A different host port from either scrape target's own in-container
      # port (9090/9091) purely to avoid a confusing coincidence — there is
      # no actual collision risk either way, since these are three
      # separate containers.
      - '127.0.0.1:9099:9090'
    depends_on:
      sms-gateway:
        condition: service_healthy
      sms-worker:
        condition: service_started

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  prometheus_data:
