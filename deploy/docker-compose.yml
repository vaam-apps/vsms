# §9.2's deployment shape: Docker Compose on one VM, Caddy terminating TLS
# in front of sms-gateway and admin, Postgres as the only coordination
# mechanism, sms-worker running the singleton + scale-to-N roles.
#
# `docker compose --env-file .env up -d --build` brings up the backend
# only: postgres, migrate, sms-gateway, sms-worker (plus backup and
# prometheus, both unconditional — R4: a backend-only deployment must
# stay observable). `admin` and `caddy` both carry `profiles: [console]`
# (CONTRIBUTING.md's R4 — "the admin console is optional, the backend
# must run without it") — add `--profile console` (or
# `COMPOSE_PROFILES=console`) to bring them up too. See
# docs/runbooks/deployment.adoc's own "Backend-only deployment" section for
# what a console-off run looks like end to end, and `admin`'s/`caddy`'s
# own comments below for exactly what each needs only once that profile
# is active.
#
# postgres's own port is intentionally never published to the host: every
# other service reaches it over this compose network's internal DNS
# (`postgres:5432`). This machine may already be running an unrelated
# postgres container on 5432 — nothing here should be able to collide
# with it even by accident.
#
# Production-readiness audit (S6): `migrate`/`sms-gateway`/`sms-worker`/
# `admin` each carry both `build:` (source, the default path — nothing
# below changes what a bare `docker compose up -d --build` does) and a
# matching `image:` referencing the four images `.github/workflows/release.yml`
# publishes, so `docker compose pull && docker compose up -d` (no
# `--build`) is also a real, working path once a tagged release exists —
# see the "Releasing a new version" section of `docs/runbooks/deployment.adoc`
# for both paths spelled out. `VSMS_IMAGE_OWNER` defaults to `vaam-apps`,
# this repository's own GitHub owner as of `v0.3.1` — the owner has moved
# twice: every image through `v0.2.1` published under `vymalo`, `v0.3.0`
# alone published under `vaam-store`, and `v0.3.1` on lands under
# `vaam-apps` (`.github/workflows/release.yml` publishes to
# `ghcr.io/${{ github.repository_owner }}/...` unconditionally, which is
# correct and untouched here). Pulling an older release means setting
# BOTH `VSMS_IMAGE_OWNER` and `VSMS_IMAGE_TAG` together, never one
# without the other.

name: vsms

x-logging: &default-logging
  # Production-readiness audit (S8): the default `json-file` driver with
  # no `max-size` grows unboundedly — a long-running `sms-gateway`/
  # `sms-worker` under real traffic will eventually fill the host disk
  # with its own logs. Bounded, not disabled: `docker logs`/`docker
  # compose logs` still work identically, this only caps how much any one
  # container's log file is allowed to grow to before rotating.
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    # Production-readiness audit (S9): conservative floors for a
    # single-VM deployment with no real traffic yet, not a tuned
    # production ceiling — the one service everything else depends on
    # gets the largest share. Raise these once real traffic/data volume
    # is known; a Postgres instance OOM-killed under `mem_limit` is worse
    # than an unbounded one on a VM sized for this stack alone.
    mem_limit: 2g
    cpus: 2.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vsms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vsms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies backends/migrations/postgres/{0001_init,0002_bootstrap}
  # exactly once each (tracked in a `schema_migrations` table this deploy
  # path owns — see backends/apps/sms-migrate/src/main.rs's own module doc), guarded
  # by a Postgres advisory lock so a redeploy that starts this alongside a
  # still-running previous instance can't apply the same migration twice
  # concurrently. Exits 0 and stops; sms-gateway and sms-worker both wait
  # on `service_completed_successfully`, not just `service_started`.
  migrate:
    build:
      context: ..
      dockerfile: backends/apps/sms-migrate/Dockerfile
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-apps}/vsms-migrate:${VSMS_IMAGE_TAG:-v0.10.0} # x-release-please-version
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vsms}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-vsms}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  sms-gateway:
    build:
      context: ..
      dockerfile: backends/apps/sms-gateway/Dockerfile
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-apps}/vsms-sms-gateway:${VSMS_IMAGE_TAG:-v0.10.0} # x-release-please-version
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vsms}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-vsms}
      # VSC-1: everything a deployment decides - the pool size, the idempotency
      # and rate-limit policy, and every provider's host, settings and
      # credentials - is the YAML document `config/application.yml` plus the
      # `prod` profile overlay (`config/application-prod.yml`, mounted below so
      # an edit needs a restart, not a rebuild). Docs: docs/architecture.md,
      # section 9.4 and docs/runbooks/deployment.adoc.
      #
      # The overlay reads the variables below as `${NAME}`. Each is a
      # pass-through (a bare `NAME:` with no value): it is forwarded when the
      # shell or `.env` sets it and absent otherwise, and the process refuses to
      # start on a `${NAME}` that is absent, naming it. Add one line per
      # `${NAME}` you add to the overlay. A variable a PREVIOUS release read as
      # a flag (`ORANGE_CM_BASE_URL`, `SMS_RATE_LIMIT_BURST`, `AWS_SMS_REGION`,
      # ...) and the overlay does not read is refused at boot, naming the YAML
      # key that replaced it - the compose file no longer forwards the
      # ones that moved.
      SMS_PROFILE: ${SMS_PROFILE:-prod}
      SMS_GATEWAY_DOMAIN: ${SMS_GATEWAY_DOMAIN:?}
      ORANGE_CM_CLIENT_ID:
      ORANGE_CM_CLIENT_SECRET:
      ORANGE_CM_SENDER_NUMBER:
      # MTN and AWS: uncomment the matching lines when the overlay's example
      # blocks are enabled.
      # MTN_CLIENT_ID:
      # MTN_CLIENT_SECRET:
      # MTN_SERVICE_CODE:
      # MTN_TPS_CEILING:
      # MTN_COST_PER_SEGMENT_XAF:
      # AWS_SMS_ACCESS_KEY_ID:
      # AWS_SMS_SECRET_ACCESS_KEY:
      # AWS_SMS_CONFIGURATION_SET:
      # AWS_SMS_TPS_CEILING:
      # AWS_SMS_COST_PER_SEGMENT_XAF:
      # AWS_SMS_EVENTS_TOPIC_ARN:
      # VSA-4c: single sign-on. Uncomment this line when the overlay's
      # `human_login.sso.client_secret` is `${SMS_SSO_CLIENT_SECRET}`. It stays a
      # bare key, never `SMS_SSO_CLIENT_SECRET:` with a value and never an empty
      # `${...:-}`: a variable that is present and not read by the overlay (even
      # an empty one) is refused at boot, as the old flag is retired. Only
      # sms-gateway gets it; the worker drops `human_login.sso` and is not given it.
      # SMS_SSO_CLIENT_SECRET:
      # #134/#140: the server-held pepper behind Message.msisdnHash/bodyHash
      # (HMAC-SHA256, sms_api::pepper) - real secret material, minimum 32
      # bytes, validated at startup (`sms-gateway serve` refuses to bind on
      # a missing or too-short value, never silently at the first
      # sendMessage call). The base config reads it as `${SMS_HASH_PEPPER}`
      # (`security.hash_pepper`). Only sms-gateway reads it: the worker does
      # not load `security.*`, and its service is not given the variable.
      SMS_HASH_PEPPER: ${SMS_HASH_PEPPER:?generate one via `openssl rand -base64 48`}
      # VS-3: the signed transport's two Ed25519 server keys (PKCS#8 PEM,
      # `openssl genpkey -algorithm ed25519`), mounted below. REQUIRED: the
      # gateway refuses to start without both, and refuses the same key
      # twice. Integrators pin the public halves printed by
      # `docker compose run --rm sms-gateway server-keys`. Generate them
      # once and keep them out of git (docs/runbooks/deployment.adoc).
      SMS_ENVELOPE_SIGNING_KEY_FILE: /run/envelope/current.pem
      SMS_ENVELOPE_NEXT_SIGNING_KEY_FILE: /run/envelope/next.pem
      RUST_LOG: ${SMS_GATEWAY_LOG:-sms_gateway=info,sms_api=info,sms_auth=info,sms_provider_aws_sms=info,cratestack=info}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # #157: overrides the image's own baked-in `HEALTHCHECK`
    # (backends/apps/sms-gateway/Dockerfile), which is deliberately liveness-only
    # (`sms-gateway healthcheck` against /healthz — see
    # backends/apps/sms-gateway/src/health.rs's module doc for why that route never
    # touches the database). Compose has only
    # one health-check concept, and it drives two things: the container's
    # own reported status, and every `depends_on: condition: service_healthy`
    # below (admin, caddy) that waits on this service. Both are better
    # served by readiness than liveness here — `admin` and `caddy` should
    # not start routing to a gateway that's up but can't reach its
    # database, and an operator running `docker compose ps` should see
    # "unhealthy" reflect a real inability to serve, not just "the process
    # is running." /readyz does a bare `SELECT 1` on the pool (see
    # health.rs's own doc for why that's the R1-exception-worthy version of
    # this check, not a CrateStack delegate call).
    #
    # interval=5s, retries=3 (~15s to flip unhealthy) mirrors
    # deploy/charts/vsms/values.yaml's own readiness `periodSeconds`/
    # `failureThreshold` choice and its reasoning: long enough to ride out
    # a brief Postgres blip without flapping, short enough that a real
    # outage is visible quickly. timeout=3s matches the chart's own
    # readiness `timeoutSeconds`, sized just above /readyz's internal 2s
    # budget (health.rs's READINESS_TIMEOUT) so a slow database round-trip
    # is reported by the route itself, not by this healthcheck's own
    # timeout. start_period=10s matches the image's own liveness
    # `--start-period`, since /readyz can't return anything meaningful
    # before the process has even bound its listener.
    #
    # Exec-form (a JSON array, not `CMD-SHELL`): backends/apps/sms-gateway/Dockerfile's
    # runtime image is distroless `static`, which has no `/bin/sh` for
    # `CMD-SHELL` to invoke and no `curl` for it to run even if it could.
    # `sms-gateway healthcheck --path /readyz` (backends/apps/sms-gateway/src/main.rs)
    # is the same plain HTTP/1.1-over-a-raw-socket check the old `curl`
    # command ran, reproduced in `std`-only Rust.
    # The two envelope keys, read-only, owned by the gateway's uid (65532)
    # at mode 0400 - see the comment on SMS_ENVELOPE_SIGNING_KEY_FILE above.
    volumes:
      - ./secrets/envelope-current.pem:/run/envelope/current.pem:ro
      - ./secrets/envelope-next.pem:/run/envelope/next.pem:ro
    # The `prod` overlay, from the repository you cloned: edit
    # `config/application-prod.yml` and `docker compose up -d` restarts the
    # service on it, with no rebuild. A top-level `configs:` entry, not a bind
    # mount: a bind mount whose host path is missing is silently created as an
    # empty directory, and `configs:` fails `up` naming the path.
    configs:
      - source: sms_config_overlay
        target: /config/application-prod.yml
    healthcheck:
      test: ['CMD', '/usr/local/bin/sms-gateway', 'healthcheck', '--path', '/readyz']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    # sms-gateway needs a `Provider` row for every provider it is configured
    # with to start AT ALL — there is no signing key of an OpenID Provider to
    # seed any more (VS-4 deleted it; the only keys the process holds are the
    # two envelope keys mounted above).
    #
    # The `orange_cm` Provider row (#148): `resolve_provider_row_id` runs
    # before the listener binds, so a database with no Provider row
    # crash-loops this container. `seed-dispatch` (renamed from
    # `seed-provider` in #62, which also made it seed a catch-all Route —
    # a Provider row alone routes nothing since #62's routing engine
    # landed) is idempotent on both halves, so it's safe to run again
    # later too, not just on a fresh database:
    #   docker compose run --rm sms-gateway seed-dispatch
    #
    # `seed-dispatch` seeds ONE provider per invocation (default
    # `orange_cm`), and the gateway resolves a Provider row for every
    # provider it is configured with before binding. For AWS End User
    # Messaging SMS run it once more with that provider's key:
    #   docker compose run --rm sms-gateway seed-dispatch \
    #     --key aws_sms --kind aggregator_http \
    #     --display-name 'AWS End User Messaging SMS' \
    #     --credential-ref env:AWS_SMS_SECRET_ACCESS_KEY \
    #     --max-tps "$AWS_SMS_TPS_CEILING" \
    #     --cost-per-segment-xaf "$AWS_SMS_COST_PER_SEGMENT_XAF"
    # For an AWS-ONLY deployment run exactly that and NOT the bare
    # `seed-dispatch` or `bootstrap` below: both seed `orange_cm` with a
    # catch-all Route, which would take about half of all traffic to a
    # provider the worker holds no credentials for.
    #
    # Production-readiness audit (N2): `docker compose run --rm sms-gateway
    # bootstrap --owner-email ... --owner-display-name ...`
    # chains `seed-dispatch` and `provision-user` in one idempotent call — see `Command::Bootstrap`'s own doc comment
    # (`backends/apps/sms-gateway/src/main.rs`) and
    # `docs/runbooks/deployment.adoc`'s step 3 for both the combined form
    # and each individual step spelled out.

  sms-worker:
    build:
      context: ..
      dockerfile: backends/apps/sms-worker/Dockerfile
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-apps}/vsms-sms-worker:${VSMS_IMAGE_TAG:-v0.10.0} # x-release-please-version
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vsms}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-vsms}
      # §7.1's five implemented roles (smpp is M7 scaffold-only). §9.2's
      # own diagram runs a second, scale-to-N-only node
      # (--roles hooks,jobs) alongside this singleton-holding one once
      # load calls for it — not added here by default; see
      # docs/runbooks/deployment.adoc for that as a documented day-2 step
      # rather than a service this compose file stands up unused.
      SMS_WORKER_ROLES: ${SMS_WORKER_ROLES:-dispatch,drain,scheduler,hooks,jobs}
      # The same YAML document as sms-gateway's, and so the same pass-through
      # variables (see the sms-gateway block above for why). With `dispatch` in
      # SMS_WORKER_ROLES the worker refuses to start unless the overlay
      # configures at least one provider.
      SMS_PROFILE: ${SMS_PROFILE:-prod}
      SMS_GATEWAY_DOMAIN: ${SMS_GATEWAY_DOMAIN:?}
      ORANGE_CM_CLIENT_ID:
      ORANGE_CM_CLIENT_SECRET:
      ORANGE_CM_SENDER_NUMBER:
      # MTN_CLIENT_ID:
      # MTN_CLIENT_SECRET:
      # MTN_SERVICE_CODE:
      # MTN_TPS_CEILING:
      # MTN_COST_PER_SEGMENT_XAF:
      # AWS_SMS_ACCESS_KEY_ID:
      # AWS_SMS_SECRET_ACCESS_KEY:
      # AWS_SMS_CONFIGURATION_SET:
      # AWS_SMS_TPS_CEILING:
      # AWS_SMS_COST_PER_SEGMENT_XAF:
      # AWS_SMS_EVENTS_TOPIC_ARN:
      # No SMS_HASH_PEPPER: the worker does not load `security.*`, so it is not
      # given the secret (the gateway's service above is).
      # VS-8: a sealed webhook delivery is a request signed with the gateway's
      # own envelope signing key, so the `hooks` role (in SMS_WORKER_ROLES by
      # default) needs the CURRENT key to deliver a `sealed` endpoint (an
      # `hmac` endpoint, VS-8R, needs none, and without the key `hooks` still
      # starts and delivers it, but claims no sealed endpoint's attempt: they
      # wait without spending an attempt, and it warns how many, naming the flag). It is
      # the very file the gateway signs its answers with, so a receiver pins
      # one pair of public keys for both. Only this one: the `next` key signs
      # nothing and the worker never reads it. A worker that does not run
      # `hooks` reads no key at all.
      SMS_ENVELOPE_SIGNING_KEY_FILE: /run/envelope/current.pem
      RUST_LOG: ${SMS_WORKER_LOG:-sms_worker=info,sms_worker_bin=info}
    # Read-only, mode 0400 and owned by uid 65532, like the gateway's copy of
    # the same file (see the comment on its volumes): 65532 is the distroless
    # `nonroot` user both images run as, so one `chown` serves both. Read once
    # at start-up, so a rotation restarts the worker together with the gateway
    # (docs/runbooks/deployment.adoc, "Rotating the envelope keys").
    volumes:
      - ./secrets/envelope-current.pem:/run/envelope/current.pem:ro
    # The same overlay as sms-gateway's: one document, so the two cannot
    # disagree about a provider.
    configs:
      - source: sms_config_overlay
        target: /config/application-prod.yml
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # R4 (CONTRIBUTING.md): the admin console is optional, and a bare
  # `docker compose up` must bring up a working gateway + worker + migrate
  # with it switched off — not started-then-idle, not present-but-
  # unconfigured. `profiles: [console]` below is what actually gates it;
  # `docker compose --env-file .env --profile console up -d` (or
  # `COMPOSE_PROFILES=console`) is what turns it back on. See
  # docs/runbooks/deployment.adoc's own "Backend-only deployment" section.
  #
  # Every console-only var below uses `:-` (optional, defaults to empty), not
  # `:?`, for a reason that isn't obvious from a profile alone: Compose
  # interpolates every service's `environment:` block up front, while parsing
  # the file, before it ever decides which services the active profile set
  # actually includes. A `:?` here would fail *every* `docker compose up`,
  # console on or off, the moment the var is unset - exactly the violation R4
  # forbids. The application itself still fails loudly on a genuine
  # misconfiguration once it actually starts: `@vsms/env`'s own zod validation
  # refuses to boot without the gateway's two public keys, so the fail-loud
  # property survives, just moved from "at `docker compose up` for the whole
  # stack" to "at container start for this one service".
  #
  # There is no login here: no client id, no session secret, no issuer, no
  # public origin to register. The console is a page whose browser holds a key
  # a vaam admin phone vouched for (or `sms-gateway pair-console-key`
  # attached); the server only carries sealed bytes
  # (docs/design/console-pairing.md). What it is configured with is where the
  # gateway is, the gateway's two PUBLIC sealing keys (the browser pins them),
  # and the composer's own service key.
  admin:
    build:
      context: ..
      dockerfile: frontends/apps/admin/Dockerfile
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-apps}/vsms-admin:${VSMS_IMAGE_TAG:-v0.10.0} # x-release-please-version
    restart: unless-stopped
    profiles: [console]
    environment:
      # Plain http: the gateway is reached over this compose network's own
      # internal DNS, never the public internet - Caddy is the only thing
      # that terminates TLS (§9.2). @vsms/env's own cross-field rule
      # would otherwise demand the three mTLS cert paths for an
      # https:// upstream, which don't exist in this deployment.
      SMS_API_URL: http://sms-gateway:8080
      # `sms-gateway server-keys` prints both (`current:` and `next:`); they
      # are public values. Required by the console, and they must be the pair
      # the gateway signs with, or the browser believes no answer.
      SMS_ENVELOPE_SERVER_KEY_CURRENT: ${SMS_ENVELOPE_SERVER_KEY_CURRENT:-}
      SMS_ENVELOPE_SERVER_KEY_NEXT: ${SMS_ENVELOPE_SERVER_KEY_NEXT:-}
      # The composer's Ed25519 service key, registered with `sms-gateway
      # register-client --client-name console-composer`
      # (docs/runbooks/deployment.adoc, "The composer's key"). Mounted below as
      # a `configs:` reference, never passed through an env var.
      SMS_COMPOSER_KEY_FILE: /run/secrets/console-composer.pem
      MESSAGE_STREAM_POLL_MS: ${MESSAGE_STREAM_POLL_MS:-2000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-vsms Admin Console}
      NODE_ENV: production
    # A plain `volumes:` bind mount onto a host path that does not yet exist is
    # created *silently as an empty directory* by the Docker daemon. A
    # `configs:` reference fails `docker compose up` outright with "bind source
    # path does not exist" instead, the same fail-loud property this repo's own
    # §9.2 expects of every other missing-prerequisite case. `uid`/`mode` are
    # accepted by the Compose *file* schema but ignored by the Compose *CLI*
    # outside swarm mode, so the operator `chown`s the host file to the console's
    # uid (10001, `frontends/apps/admin/Dockerfile`) at mode 0400, as the
    # envelope keys are for the gateway's.
    configs:
      - source: console_composer_key
        target: /run/secrets/console-composer.pem
    depends_on:
      sms-gateway:
        condition: service_healthy
    logging: *default-logging
    mem_limit: 1g
    cpus: 1.0

  # #69: the only thing standing between this deployment and unrecoverable
  # data loss. Nightly pg_dump (custom format) + a small unencrypted
  # manifest (postgres version, applied migration names, and a SHA-256
  # *fingerprint* of SMS_HASH_PEPPER — never the pepper itself), pushed to
  # an operator-supplied rclone remote. See
  # docs/runbooks/backup-restore.adoc for the pg_dump-vs-WAL decision, the
  # scripted restore drill (`vsms-backup restore-drill`, deploy/backup-tool
  # — deploy/restore-drill.sh no longer exists, per the
  # containerize-tooling rewrite), and why the pepper is part of the
  # recoverable state, not just the database.
  #
  # BACKUP_RCLONE_REMOTE has no default on purpose — a bare
  # ${VAR:?...} means this service refuses to start rather than silently
  # backing up to nowhere. deploy/secrets/rclone.conf holds the remote's
  # own credentials (same gitignored-directory convention as
  # secrets/console-composer.pem — see deployment.adoc's "Secrets"
  # section). Production-readiness audit (B2): this file must now exist
  # before `up`, full stop, even when `BACKUP_RCLONE_REMOTE` is a bare
  # local path and rclone needs no real credentials — `deploy/secrets/rclone.conf.example`
  # is committed specifically so `cp`-ing it (empty is fine for the
  # local-path case) is always step 1, never conditional on which case
  # applies. Before this, a `volumes:` bind mount onto a not-yet-existing
  # host path was silently created as an empty *directory* by the Docker
  # daemon — reproduced live in this PR's own verification — and rclone
  # would fail obscurely against a directory where it expected a config
  # file. The `configs:` reference below fails `docker compose up`
  # outright instead, the same fail-loud property `admin`'s own
  # `console_composer_key` config above already gets.
  backup:
    build:
      context: ..
      dockerfile: deploy/backup.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vsms}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-vsms}
      SMS_HASH_PEPPER: ${SMS_HASH_PEPPER:?}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:?set to an rclone remote:path, e.g. s3:my-bucket/vsms-backups — see deploy/.env.example}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 3 * * *}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-true}
      # Documented in .env.example; both `schedule` and `healthcheck` read it,
      # so it must reach the service or the .env entry is inert.
      BACKUP_HEALTH_FILE: ${BACKUP_HEALTH_FILE:-/tmp/vsms-backup-last-success}
    configs:
      - source: rclone_conf
        target: /root/.config/rclone/rclone.conf
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # R4: gated behind the same `console` profile as `admin`, not because
  # this edge is console-specific in what it fronts (it also terminates
  # TLS for sms-gateway's own domain) but because `deploy/Caddyfile` is
  # one file with two unconditional site blocks — `{$SMS_GATEWAY_DOMAIN}`
  # and `{$SMS_ADMIN_DOMAIN}` — and neither is owned by this PR (see its
  # own header for why: it's a third-party-module build, out of scope
  # here). There is no way to make only the second block optional without
  # editing that file, and gating this whole service is the only change
  # available that is both correct and doesn't touch it. A backend-only
  # compose deployment therefore gets no bundled TLS edge for sms-gateway
  # either — front it with your own reverse proxy/ingress, the same "BYO"
  # posture deploy/charts/vsms/values.yaml already takes for
  # `ingress.gateway` (disabled by default, operator's own opinion).
  #
  # Production-readiness audit (S7): an earlier revision of this comment
  # suggested "enable this profile anyway and simply never start `admin`
  # itself" as a way to get `caddy` up without it — that doesn't work and
  # was never tested: `caddy`'s own `depends_on: admin: condition:
  # service_healthy` below means Compose starts `admin` as a transitive
  # dependency the moment `caddy` is requested, regardless of which
  # service names are listed on the command line. There is no way to
  # bring `caddy` up without `admin` also starting; the only real
  # backend-only options are the reverse-proxy/ingress BYO path above, or
  # accepting both.
  #
  # Not stock caddy:2-alpine — the Caddyfile uses `rate_limit` (#156),
  # a third-party module absent from the official image, so Caddy would
  # fail to parse its own config at startup and the edge would never come
  # up. deploy/caddy.Dockerfile is an xcaddy build adding it, pinned to a
  # specific upstream commit (no tagged release carries the `ipv6_prefix`
  # option this config needs).
  caddy:
    build:
      context: ..
      dockerfile: deploy/caddy.Dockerfile
    restart: unless-stopped
    profiles: [console]
    logging: *default-logging
    mem_limit: 256m
    cpus: 1.0
    environment:
      # Not console-only in what they configure, but only interpolated
      # (and only load-bearing) when this service actually runs — see
      # this service's own comment above for why they can't be `:?`
      # regardless (Compose interpolates every service's environment
      # up front, independent of the active profile set; a required var
      # here would fail a bare `docker compose up` even with `caddy`
      # never started). Caddy itself still fails loudly on an empty site
      # address the moment `--profile console` is actually used without
      # them set.
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-}
      SMS_GATEWAY_DOMAIN: ${SMS_GATEWAY_DOMAIN:-}
      SMS_ADMIN_DOMAIN: ${SMS_ADMIN_DOMAIN:-}
    ports:
      # Not hardcoded 80/443: this machine may already have something
      # bound to those. Set to 80/443 in .env for a real deploy with a
      # public DNS record; the defaults here are for a local/demo run.
      - '${CADDY_HTTP_PORT:-8080}:80'
      - '${CADDY_HTTPS_PORT:-8443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      sms-gateway:
        condition: service_healthy
      admin:
        condition: service_healthy

  # #70/#71: scrapes sms-gateway:9090 and sms-worker:9091 (deploy/prometheus/
  # prometheus.yml) and evaluates deploy/prometheus/alerts.yml — the five
  # conditions #70's own issue names. Optional in the sense that nothing
  # else in this stack depends on it (sms-gateway/sms-worker already expose
  # their own /metrics regardless of whether anything scrapes them — see
  # backends/crates/sms-api/src/metrics.rs's own doc), but stood up unconditionally
  # here rather than behind a compose profile: this repository's own
  # delivery convention is to build a thing and make it live, not ship it
  # dormant behind a flag. No Alertmanager alongside it — this repo cannot
  # page anyone (see deploy/prometheus/alerts.yml's own header), so the
  # honest deliverable stops at "the rules evaluate and Prometheus's own
  # /alerts page shows firing state," which needs no receiver configured.
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      # Loopback only — this is an operator convenience for reaching the
      # Prometheus UI/API directly (`curl localhost:9099/api/v1/alerts`),
      # never fronted by Caddy and never meant to be internet-reachable.
      # A different host port from either scrape target's own in-container
      # port (9090/9091) purely to avoid a confusing coincidence — there is
      # no actual collision risk either way, since these are three
      # separate containers.
      - '127.0.0.1:9099:9090'
    depends_on:
      sms-gateway:
        condition: service_healthy
      sms-worker:
        condition: service_started

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  prometheus_data:

# Production-readiness audit (B1/B2): both files below are real, host-
# specific credentials this repo never commits (deploy/secrets/ is
# gitignored except for the two example/placeholder files — see
# .gitignore's own comment) and must exist, as real files, before the
# service referencing them starts — see each config's own referencing
# service (`admin`/`backup`, above) for the "why `configs:` instead of
# `volumes:`" reasoning. `deploy/secrets/rclone.conf.example` and
# `deploy/secrets/.gitkeep` are what make `deploy/secrets/` itself exist
# in a fresh clone at all.
configs:
  console_composer_key:
    file: ./secrets/console-composer.pem
  rclone_conf:
    file: ./secrets/rclone.conf
  # VSC-1: the `prod` profile of the YAML deployment configuration, shared by
  # sms-gateway and sms-worker. Committed (it holds `${VAR}` placeholders, never
  # a secret: `cargo xtask config-literal-secrets`), so unlike the two above it
  # exists in a fresh clone.
  sms_config_overlay:
    file: ../config/application-prod.yml
