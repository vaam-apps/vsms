[workspace]
resolver = "3"
members = [
  "backends/crates/sms-core",
  "backends/crates/sms-encoding",
  "backends/crates/sms-msisdn",
  "backends/crates/sms-webhook",
  # #70/#71: Prometheus metric definitions shared by sms-api and
  # sms-worker — pure, no schema/framework dependency, same reasoning as
  # sms-webhook above for living below both.
  "backends/crates/sms-metrics",
  "backends/crates/sms-api",
  "backends/crates/sms-auth",
  "backends/crates/sms-worker",
  "backends/crates/sms-provider",
  "backends/crates/sms-provider-orange-cm",
  "backends/crates/sms-provider-mtn",
  "backends/crates/sms-routing",
  "backends/crates/sms-fake-orange",
  "backends/crates/sms-test-support",
  "backends/apps/sms-gateway",
  "backends/apps/sms-worker",
  "backends/apps/sms-fake-orange",
  "backends/apps/sms-migrate",
  # Demo-only: seeds the App/SenderId fixtures compose.demo.yaml needs.
  # Moved out of backends/apps/sms-gateway (formerly `Command::SeedDemoApp`) so no
  # demo-seeding logic is compiled into the production sms-gateway image —
  # see backends/apps/vsms-demo-seed/src/main.rs's own module doc.
  "backends/apps/vsms-demo-seed",
  # Repo automation ("no bash scripts — xtask + Docker" is the standing
  # direction): a dot-directory at the repo root, invoked via the
  # `[alias] xtask` in .cargo/config.toml, mirroring the sibling vpay
  # repo's own xtask shape. Deliberately depends on nothing above it in
  # this list — no sms-api, nothing that expands `include_server_schema!`
  # — so `cargo xtask <check>` stays fast to build even though it lives in
  # the same workspace.
  ".xtask",
]
# examples/rust is its own, separate [workspace] (see its own Cargo.toml
# and examples/README.md) — an integrator's copy-pasteable client, kept
# out of this workspace's dependency graph and version pins on purpose.
# `exclude` isn't strictly load-bearing today (nothing above adds it via a
# glob), but it documents the boundary explicitly and keeps it true if
# `members` above ever grows a glob.
#
# sdks/rust is the same shape for the same reason (#171): vsms-sdk-rust is
# meant for external, independent publishing to crates.io, so it picks its
# own dependency versions and never shows up in this workspace's own
# `cargo check`/`cargo test --workspace`.
exclude = ["examples/rust", "sdks/rust"]

[workspace.package]
version = "0.2.1"
edition = "2024"
# Raised to 1.95.0 for the cratestack 0.7.10 bump: cratestack/cratestack#480
# declares that as cratestack's own MSRV workspace-wide, and this repo pins
# the whole cratestack family exactly (see below) — so its MSRV is a floor
# on ours by construction. Verified, not assumed: `cargo +1.95.0 check
# --workspace --all-targets` was run by hand and is clean. Note this repo's
# own CI (`.github/workflows/ci.yml`) uses `dtolnay/rust-toolchain@stable`
# (always latest stable, not a pinned version), so nothing here yet asserts
# the declared floor the way cratestack's own upstream CI now does with its
# dedicated `msrv` job — this field is a correct, verified declaration, not
# an enforced one. Previously raised from a stale 1.85 in #139 (the
# committed `Cargo.lock` needed 1.88, and nothing checked that claim
# either). The Dockerfiles already pinned `rust:1.95-bookworm` before this
# change, so they needed no update.
rust-version = "1.95.0"
license = "MIT"
repository = "https://github.com/vymalo/vsms"
authors = ["Vymalo"]
publish = false

[workspace.dependencies]
# Internal crates. `crates/` is libraries, `app/` is binaries — a binary may
# depend on any library, never the reverse.
sms-core = { path = "./backends/crates/sms-core" }
sms-encoding = { path = "./backends/crates/sms-encoding" }
sms-msisdn = { path = "./backends/crates/sms-msisdn" }
# #41: outbound webhook HMAC signing/verification and secret generation.
# Pure (bar generate_secret's OS randomness) and deliberately not
# schema-coupled — both sms-api (rotateWebhookSecret) and sms-worker's
# hooks role (#40) depend on this directly rather than on each other.
sms-webhook = { path = "./backends/crates/sms-webhook" }
# #70/#71: metric name/help/label definitions, so sms-api and sms-worker
# (two separate processes — see the crate's own module doc) can't drift
# apart on what a given metric is called.
sms-metrics = { path = "./backends/crates/sms-metrics" }
sms-api = { path = "./backends/crates/sms-api" }
sms-auth = { path = "./backends/crates/sms-auth" }
sms-worker = { path = "./backends/crates/sms-worker" }
sms-provider = { path = "./backends/crates/sms-provider" }
sms-provider-orange-cm = { path = "./backends/crates/sms-provider-orange-cm" }
# #61: MTN Cameroon capacity bought through a licensed aggregator, not a
# direct interconnect — see the crate's own module doc for exactly which
# parts of the request/response shape are a verified pattern vs. an
# invented placeholder pending a real aggregator contract.
sms-provider-mtn = { path = "./backends/crates/sms-provider-mtn" }
# #62's pure route-selection engine — no cratestack, no I/O. sms-worker
# (backends/crates/sms-worker/src/routing.rs) is the I/O glue; a future #54
# simulator procedure in sms-api is expected to depend on this directly
# too.
sms-routing = { path = "./backends/crates/sms-routing" }
# Dev-only: the shared live-Postgres test harness (see its own module doc).
# Depended on via [dev-dependencies] everywhere it's used, never
# [dependencies] — no production binary links against it.
sms-test-support = { path = "./backends/crates/sms-test-support" }
# Dev-only, same discipline as sms-test-support above: a fault-injecting
# fake of Orange's HTTP API for the chaos suite (see its own module doc).
# No production binary links against it — backends/apps/sms-fake-orange, the one
# binary that does, is itself a dev/demo tool, never referenced by a
# production compose file (see that binary's own module doc).
sms-fake-orange = { path = "./backends/crates/sms-fake-orange" }

# The rename is mandatory: generated code emits absolute `::cratestack::*`
# paths, so the facade has to be in scope under exactly that name. Pinned
# exactly — CrateStack is pre-1.0 and shipped 23 releases in 11 weeks; the
# whole family must move in lockstep or the generated code stops matching the
# runtime it calls into.
cratestack = { package = "cratestack-pg", version = "=0.8.10" }
cratestack-codec-json = "=0.8.10"

# OIDC provider. Pinned exactly, same reasoning as cratestack above — see
# AGENTS.md. 0.3.2 fixed the `GrantType` serde bug that shaped early M1
# design (#6): don't drop below it.
#
# `default-features = false, features = ["rustls-no-provider"]`: authkestra's
# own reqwest 0.13 dependency otherwise defaults to `aws-lc-rs`, the only
# path by which that crate ever entered this tree (AGENTS.md's "aws-lc-rs
# enters this tree from authkestra alone" section — verified via
# `cargo tree -e features -i rustls`, not assumed). `rustls-no-provider`
# compiles neither `aws-lc-rs` nor `ring` into authkestra's own reqwest;
# the process supplies one instead, via the explicit
# `rustls::crypto::ring::default_provider().install_default()` call each
# binary's `main()` makes before constructing any HTTP client — see that
# call site's own comment for why ordering there is load-bearing, and
# AGENTS.md for the live-TLS test that proves this path actually works
# rather than panicking at the first outbound call.
authkestra-op = { version = "=0.5.1", default-features = false, features = ["rustls-no-provider"] }
# Underpins authkestra-op (TokenManager, Engine, the generic MemoryStore<T>
# op.rs uses for the authorization-code/refresh-token/device-code slots
# this deployment doesn't populate — see op.rs's own doc). Not used
# directly by application code beyond that; pinned because the whole
# authkestra family moves in lockstep. Same `rustls-no-provider` reasoning
# as authkestra-op above.
authkestra-engine = { version = "=0.5.1", default-features = false, features = ["rustls-no-provider"] }
# JWKS-backed token validation for the real AuthProvider (#21). Same pin
# discipline as authkestra-op — the whole family moves in lockstep. Same
# `rustls-no-provider` reasoning as authkestra-op above.
authkestra-resource = { version = "=0.5.1", default-features = false, features = ["rustls-no-provider"] }
# Wraps authkestra-op's handler functions into axum routes for the OP
# itself (#20). Only the `op` feature: this deployment never uses the
# `session`/`resource` extractors this crate also offers, since #21's
# AuthProvider validates tokens directly through authkestra-resource
# instead of authkestra-axum's own session/guard machinery. Same
# `rustls-no-provider` reasoning as authkestra-op above.
authkestra-axum = { version = "=0.5.1", default-features = false, features = ["op", "rustls-no-provider"] }
# RSA signing keys for the OP (#20) — same rsa/rand versions authkestra-op
# itself resolves to (verified against Cargo.lock), so this doesn't grow a
# second copy of either crate's dependency tree.
rsa = "0.9"
rand = "0.8"
# #194: sms-auth::login's password hashing for human console logins — the
# one place this system now stores a secret derived from user input rather
# than generating its own key material. Argon2id (the `password-hash`
# crate's own recommended default, and OWASP's) with the crate's built-in
# defaults (19 MiB memory, matching the figure #22/§4.2 already cites as
# "memory-hard work an unauthenticated caller could trigger" — deliberately
# unchanged here since these attempts *are* authenticated-caller-triggered
# by design, not the unauthenticated /token path that reasoning was about).
argon2 = "0.5"
# GatewayAuth (#21) builds its own JwksCache/Validation directly rather than
# through authkestra-resource's JwtStrategy, whose cache/validation fields
# are private — same jsonwebtoken version authkestra-op itself requires
# (verified against Cargo.lock: both resolve to 11.0.0 with `rust_crypto`).
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
# The live OIDC-flow verification test builds a client JWK (n/e) by hand
# from a generated RSA keypair — same base64 version already resolved
# transitively through authkestra-op.
base64 = "0.22"
# backends/apps/sms-gateway's own op.rs mounts axum routes directly against
# authkestra-axum's handler functions — same axum version cratestack-pg
# and authkestra-axum both already resolve to (verified: Cargo.lock has
# exactly one axum entry, 0.8.9), so this doesn't fork the tree.
axum = "0.8"

anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
# #168: parses `/token`'s form-urlencoded body for `client_id` in
# `backends/apps/sms-gateway/src/token_rate_limit.rs`. Already present in Cargo.lock
# transitively at this exact version (part of the `url` crate family, a
# dependency of axum's own `Form` extractor, which `authkestra_axum`'s
# token handler uses to parse `TokenRequest`) — this doesn't add a second
# form-parsing implementation to the tree, just names the dependency
# directly for the one crate that now calls it outside that extractor.
# Chosen over a third-party Caddy module for the identical supply-chain
# reason `deploy/Caddyfile`'s own #168 comment rejected one at the edge:
# `form_urlencoded` is maintained by the same team as `url`/`idna` (Servo),
# already this deeply embedded in the dependency tree, and does exactly
# one well-scoped thing.
form_urlencoded = "1"
# rustls, not native-tls/openssl — matches every other reqwest already in
# this dependency tree (cratestack-sqlx, authkestra-engine both resolve to
# hyper-rustls), so this doesn't introduce a second TLS stack to build.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Named directly (not just pulled in transitively) so backends/apps/sms-gateway's and
# backends/apps/sms-worker's own main.rs can call
# `rustls::crypto::ring::default_provider().install_default()` before
# constructing any HTTP client — see authkestra-op's own comment above for
# why that call has to exist at all now that `rustls-no-provider` leaves
# authkestra's reqwest with no baked-in crypto backend. `default-features =
# false` plus `std`: only the `ring` backend is wanted, not the `aws-lc-rs`
# feature this crate also offers (which would reintroduce the exact
# dependency this change removes) or the `logging`/`tls12` extras this
# workspace has no use for. Version matches what's already resolved
# workspace-wide (0.23.x, verified against Cargo.lock) — this doesn't fork
# the rustls tree, just names the one version already there.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# #70/#71: backends/crates/sms-metrics's registry/counters/gauges and text
# exposition encoder. `default-features = false` drops the `protobuf`
# feature (Prometheus's older binary scrape format, via the `protobuf`
# crate) — nothing in this deployment's tooling speaks it, every consumer
# here (a human, or a real Prometheus server) scrapes the text format, and
# turning it off keeps this dependency to the metric types themselves.
# Apache-2.0, already on `deny.toml`'s allowed-license list.
prometheus = { version = "0.14", default-features = false }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# #134: keys `sha2` for `Procedures`'s `msisdnHash`/`bodyHash` HMAC under a
# server-held pepper. Already present in Cargo.lock transitively (0.12.1,
# via authkestra's `rust_crypto` stack) — this doesn't add a second digest
# tree, just names the dependency directly for the crate that now calls it.
hmac = "0.12"
# #41: sms-webhook's hex encode/decode for signature bytes. Already present
# in Cargo.lock transitively (0.4.3, pulled in by several crypto-adjacent
# dependencies already in the tree) — named directly here rather than
# hand-rolling a third hex codec alongside pepper.rs's manual `{byte:02x}`
# loop and whatever else already exists transitively.
hex = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
# Dev-only: token_rate_limit.rs's own tests (#168) drive its middleware via
# `tower::ServiceExt::oneshot` against an in-process router, the standard
# axum testing pattern — no real socket needed. Already present in
# Cargo.lock transitively (0.5.3, via axum/cratestack-axum's own routing
# internals), so this doesn't add a second `tower` version to the tree.
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
# Dev-only: #65's kill-Orange gate needs to bind a fresh listener on the
# *exact same* local port a previous one (deliberately dropped, to model a
# real outage) used, so `dispatch`'s already-constructed `OrangeCmProvider`
# — whose `base_url` is fixed at construction — resumes talking to
# "Orange" the moment it comes back, without needing a second adapter
# instance. Plain `std::net::TcpListener::bind` doesn't set `SO_REUSEADDR`,
# so a same-port rebind fails `EADDRINUSE` once any connection on that port
# has gone through `TIME_WAIT` (verified empirically, not assumed — see
# that test's own module doc). Already present in `Cargo.lock` transitively
# (0.6.5, via `tokio`'s own internals) — named directly here rather than
# reimplementing a raw `setsockopt` call.
socket2 = "0.6"
# Dev-only: every provider-facing live/unit test suite in this workspace
# (sms-provider-orange-cm, sms-worker, backends/apps/sms-worker) mocks Orange's HTTP
# API against the same wiremock server, so one version lives here rather
# than three copies of the same string.
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every public fallible function documents its errors in prose already; the
# `# Errors` section requirement is noise on a workspace this small.
missing_errors_doc = "allow"

# `lto` is build-wide — Cargo cannot scope it per package — so it is set once
# here for the whole graph. `thin` gets nearly all of fat LTO's win at a
# fraction of the peak-memory and wall-clock cost during codegen. Fat LTO
# together with a single codegen unit is the worst case for rustc/LLVM memory,
# and the cost scales with how much code a crate has to optimise — which is
# exactly what `include_server_schema!` generates a lot of (models × CRUD ×
# policy × dispatch × relations, all in one compilation unit).
#
# This mirrors cratestack/cratestack#250, which found downstream production
# builds reaching 12 GiB. Note that a dependency's profile never reaches us —
# Cargo only honours profiles from the root workspace manifest — so the way
# that setting spreads is copy-paste of the boilerplate into each new service's
# own root manifest. This block is that copy, corrected.
[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 16
incremental = false

# Max squeeze for artifacts we actually ship. Unlike cratestack-cli, ours are
# long-running server binaries in containers, so `opt-level` stays at 3 —
# throughput matters and download size does not. Runs once per release in CI,
# never on a dev or service build.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = true

# Expanding 16 models through `include_server_schema!` is memory-hungry in the
# compiler *frontend* — macro expansion and type checking, before LLVM is
# involved at all. Cutting debug info to line tables keeps a dev build from
# ballooning further without losing backtrace line numbers.
[profile.dev]
debug = "line-tables-only"
