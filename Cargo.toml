[workspace]
resolver = "3"
members = [
  "backends/crates/sms-core",
  # VSC-1: the YAML deployment configuration both long-running binaries read.
  "backends/crates/sms-config",
  "backends/crates/sms-encoding",
  "backends/crates/sms-msisdn",
  "backends/crates/sms-webhook",
  # #70/#71: Prometheus metric definitions shared by sms-api and
  # sms-worker — pure, no schema/framework dependency, same reasoning as
  # sms-webhook above for living below both.
  "backends/crates/sms-metrics",
  "backends/crates/sms-api",
  # VSA-3a: the embedded OpenID Provider's stores, keys and client provisioning
  # (deleted in #446, restored for the `machine_tokens` method; VSA-4a adds the
  # password login and the console client row). The SSO broker is VSA-4c and is not
  # in the crate.
  "backends/crates/sms-auth",
  "backends/crates/sms-worker",
  "backends/crates/sms-provider",
  # Cleanup PR B: the connect-vs-read transport classification and the
  # provider-agnostic half of the HTTP-status mapping, factored out of
  # sms-provider-orange-cm and sms-provider-mtn once a second adapter
  # proved the duplication AGENTS.md's #61 section already named was real
  # — see this crate's own module doc for why it isn't a module inside
  # sms-provider itself.
  "backends/crates/sms-provider-http",
  "backends/crates/sms-provider-orange-cm",
  "backends/crates/sms-provider-mtn",
  # AWS End User Messaging SMS, with receipts delivered by SNS — the
  # go-live provider while the Orange and MTN contracts are pending.
  "backends/crates/sms-provider-aws-sms",
  "backends/crates/sms-routing",
  "backends/crates/sms-fake-orange",
  # Dev/test-only fake of AWS End User Messaging SMS and its SNS receipt
  # topic, for sms-provider-aws-sms — same discipline as sms-fake-orange.
  "backends/crates/sms-fake-aws",
  "backends/crates/sms-test-support",
  "backends/apps/sms-gateway",
  "backends/apps/sms-worker",
  "backends/apps/sms-fake-orange",
  "backends/apps/sms-fake-aws",
  "backends/apps/sms-migrate",
  # Demo-only: seeds the App/SenderId fixtures compose.demo.yaml needs.
  # Moved out of backends/apps/sms-gateway (formerly `Command::SeedDemoApp`) so no
  # demo-seeding logic is compiled into the production sms-gateway image —
  # see backends/apps/vsms-demo-seed/src/main.rs's own module doc.
  "backends/apps/vsms-demo-seed",
  # Repo automation ("no bash scripts — xtask + Docker" is the standing
  # direction): a dot-directory at the repo root, invoked via the
  # `[alias] xtask` in .cargo/config.toml, mirroring the sibling vpay
  # repo's own xtask shape. Deliberately depends on nothing above it in
  # this list — no sms-api, nothing that expands `include_server_schema!`
  # — so `cargo xtask <check>` stays fast to build even though it lives in
  # the same workspace.
  ".xtask",
]
# examples/rust is its own, separate [workspace] (see its own Cargo.toml
# and examples/README.md) — an integrator's copy-pasteable client, kept
# out of this workspace's dependency graph and version pins on purpose.
# `exclude` isn't strictly load-bearing today (nothing above adds it via a
# glob), but it documents the boundary explicitly and keeps it true if
# `members` above ever grows a glob.
#
# sdks/rust is the same shape for the same reason (#171): vsms-sdk-rust is
# meant for external, independent publishing to crates.io, so it picks its
# own dependency versions and never shows up in this workspace's own
# `cargo check`/`cargo test --workspace`.
exclude = ["examples/rust", "sdks/rust"]

[workspace.package]
version = "0.9.0" # x-release-please-version
edition = "2024"
# Raised to 1.98.0 for the cratestack 0.11.0 bump: crates.io's own
# `rust_version` field for `cratestack-pg` 0.11.0 declares that floor
# (checked directly against the registry API, not the CHANGELOG prose —
# `curl .../api/v1/crates/cratestack-pg/0.11.0` → `"rust_version":
# "1.98.0"`), and this repo pins the whole cratestack family exactly (see
# below) — so its MSRV is a floor on ours by construction. Verified, not
# assumed: `cargo +1.98.0 check --workspace --all-targets` was run by hand
# and is clean. Note this repo's own CI (`.github/workflows/ci.yml`) uses
# `dtolnay/rust-toolchain@stable` (always latest stable, not a pinned
# version), so nothing here yet asserts the declared floor the way
# cratestack's own upstream CI now does with its dedicated `msrv` job —
# this field is a correct, verified declaration, not an enforced one.
# Previously raised to 1.95.0 for the 0.7.10 bump (cratestack/cratestack#480),
# and before that from a stale 1.85 in #139 (the committed `Cargo.lock`
# needed 1.88, and nothing checked that claim either). All seven
# Rust-building Dockerfiles in this repo (the five under
# `backends/apps/*/Dockerfile`, plus `ci/e2e-integration/Dockerfile` and
# `deploy/backup.Dockerfile` — the latter has no MSRV need of its own,
# bumped only for consistency, see its own comment) moved from
# `rust:1.95-alpine3.22` to `rust:1.98-alpine3.22` in the same PR —
# checked to exist on Docker Hub (`docker manifest inspect`) before
# switching, rather than assumed.
rust-version = "1.98.0"
license = "MIT"
repository = "https://github.com/vaam-apps/vsms"
authors = ["Vymalo"]
publish = false

[workspace.dependencies]
# Internal crates. `crates/` is libraries, `app/` is binaries — a binary may
# depend on any library, never the reverse.
sms-core = { path = "./backends/crates/sms-core" }
# VSC-1: the one reader of `config/application*.yml`, so the gateway and the
# worker cannot derive a provider's settings differently.
sms-config = { path = "./backends/crates/sms-config" }
sms-encoding = { path = "./backends/crates/sms-encoding" }
sms-msisdn = { path = "./backends/crates/sms-msisdn" }
# #41, VS-8: the sealer an outbound webhook delivery is signed with (a
# COSE_Sign1 request under the gateway's envelope key), and the digest of the
# delivery contract. Deliberately not schema-coupled: sms-worker's hooks role
# (#40) and its binary depend on this directly, and the SDKs hold a copy of
# the digest that `cargo xtask sdk-parity-check` keeps equal.
sms-webhook = { path = "./backends/crates/sms-webhook" }
# #70/#71: metric name/help/label definitions, so sms-api and sms-worker
# (two separate processes — see the crate's own module doc) can't drift
# apart on what a given metric is called.
sms-metrics = { path = "./backends/crates/sms-metrics" }
sms-api = { path = "./backends/crates/sms-api" }
sms-auth = { path = "./backends/crates/sms-auth" }
sms-worker = { path = "./backends/crates/sms-worker" }
sms-provider = { path = "./backends/crates/sms-provider" }
# Cleanup PR B: the connect-vs-read transport classifier and the
# provider-agnostic half of the HTTP-status mapping, shared by every HTTP
# adapter below rather than duplicated per crate — see its own module doc.
sms-provider-http = { path = "./backends/crates/sms-provider-http" }
sms-provider-orange-cm = { path = "./backends/crates/sms-provider-orange-cm" }
# #61: MTN Cameroon capacity bought through a licensed aggregator, not a
# direct interconnect — see the crate's own module doc for exactly which
# parts of the request/response shape are a verified pattern vs. an
# invented placeholder pending a real aggregator contract.
sms-provider-mtn = { path = "./backends/crates/sms-provider-mtn" }
sms-provider-aws-sms = { path = "./backends/crates/sms-provider-aws-sms" }
# #62's pure route-selection engine — no cratestack, no I/O. sms-worker
# (backends/crates/sms-worker/src/routing.rs) is the I/O glue; a future #54
# simulator procedure in sms-api is expected to depend on this directly
# too.
sms-routing = { path = "./backends/crates/sms-routing" }
# Dev-only: the shared live-Postgres test harness (see its own module doc).
# Depended on via [dev-dependencies] everywhere it's used, never
# [dependencies] — no production binary links against it.
sms-test-support = { path = "./backends/crates/sms-test-support" }
# Dev-only, same discipline as sms-test-support above: a fault-injecting
# fake of Orange's HTTP API for the chaos suite (see its own module doc).
# No production binary links against it — backends/apps/sms-fake-orange, the one
# binary that does, is itself a dev/demo tool, never referenced by a
# production compose file (see that binary's own module doc).
sms-fake-orange = { path = "./backends/crates/sms-fake-orange" }
# Dev-only, same discipline: a fake of AWS End User Messaging SMS and of the
# SNS topic its delivery events arrive through. Linked into sms-gateway only
# behind its off-by-default `fake-aws` feature, which no release image builds.
sms-fake-aws = { path = "./backends/crates/sms-fake-aws" }

# The rename is mandatory: generated code emits absolute `::cratestack::*`
# paths, so the facade has to be in scope under exactly that name. Pinned
# exactly — CrateStack is pre-1.0 and shipped 23 releases in 11 weeks; the
# whole family must move in lockstep or the generated code stops matching the
# runtime it calls into.
#
# `envelope` and `cose` compile the signed-transport layer
# (`cratestack::envelope_layer`, COSE_Sign1 requests) into the server; `cose`
# implies `envelope`, both are named so the intent reads. Nothing mounts the
# layer yet, so they change no behaviour — see AGENTS.md's 0.16.0 section.
cratestack = { package = "cratestack-pg", version = "=0.16.0", features = ["envelope", "cose"] }
cratestack-codec-json = "=0.16.0"

# VSA-3a restored the authkestra family below exactly as #446 removed it, at
# 0.8.0: the newest release (0.13.1, which vpay runs) carries the same
# RUSTSEC-2026-0387 chain through jsonwebtoken 11, so moving to it clears nothing
# and rewrites the stores' trait signatures for no gain. deny.toml records the
# measurement.
# OIDC provider. Pinned exactly, same reasoning as cratestack above — see
# AGENTS.md. 0.3.2 fixed the `GrantType` serde bug that shaped early M1
# design (#6): don't drop below it. Bumped 0.5.4 -> 0.8.0 — see AGENTS.md's
# authkestra-0.8 section for the full audit (OpStore's `&mut self` methods,
# ClientStore/ClientAssertionStore relocating to authkestra-engine,
# CompositeOpStore's new 6th (DPoP) type parameter, PKCE going
# unconditional, and AuthorizeRequest/Claims both going #[non_exhaustive]).
#
# `default-features = false, features = ["rustls-no-provider"]`: authkestra's
# own reqwest 0.13 dependency otherwise defaults to `aws-lc-rs`, the only
# path by which that crate ever entered this tree (AGENTS.md's "aws-lc-rs
# enters this tree from authkestra alone" section — verified via
# `cargo tree -e features -i rustls`, not assumed). `rustls-no-provider`
# compiles neither `aws-lc-rs` nor `ring` into authkestra's own reqwest;
# the process supplies one instead, via the explicit
# `rustls::crypto::ring::default_provider().install_default()` call each
# binary's `main()` makes before constructing any HTTP client — see that
# call site's own comment for why ordering there is load-bearing, and
# AGENTS.md for the live-TLS test that proves this path actually works
# rather than panicking at the first outbound call. Re-verified still true
# at 0.8.0 — the feature exists unchanged on all four crates.
authkestra-op = { version = "=0.8.0", default-features = false, features = ["rustls-no-provider"] }
# Underpins authkestra-op (TokenManager, Engine, the generic MemoryStore<T>
# op.rs uses for the authorization-code/refresh-token/device-code slots
# this deployment doesn't populate — see op.rs's own doc). Not used
# directly by application code beyond that; pinned because the whole
# authkestra family moves in lockstep. Same `rustls-no-provider` reasoning
# as authkestra-op above.
# `token` is named here because without it `TokenManager` does not exist.
authkestra-engine = { version = "=0.8.0", default-features = false, features = ["token", "rustls-no-provider"] }
# Wraps authkestra-op's handler functions into axum routes for the OP
# itself (#20). Only the `op` feature: this deployment never uses the
# `session`/`resource` extractors this crate also offers (the bearer door of
# VSA-3b is hand-written against the OP's own keys, not an authkestra extractor,
# and `authkestra-resource`'s HTTP `JwksCache` is not linked at all). Same
# `rustls-no-provider` reasoning as authkestra-op above.
authkestra-axum = { version = "=0.8.0", default-features = false, features = ["op", "rustls-no-provider"] }
# sms-fake-aws: the RSA key behind its fake SNS signing identity. sms-auth
# (VSA-3a): the OP's RS256 signing keys and the client keypairs
# `provision-client` mints. One resolved copy, shared with authkestra-engine.
rsa = "0.9"
rand = "0.8"
# sms-core's password module (VSA-4a): Argon2id for a person's console password,
# the crate's own recommended defaults (19 MiB, 2 passes, 1 lane: OWASP's
# minimum for Argon2id), so a PHC string exported from before #446 still
# verifies. 0.6 and not the 0.5 that #446 deleted: authkestra-engine 0.8.0
# already resolves argon2 0.6.0 (it hashes client secrets), so this is one
# resolved copy, not a second one. The PHC output is byte-for-byte the same
# format; only the Rust API moved (`password-hash` 0.6: the salt is generated
# inside `hash_password`).
argon2 = "0.6"
# sms-fake-aws only: a self-signed certificate around a generated RSA key
# for its fake SNS signing identity. `ring` backend, never aws-lc-rs.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# sms-fake-aws only: signs fake SNS notifications. The same `ring` rustls
# already resolves; named directly, never a second copy.
ring = "0.17"
# client_keys.rs / console_keys.rs / envelope.rs: base64url public keys and
# the PKCS#8 PEM body of the server's signing key.
base64 = "0.22"
# sms-gateway's op_bearer.rs (VSA-3b) verifies the access token the OP minted,
# against the key set the OP itself signs with, and its machine_tokens_live_postgres.rs
# signs a client assertion. The same version authkestra-op itself requires
# (Cargo.lock resolves one copy, with `rust_crypto`). Production code of ours
# links it in that one file; RUSTSEC-2023-0071 (deny.toml) covers this second
# RS256 verify site as it covers the first.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
axum = "0.8"

# sms-provider-aws-sms and sms-fake-aws: RFC 3986 URL handling for the SNS
# subscription and certificate endpoints.
url = "2"

# sms-gateway's token_rate_limit.rs (VSA-3a) parses `/token`'s form-urlencoded body
# for `client_id`. Already in Cargo.lock through `url` and axum's `Form`; named
# directly for the one crate that now calls it, so no second form parser appears.
form_urlencoded = "1"

# sms-webhook's `url_can_be_sealed`: the pattern a `sealed` WebhookEndpoint's URL
# must match, run by the procedure that switches an endpoint's mode and by the
# tests that hold it narrower than `delivery_route`. The same pattern is a CHECK
# in migration 0010. Already in the tree through cratestack.
regex = "1"

# sms-config: the base file plus a profile overlay, merged (figment), then
# round-tripped through serde_yaml_ng so the typed model sees the merged and
# placeholder-resolved document. The same pair vpay-config uses.
figment = { version = "0.10", default-features = false, features = ["yaml"] }
serde_yaml_ng = "0.10"

anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
# rustls, not native-tls/openssl — matches every other reqwest already in
# this dependency tree (cratestack-sqlx resolves to hyper-rustls too), so
# this doesn't introduce a second TLS stack to build.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Named directly (not just pulled in transitively) so backends/apps/sms-gateway's and
# backends/apps/sms-worker's own main.rs can call
# `rustls::crypto::ring::default_provider().install_default()` before
# constructing any HTTP client — see that function's own doc. `default-features =
# false` plus `std`: only the `ring` backend is wanted, not the `aws-lc-rs`
# feature this crate also offers (which would put a `cmake`-built C
# dependency in the tree) or the `logging`/`tls12` extras this
# workspace has no use for. Version matches what's already resolved
# workspace-wide (0.23.x, verified against Cargo.lock) — this doesn't fork
# the rustls tree, just names the one version already there.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# sms-provider-aws-sms verifies Amazon SNS message signatures (RSA,
# SHA-256) against the signing certificate SNS publishes. Both crates are
# already in the graph through rustls, at these versions; naming them here
# only lets that crate call them. `ring`, never `aws-lc-rs`, for the same
# reason as `rustls` above.
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1", features = ["std"] }
# #70/#71: backends/crates/sms-metrics's registry/counters/gauges and text
# exposition encoder. `default-features = false` drops the `protobuf`
# feature (Prometheus's older binary scrape format, via the `protobuf`
# crate) — nothing in this deployment's tooling speaks it, every consumer
# here (a human, or a real Prometheus server) scrapes the text format, and
# turning it off keeps this dependency to the metric types themselves.
# Apache-2.0, already on `deny.toml`'s allowed-license list.
prometheus = { version = "0.14", default-features = false }
# Multi-country stage 1: Google libphonenumber's own metadata, so
# backends/crates/sms-msisdn validates every country's numbering plan instead
# of one hand-written Cameroonian table. Apache-2.0, already on `deny.toml`'s
# allowed-license list. No `-sys` crate and no C toolchain: `build.rs` turns
# the bundled XML into Rust that the library `include_bytes!`es from
# `OUT_DIR`, so there is no runtime file or network access and it links
# statically under `rust:1.98-alpine3.22` into `gcr.io/distroless/static`,
# which is what the sms-gateway and sms-worker images actually are. The `+`
# half of the version is libphonenumber's own release (0.3.10+9.0.33), not a
# semver field — the crate republishes on metadata updates, so a patch bump
# here can genuinely change which numbers validate.
phonenumber = "0.3.10"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# #134: keys `sha2` for `Procedures`'s `msisdnHash`/`bodyHash` HMAC under a
# server-held pepper.
hmac = "0.12"
# Hex encode/decode (the audit chain's hashes, a console key's thumbprint).
# Already present in Cargo.lock transitively (0.4.3, pulled in by several
# crypto-adjacent dependencies already in the tree) — named directly here
# rather than hand-rolling a third hex codec alongside pepper.rs's manual
# `{byte:02x}` loop and whatever else already exists transitively.
hex = "0.4"
# VS-5a: `console_keys.rs` checks a console key's proof of possession - a raw
# ECDSA-P-256-SHA-256 signature, the shape WebCrypto's `sign` returns - over a
# short message. cratestack-cose keeps its own verifier crate-private (it
# verifies COSE structures, not a bare signature), so the one check is made
# with the RustCrypto crate it is built on. 0.14 with `ecdsa` is exactly
# cratestack-cose 0.16.0's own requirement, so Cargo.lock gains no new crate.
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
# Dev-only: sms-api's metrics.rs tests drive its router via
# `tower::ServiceExt::oneshot` against an in-process router, the standard
# axum testing pattern — no real socket needed. Already present in
# Cargo.lock transitively (0.5.3, via axum/cratestack-axum's own routing
# internals), so this doesn't add a second `tower` version to the tree.
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
# Dev-only: #65's kill-Orange gate needs to bind a fresh listener on the
# *exact same* local port a previous one (deliberately dropped, to model a
# real outage) used, so `dispatch`'s already-constructed `OrangeCmProvider`
# — whose `base_url` is fixed at construction — resumes talking to
# "Orange" the moment it comes back, without needing a second adapter
# instance. Plain `std::net::TcpListener::bind` doesn't set `SO_REUSEADDR`,
# so a same-port rebind fails `EADDRINUSE` once any connection on that port
# has gone through `TIME_WAIT` (verified empirically, not assumed — see
# that test's own module doc). Already present in `Cargo.lock` transitively
# (0.6.5, via `tokio`'s own internals) — named directly here rather than
# reimplementing a raw `setsockopt` call.
socket2 = "0.6"
# Dev-only: every provider-facing live/unit test suite in this workspace
# (sms-provider-orange-cm, sms-worker, backends/apps/sms-worker) mocks Orange's HTTP
# API against the same wiremock server, so one version lives here rather
# than three copies of the same string.
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every public fallible function documents its errors in prose already; the
# `# Errors` section requirement is noise on a workspace this small.
missing_errors_doc = "allow"

# `lto` is build-wide — Cargo cannot scope it per package — so it is set once
# here for the whole graph. `thin` gets nearly all of fat LTO's win at a
# fraction of the peak-memory and wall-clock cost during codegen. Fat LTO
# together with a single codegen unit is the worst case for rustc/LLVM memory,
# and the cost scales with how much code a crate has to optimise — which is
# exactly what `include_server_schema!` generates a lot of (models × CRUD ×
# policy × dispatch × relations, all in one compilation unit).
#
# This mirrors cratestack/cratestack#250, which found downstream production
# builds reaching 12 GiB. Note that a dependency's profile never reaches us —
# Cargo only honours profiles from the root workspace manifest — so the way
# that setting spreads is copy-paste of the boilerplate into each new service's
# own root manifest. This block is that copy, corrected.
[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 16
incremental = false

# Max squeeze for artifacts we actually ship. Unlike cratestack-cli, ours are
# long-running server binaries in containers, so `opt-level` stays at 3 —
# throughput matters and download size does not. Runs once per release in CI,
# never on a dev or service build.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = true

# Expanding 16 models through `include_server_schema!` is memory-hungry in the
# compiler *frontend* — macro expansion and type checking, before LLVM is
# involved at all. Cutting debug info to line tables keeps a dev build from
# ballooning further without losing backtrace line numbers.
[profile.dev]
debug = "line-tables-only"
