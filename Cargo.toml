[workspace]
resolver = "3"
members = [
  "crates/sms-core",
  "crates/sms-encoding",
  "crates/sms-msisdn",
  "crates/sms-api",
  "crates/sms-auth",
  "crates/sms-worker",
  "crates/sms-provider",
  "crates/sms-provider-orange-cm",
  "app/sms-gateway",
  "app/sms-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/vymalo/vsms"
authors = ["Vymalo"]
publish = false

[workspace.dependencies]
# Internal crates. `crates/` is libraries, `app/` is binaries — a binary may
# depend on any library, never the reverse.
sms-core = { path = "./crates/sms-core" }
sms-encoding = { path = "./crates/sms-encoding" }
sms-msisdn = { path = "./crates/sms-msisdn" }
sms-api = { path = "./crates/sms-api" }
sms-auth = { path = "./crates/sms-auth" }
sms-worker = { path = "./crates/sms-worker" }
sms-provider = { path = "./crates/sms-provider" }
sms-provider-orange-cm = { path = "./crates/sms-provider-orange-cm" }

# The rename is mandatory: generated code emits absolute `::cratestack::*`
# paths, so the facade has to be in scope under exactly that name. Pinned
# exactly — CrateStack is pre-1.0 and shipped 23 releases in 11 weeks; the
# whole family must move in lockstep or the generated code stops matching the
# runtime it calls into.
cratestack = { package = "cratestack-pg", version = "=0.5.0" }
cratestack-codec-json = "=0.5.0"

# OIDC provider. Pinned exactly, same reasoning as cratestack above — see
# AGENTS.md. 0.3.2 fixed the `GrantType` serde bug that shaped early M1
# design (#6): don't drop below it.
authkestra-op = "=0.3.2"
# Underpins authkestra-op (TokenManager, Engine, the generic MemoryStore<T>
# op.rs uses for the authorization-code/refresh-token/device-code slots
# this deployment doesn't populate — see op.rs's own doc). Not used
# directly by application code beyond that; pinned because the whole
# authkestra family moves in lockstep.
authkestra-engine = "=0.3.2"
# JWKS-backed token validation for the real AuthProvider (#21). Same pin
# discipline as authkestra-op — the whole family moves in lockstep.
authkestra-resource = "=0.3.2"
# Wraps authkestra-op's handler functions into axum routes for the OP
# itself (#20). Only the `op` feature: this deployment never uses the
# `session`/`resource` extractors this crate also offers, since #21's
# AuthProvider validates tokens directly through authkestra-resource
# instead of authkestra-axum's own session/guard machinery.
authkestra-axum = { version = "=0.3.2", features = ["op"] }
# RSA signing keys for the OP (#20) — same rsa/rand versions authkestra-op
# itself resolves to (verified against Cargo.lock), so this doesn't grow a
# second copy of either crate's dependency tree.
rsa = "0.9"
rand = "0.8"
# GatewayAuth (#21) builds its own JwksCache/Validation directly rather than
# through authkestra-resource's JwtStrategy, whose cache/validation fields
# are private — same jsonwebtoken version authkestra-op itself requires
# (verified against Cargo.lock: both resolve to 11.0.0 with `rust_crypto`).
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
# The live OIDC-flow verification test builds a client JWK (n/e) by hand
# from a generated RSA keypair — same base64 version already resolved
# transitively through authkestra-op.
base64 = "0.22"
# app/sms-gateway's own op.rs mounts axum routes directly against
# authkestra-axum's handler functions — same axum version cratestack-pg
# and authkestra-axum both already resolve to (verified: Cargo.lock has
# exactly one axum entry, 0.8.9), so this doesn't fork the tree.
axum = "0.8"

anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
# rustls, not native-tls/openssl — matches every other reqwest already in
# this dependency tree (cratestack-sqlx, authkestra-engine both resolve to
# hyper-rustls), so this doesn't introduce a second TLS stack to build.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every public fallible function documents its errors in prose already; the
# `# Errors` section requirement is noise on a workspace this small.
missing_errors_doc = "allow"

# `lto` is build-wide — Cargo cannot scope it per package — so it is set once
# here for the whole graph. `thin` gets nearly all of fat LTO's win at a
# fraction of the peak-memory and wall-clock cost during codegen. Fat LTO
# together with a single codegen unit is the worst case for rustc/LLVM memory,
# and the cost scales with how much code a crate has to optimise — which is
# exactly what `include_server_schema!` generates a lot of (models × CRUD ×
# policy × dispatch × relations, all in one compilation unit).
#
# This mirrors cratestack/cratestack#250, which found downstream production
# builds reaching 12 GiB. Note that a dependency's profile never reaches us —
# Cargo only honours profiles from the root workspace manifest — so the way
# that setting spreads is copy-paste of the boilerplate into each new service's
# own root manifest. This block is that copy, corrected.
[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 16
incremental = false

# Max squeeze for artifacts we actually ship. Unlike cratestack-cli, ours are
# long-running server binaries in containers, so `opt-level` stays at 3 —
# throughput matters and download size does not. Runs once per release in CI,
# never on a dev or service build.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = true

# Expanding 16 models through `include_server_schema!` is memory-hungry in the
# compiler *frontend* — macro expansion and type checking, before LLVM is
# involved at all. Cutting debug info to line tables keeps a dev build from
# ballooning further without losing backtrace line numbers.
[profile.dev]
debug = "line-tables-only"
