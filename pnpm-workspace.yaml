packages:
  - "admin"
  - "packages/*"

# pnpm 11 blocks dependency postinstall scripts unless explicitly allowed here.
# This is not optional polish: `pnpm run <script>` performs a deps-status check
# that re-runs `pnpm install`, so an unapproved build script makes EVERY script
# fail with ERR_PNPM_IGNORED_BUILDS behind a stack trace that reads like an
# internal pnpm crash rather than a config gap.
#
# NOTE the spelling: pnpm 10 called this `onlyBuiltDependencies` (a list);
# pnpm 11 renamed it to `allowBuilds` (a map). The old key is silently ignored
# and pnpm rewrites this file with an `allowBuilds` placeholder instead.
#
# sharp is Next.js's image optimiser and needs its native binary built.
# esbuild is a transitive dependency of vitest (packages/gateway's test
# runner, T10) and needs its own native binary build the same way.
allowBuilds:
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.9'
  - '@turbo/darwin-arm64@2.10.9'
  - '@turbo/linux-64@2.10.9'
  - '@turbo/linux-arm64@2.10.9'
  - '@turbo/windows-64@2.10.9'
  - '@turbo/windows-arm64@2.10.9'
  - turbo@2.10.9
  - react-hook-form@7.85.0

# packages/sms-client (T3) is generated by `cratestack generate-typescript`
# and is DO-NOT-EDIT — including its package.json, which asks for
# `typescript@^7.0.2` (the generator's own latest-known-good). Next 15.5
# predates TS 7, and every hand-written package here pins `5.9.3`. Rather
# than hand-edit a generated file (which `client-check`'s drift gate would
# then flag), pin the whole workspace to the version everything else
# already uses.
overrides:
  typescript: 5.9.3
