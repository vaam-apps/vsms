packages:
  - "frontends/apps/admin"
  - "frontends/packages/*"
  - "sdks/node/*"

# pnpm 11 blocks dependency postinstall scripts unless explicitly allowed here.
# This is not optional polish: `pnpm run <script>` performs a deps-status check
# that re-runs `pnpm install`, so an unapproved build script makes EVERY script
# fail with ERR_PNPM_IGNORED_BUILDS behind a stack trace that reads like an
# internal pnpm crash rather than a config gap.
#
# NOTE the spelling: pnpm 10 called this `onlyBuiltDependencies` (a list);
# pnpm 11 renamed it to `allowBuilds` (a map). The old key is silently ignored
# and pnpm rewrites this file with an `allowBuilds` placeholder instead.
#
# sharp is Next.js's image optimiser and needs its native binary built.
# esbuild is a transitive dependency of vitest (frontends/packages/gateway's test
# runner, T10) and needs its own native binary build the same way.
allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.9'
  - '@turbo/darwin-arm64@2.10.9'
  - '@turbo/linux-64@2.10.9'
  - '@turbo/linux-arm64@2.10.9'
  - '@turbo/windows-64@2.10.9'
  - '@turbo/windows-arm64@2.10.9'
  - turbo@2.10.9
  - react-hook-form@7.85.0
  - postcss@8.5.28

# frontends/packages/sms-client (T3) is generated by `cratestack generate-typescript`
# and is DO-NOT-EDIT — including its package.json, which asks for
# `typescript@^7.0.2` (the generator's own latest-known-good). Next 15.5
# predates TS 7, and every hand-written package here pins `5.9.3`. Rather
# than hand-edit a generated file (which `client-check`'s drift gate would
# then flag), pin the whole workspace to the version everything else
# already uses.
#
# postcss: next@15.5.25 still pins its own postcss dependency at an exact
# "8.4.31" (no caret — checked directly, not assumed, and unchanged even at
# next's newest 15.5.x backport release), which is vulnerable to
# GHSA-fxqj-rqcc-2cmp / GHSA-r28c-9q8g-f849 / GHSA-6g55-p6wh-862q /
# GHSA-qx2v-qp2m-jg93 (all fixed by 8.5.10 through 8.5.23; 8.5.28 clears all
# four at once). @tailwindcss/postcss's own postcss dependency already
# floats freely (`^8.5.16`) and had already resolved past every fixed
# version before this override — only next's exact pin needed forcing.
# Remove this override once next ships a postcss range that isn't exact-pinned
# below 8.5.23, or bumps its own pin past it.
#
# file-type: every @xhmikosr/* package under @swc/cli's bin-wrapper chain
# (a build-time-only dependency, never invoked by anything this repo ships)
# pins `^20.5.0`, capping the resolved version below the fix for
# GHSA-j47w-4g3g-c36v / GHSA-5v7r-6r5c-r473 (patched at 21.3.2 / 21.3.1 —
# a major bump the caret range can't reach on its own). file-type 21.x is
# ESM-only exactly like 20.x (checked: identical `exports` shape), so this
# is a same-shape major bump with no code-path risk to the build tooling
# that pulls it in. Remove once @xhmikosr's own packages widen their range.
overrides:
  typescript: 5.9.3
  postcss: 8.5.28
  file-type: 21.3.4
