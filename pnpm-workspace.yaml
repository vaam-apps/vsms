packages:
  - "frontends/apps/admin"
  - "frontends/packages/*"
  - "sdks/node/*"

# pnpm 11 blocks dependency postinstall scripts unless explicitly allowed here.
# This is not optional polish: `pnpm run <script>` performs a deps-status check
# that re-runs `pnpm install`, so an unapproved build script makes EVERY script
# fail with ERR_PNPM_IGNORED_BUILDS behind a stack trace that reads like an
# internal pnpm crash rather than a config gap.
#
# NOTE the spelling: pnpm 10 called this `onlyBuiltDependencies` (a list);
# pnpm 11 renamed it to `allowBuilds` (a map). The old key is silently ignored
# and pnpm rewrites this file with an `allowBuilds` placeholder instead.
#
# sharp is Next.js's image optimiser and needs its native binary built.
# esbuild is a transitive dependency of vitest (frontends/packages/gateway's test
# runner, T10) and needs its own native binary build the same way.
allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true

# Only versions that genuinely cannot be avoided belong here: an entry is a
# deliberate hole in the supply-chain quarantine, and pnpm offers to add one
# every time a bump lands on a package published in the last day. Prefer the
# newest version that CLEARS the gate — `react-hook-form` is on 7.87.0 rather
# than 7.88.0 for exactly that reason, and the caret picks 7.88.0 up on its
# own once it ages out. The turbo and react-hook-form entries that used to
# live here named versions this repo no longer resolves.
minimumReleaseAgeExclude:
  # postcss is forced past next's own exact pin by the override below, for
  # four advisories; the pinned version is the only one that clears them.
  - postcss@8.5.28
  # @vaam-apps/ui@0.2.0 published 2026-09-12T15:37:37Z and is the only
  # version in range (^0.2.0) admin's manifest asks for, so pnpm's default
  # 24h quarantine has nothing older to fall back to and refuses the
  # install outright -- a hard ERR_PNPM_NO_MATCHING_VERSION, not a warning.
  # The gate re-verifies on EVERY install including `--frozen-lockfile`, so
  # without this both CI and the admin Docker build fail until
  # 2026-09-13T15:37Z. Version-scoped deliberately: 0.2.1 stays
  # quarantined. See this repo's own AGENTS.md ("Bumping `@vaam-apps/ui`,
  # and the two-step the quarantine forces") for why a bump onto a package
  # this young is always two commits, never one: pnpm re-verifies every
  # entry already in the lockfile before resolving the new manifest, so a
  # one-step swap fails naming the *old* version. The 0.1.2 entry this
  # replaces is gone because `pnpm install` has already re-resolved the
  # lockfile onto 0.2.0, and `pnpm install --frozen-lockfile` was re-run
  # clean with 0.1.2 removed to prove that.
  - '@vaam-apps/ui@0.2.0'
  - '@next/env@16.3.5'
  - '@next/swc-darwin-arm64@16.3.5'
  - '@next/swc-darwin-x64@16.3.5'
  - '@next/swc-linux-arm64-gnu@16.3.5'
  - '@next/swc-linux-arm64-musl@16.3.5'
  - '@next/swc-linux-x64-gnu@16.3.5'
  - '@next/swc-linux-x64-musl@16.3.5'
  - '@next/swc-win32-arm64-msvc@16.3.5'
  - '@next/swc-win32-x64-msvc@16.3.5'
  - next@16.3.5

# frontends/packages/sms-client (T3) is generated by `cratestack generate-typescript`
# and is DO-NOT-EDIT — including its package.json, which asks for
# `typescript@^7.0.2` (the generator's own latest-known-good). Next 15.5
# predates TS 7, and every hand-written package here pins `5.9.3`. Rather
# than hand-edit a generated file (which `client-check`'s drift gate would
# then flag), pin the whole workspace to the version everything else
# already uses.
#
# postcss: kept at the latest, not because next forces it any more.
# next@15.5.25 exact-pinned postcss at 8.4.31, below the fix for four
# advisories (GHSA-fxqj-rqcc-2cmp / GHSA-r28c-9q8g-f849 /
# GHSA-6g55-p6wh-862q / GHSA-qx2v-qp2m-jg93), which is why this override
# was added. next@16.3.5 pins 8.5.23, which clears all four on its own,
# so the override is no longer load-bearing for security — it stays only
# to keep postcss at the newest release rather than next's floor. Safe to
# delete whenever next's own pin is current enough to not matter.
#
# file-type: every @xhmikosr/* package under @swc/cli's bin-wrapper chain
# (a build-time-only dependency, never invoked by anything this repo ships)
# pins `^20.5.0`, capping the resolved version below the fix for
# GHSA-j47w-4g3g-c36v / GHSA-5v7r-6r5c-r473 (patched at 21.3.2 / 21.3.1 —
# a major bump the caret range can't reach on its own). file-type 21.x is
# ESM-only exactly like 20.x (checked: identical `exports` shape), so this
# is a same-shape major bump with no code-path risk to the build tooling
# that pulls it in. Remove once @xhmikosr's own packages widen their range.
overrides:
  typescript: 5.9.3
  postcss: 8.5.28
  file-type: 22.0.2
