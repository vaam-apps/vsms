[package]
name = "vsms-example-send"
version = "0.1.0"
edition = "2021"
publish = false
description = "Runnable example: authenticate to vsms with private_key_jwt and send a message over real HTTP."

[[bin]]
name = "vsms-example-send"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
# `rust_crypto`, not the default `aws_lc_rs` backend — same choice vsms
# itself makes for the identical reason (AGENTS.md's aws-lc-rs section):
# one fewer crypto backend in the graph. `use_pem` is not in
# jsonwebtoken's own `default` feature set once `default-features = false`
# is set, so it has to be named explicitly — it's what makes
# `EncodingKey::from_rsa_pem` available below.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
