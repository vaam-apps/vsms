[package]
name = "vsms-example-send"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Runnable example: authenticate to vsms with private_key_jwt and send a message over real HTTP, using vsms-sdk-rust."

[[bin]]
name = "vsms-example-send"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The one dependency that used to be five (jsonwebtoken, reqwest, serde,
# serde_json, uuid) plus ~150 lines of hand-rolled token-exchange code —
# see #171. Path dependency, not a registry one: `sdks/rust/vsms-sdk-rust`
# is a separate Cargo workspace in the same monorepo (same shape as this
# one), not yet published. A real third-party integrator would instead
# depend on the published `vsms-sdk-rust` crates.io version.
vsms-sdk-rust = { path = "../../../sdks/rust/vsms-sdk-rust" }
