packages:
  - "node/*"
  # demo-app is deliberately NOT a member: it is the demo stack's own
  # evaluator, installed and gated standalone (`--ignore-workspace
  # --frozen-lockfile`, its own pnpm-lock.yaml) exactly like the CI job
  # does, so an integrator can copy it out. Without this exclusion a plain
  # `pnpm install`/`pnpm update -r` here auto-discovers it through the
  # glob and merges its whole dependency tree into this lockfile as a new
  # importer (found live while fixing the qs advisory).
  - "!node/demo-app"

# Same trap the root pnpm-workspace.yaml documents (see AGENTS.md): pnpm 11
# blocks postinstall scripts unless allowed here, and pnpm 10's
# `onlyBuiltDependencies` key is silently ignored under pnpm 11 — it wants
# `allowBuilds` (a map), not a list. No package under examples/node builds
# a native dependency today, so this starts empty; add an entry here
# rather than re-discovering the ERR_PNPM_IGNORED_BUILDS trap if one ever
# does.
allowBuilds: {}
