# Validates issue structure against the ai-governance work-item templates.
# Not a PR workflow — issues only. The implementation lives in vaam-apps/.github.
name: issue governance

on:
  issues:
    types: [opened, edited, reopened]

permissions: {}

jobs:
  structure:
    permissions:
      issues: write
    uses: vaam-apps/.github/.github/workflows/issue-governance.yml@b04a3ff5fd9334005b6cd9f14ac55bc1ae7f2879 # vaam-apps/.github main
    with:
      enforce: true
    secrets:
      app-client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
