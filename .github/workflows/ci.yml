name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  migrations:
    name: migrations apply to an empty database
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vsms
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/vsms
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
      # Needed for two steps below: "Apply migrations" (`cargo run -p
      # sms-migrate`, replacing the deleted `ci/apply-migrations.sh` —
      # containerize-tooling PR, the maintainer's standing "no bash
      # scripts — xtask + Docker" direction reaching this job too) and
      # "Bootstrap SQL matches the design doc" (`cargo xtask
      # bootstrap-sql-check`, which replaced the old
      # `python3 ci/gen-bootstrap-sql.py ... && diff -u ...` pair earlier).
      - uses: dtolnay/rust-toolchain@stable

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Milestone 0's gate: a fresh database, every migration in order, no
      # errors. `backends/apps/sms-migrate` is the real production migration
      # runner, not a CI-only stand-in — this job now proves the actual
      # binary a deployment runs, not a parallel shell-script path that
      # could silently drift from it.
      - name: Apply migrations
        run: cargo run -p sms-migrate

      # Legal transitions accepted, illegal ones raise SM001, terminal states
      # have no exits, timestamps auto-stamp, ids satisfy the Cuid guard,
      # webhook dedupe rejects duplicates. Runs in a transaction, rolls back.
      - name: State machines and invariants
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f ci/test-state-machine.sql

      # 0002_bootstrap is generated from section 2.10 of the design doc.
      # If they have drifted, the document and the SQL disagree.
      - name: Bootstrap SQL matches the design doc
        run: cargo xtask bootstrap-sql-check

  schema-drift:
    name: 0001_init matches `cratestack migrate diff`
    runs-on: ubuntu-latest

    # #204: none of the four adjacent gates this repo already had actually
    # checked that backends/migrations/postgres/0001_init/{up,down}.sql is
    # what `cratestack migrate diff` produces from the *current*
    # schemas/vsms.cstack — the `migrations` job above only proves the
    # committed SQL is *valid* (a migration missing a column still applies
    # fine), and neither `rust`'s `cargo check` nor
    # `cargo xtask sdk-schema-check` ever touches generated SQL at all.
    # Migrations here are regenerated wholesale (no committed
    # schema.snapshot.json baseline — AGENTS.md's "Regenerating migrations"
    # section), so two PRs each regenerating 0001_init from a different
    # base is a real hazard: Git merges the result as ordinary text, and a
    # non-conflicting hunk can merge silently wrong. This job does in CI
    # exactly what AGENTS.md/CONTRIBUTING.md already tell a human to do by
    # hand after every schema change.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Matched to the pin in root Cargo.toml, read through
      # `cargo xtask cratestack-pin` — the single place that parses
      # Cargo.toml for this value — rather than hardcoded, or even
      # re-derived with a second copy of the same parsing logic, here. The
      # `js` job below calls the identical subcommand for the identical
      # reason: AGENTS.md's release-engineering notes warn about a
      # duplicated hardcoded *value* drifting when only one copy is
      # updated; a duplicated *extraction* of that value is the same smell
      # one step removed — three parsers to keep in lockstep instead of one
      # `xtask` module three callers share. `cargo xtask migrations-current`
      # below calls the same function in-process too, so all three sites
      # can never silently disagree.
      - name: Read the pinned cratestack version from Cargo.toml
        id: pin
        run: echo "version=$(cargo xtask cratestack-pin)" >> "$GITHUB_OUTPUT"

      # A CLI newer (or older) than the pinned library emits DDL the
      # compiled library never produces — AGENTS.md records this biting
      # twice already (a stale global 0.7.4 CLI against a =0.6.7 pin, and
      # later a drifted 0.7.4-vs-0.7.10 mismatch).
      #
      # cratestack ships its own composite action for this, which both
      # jobs now use instead of `cargo install cratestack-cli --locked`.
      # It downloads the prebuilt binary from that repo's own GitHub
      # Releases and verifies it against the published `.sha256` sidecar
      # before putting it on PATH — so this step no longer compiles an
      # ~18MB binary from source on every run, and gains a supply-chain
      # check `cargo install` never performed.
      #
      # The action ref (`@v0.8.3`) and the `version:` input are
      # deliberately independent, and this is NOT the duplicated-value
      # drift AGENTS.md's release-engineering notes warn about: GitHub
      # forbids expressions in `uses:`, so the ref cannot be derived from
      # the pin even in principle. `cargo xtask cratestack-pin` remains
      # the single source of truth for *which version gets installed*; the
      # ref only says which revision of the installer script runs, and the
      # two need not match. Pinned rather than floating on `@main` per this
      # repo's own rule against unpinned dependencies inside a pipeline —
      # v0.8.3 is the first tag carrying the installer's retry hardening
      # (cratestack#578/#618); v0.8.0 and earlier ship an older script.
      - name: Install cratestack CLI (matched to the library pin)
        uses: cratestack/cratestack/.github/actions/install-cratestack-cli@v0.8.3
        with:
          version: ${{ steps.pin.outputs.version }}

      - name: Regenerate 0001_init and diff it against the committed migration
        run: cargo xtask migrations-current

  rust:
    name: cargo fmt, clippy, test
    runs-on: ubuntu-latest

    env:
      # `include_server_schema!` expands 16 models into one compilation unit,
      # which costs several GB in a single rustc process. Cap concurrency so
      # peak memory stays roughly linear in the job count rather than in the
      # core count. See cratestack/cratestack#250 for the same finding from the
      # framework side, and the `[profile.release]` note in Cargo.toml.
      CARGO_BUILD_JOBS: '4'
      # Incremental state costs memory and disk for nothing on a cold checkout.
      CARGO_INCREMENTAL: '0'

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      # Warnings are errors. Pedantic lints are on workspace-wide.
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # Milestone 0's encoding gate lives in
      # backends/crates/sms-encoding/tests/french_corpus.rs.
      - run: cargo test --workspace

      # The lock file is committed; a build must not silently change it.
      - name: Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      # The Rust SDK is a standalone package intended for crates.io publishing.
      #
      # `--locked` is load-bearing, not decoration. This package is excluded
      # from the root workspace, so it has its own `sdks/rust/Cargo.lock`
      # that the root job's own "Cargo.lock is up to date"
      # (`cargo metadata --locked`) step never sees. Bumping the SDK's
      # version for v0.2.1 left that lock still pinning 0.2.0, and every
      # command here would have silently rewritten it and passed —
      # a committed lockfile disagreeing with its own manifest, with no
      # check anywhere positioned to notice. Found by a review bot, not by
      # CI, which is the point.
      - name: Rust SDK (vsms-sdk-rust) — cargo check, clippy, test, and dry-run
        run: |
          cargo check --locked --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo test
          if cargo tree -i aws-lc-rs; then exit 1; fi
          cargo publish --dry-run
        working-directory: sdks/rust/vsms-sdk-rust

      - name: Examples (Rust) — cargo check and clippy
        run: |
          cargo check --all-targets
          cargo clippy --all-targets -- -D warnings
        working-directory: examples/rust

  deny:
    name: cargo deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-latest

    # #174: this check existed (`just deny`, `deny.toml`) but nothing in CI
    # ever ran it, so RUSTSEC-2023-0071 (Marvin Attack, in `rsa` via
    # authkestra's RS256 path) had been failing silently for however long it
    # was present. Same shape as the pre-#118 problem of live suites nobody
    # ran. `deny.toml`'s `[advisories] ignore` entry for that one advisory
    # carries the reachability analysis inline — this job fails on any
    # *other* advisory, and on the accepted one only if the ignore entry is
    # ever removed.
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      # The Rust SDK is workspace-`exclude`d (#234), so the check above never
      # reaches it — and it is a *published* crate, which arguably raises the
      # bar rather than lowering it: an advisory there ships to external
      # integrators, not just this deployment.
      #
      # Uses the action's own `manifest-path` input, NOT `arguments:
      # --manifest-path ...`. The action always passes that flag itself, so
      # supplying it a second time through `arguments` makes cargo-deny exit
      # with `the argument '--manifest-path <MANIFEST_PATH>' cannot be used
      # multiple times` before running a single check — green-looking job
      # config, immediate hard failure.
      - name: cargo deny on vsms-sdk-rust
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: sdks/rust/vsms-sdk-rust/Cargo.toml

      # #324: the same workspace-`exclude` gap as vsms-sdk-rust above, on
      # three more manifests the root check above can never reach —
      # `ci/e2e-integration/vsms-e2e-integration` (built into a container
      # and run against real credentials), `examples/rust/sms-send` (sample
      # code integrators copy into their own projects), and
      # `deploy/backup-tool` (`vsms-backup`, wired into
      # `deploy/docker-compose.yml` and run against the production
      # database — not a published GHCR image, but a real deployed
      # component holding database credentials, so leaving it unchecked
      # was arguably the worst gap of the three). All were confirmed clean
      # on `advisories`/`bans`/`sources` before this PR; none declared a
      # `license` field, so all three failed `licenses` outright — fixed in
      # #327, a prerequisite for this job actually passing.
      - name: cargo deny on ci/e2e-integration
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: ci/e2e-integration/vsms-e2e-integration/Cargo.toml

      - name: cargo deny on examples/rust
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: examples/rust/sms-send/Cargo.toml

      - name: cargo deny on deploy/backup-tool
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: deploy/backup-tool/Cargo.toml

  live:
    name: live-Postgres suites (sms-test-support)
    runs-on: ubuntu-latest

    env:
      # Same reasoning and same cap as the `rust` job above — this job
      # builds the identical `include_server_schema!`-expanding workspace,
      # plus every *_live_postgres.rs/*_live.rs test binary on top.
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # sms-test-support shells out to `psql` to apply migrations — not
      # preinstalled on ubuntu-latest runners, same as the `migrations`
      # job above (which no longer needs it for this specific purpose:
      # its own "Apply migrations" step now runs `backends/apps/sms-migrate`
      # directly — see that job's own comment — but still needs `psql`
      # for the state-machine assertions step right after it).
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # #44's gate suite (backends/apps/sms-worker/tests/hooks_node_receiver_live.rs)
      # spawns `node src/gate-receiver.ts` as a real subprocess, so this Rust
      # job needs a Node toolchain and that package's dependencies — express
      # is a real runtime dependency, not a dev one.
      #
      # This step did not exist when #192 landed the gate, so the suite has
      # never once passed in CI: it fails at spawn with the test's own
      # "check that `pnpm install` has been run" panic, and `main` was red
      # on exactly that from #192 until this commit. It passed locally
      # because a human had run `pnpm install` in that directory by hand.
      #
      # `--ignore-workspace` is required: pnpm-workspace.yaml covers `admin`
      # and `packages/*` only, so without it pnpm resolves this package
      # against the root workspace and installs no lockfile at all. The
      # example is deliberately outside the workspace — it is meant to be
      # copied out and run standalone by an integrator — so it carries its
      # own committed pnpm-lock.yaml instead, and `--frozen-lockfile` keeps
      # a floating `express@^5.1.0` from silently changing under CI.
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Enable corepack (pins pnpm from packageManager)
        run: corepack enable
      - name: Install the sample Node receiver's dependencies
        run: pnpm install --ignore-workspace --frozen-lockfile
        working-directory: examples/node/webhook-receiver

      # ubuntu-latest ships a running Docker daemon — sms-test-support
      # starts (or reuses) one Postgres 16 container itself via
      # `docker compose -p vsms-test-harness -f compose.yml`, a fixed
      # Compose project name, and applies both migrations before any test
      # runs. This is a genuinely separate job from `rust` above,
      # not an extra step in it: the `postgres:16` service container in
      # the `migrations` job above is unrelated (used only to prove
      # migrations apply to an empty database, never by these Rust
      # suites), and keeping this on its own runner means a slow or flaky
      # container start here can never block `rust`'s own fmt/clippy/test
      # results, or vice versa.
      - name: Run every live-Postgres suite
        run: cargo test --workspace -- --ignored

      # No teardown step: the container is deliberately left running for
      # the rest of this job's lifetime (there is only ever one, and this
      # runner is destroyed at job end regardless), matching the same
      # "leave it running, the fixed name makes a rerun replace rather
      # than add" strategy documented in backends/crates/sms-test-support/src/lib.rs.

  js:
    name: pnpm biome, typecheck, build, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # npm publish --provenance needs an OIDC token

    # The TypeScript half had NO automated gate at all until this job existed:
    # six PRs of real application code (the workspace, @vsms/env, @vsms/ui, the
    # gateway/tRPC/hooks spine, the composer, the messages list) landed with
    # nothing checking that they built, linted, typechecked, or passed their
    # own tests. The only Node step in this workflow installed mermaid-cli for
    # docs. This repo already learned the same lesson once on the Rust side —
    # see AGENTS.md on the 14 live-Postgres suites CI never ran.
    env:
      # `next build` sets NODE_ENV=production, which would otherwise trip the
      # deploy-time env rules in @vsms/env (production requires DASHBOARD_AUTH
      # and an https upstream). Those are deployment guarantees, not compile
      # ones, and CI has neither real auth config nor a TLS upstream. Runtime
      # boot still enforces them; this only exempts the build.
      SKIP_ENV_VALIDATION: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Enable corepack (pins pnpm from packageManager)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Biome (format + lint)
        run: pnpm biome ci .

      # `frontends/packages/sms-client` is generated, not committed, so it
      # must be produced before anything typechecks or builds against it.
      # The CLI is a released artifact rather than something built from a
      # checkout: a client generated by a locally-built binary is
      # reproducible on exactly one machine, which defeats the point of
      # generating it in CI at all. Version-locked to the library pin — a
      # mismatched CLI emits a client calling routes the compiled server
      # does not serve, which is what the route gate below exists to
      # catch.
      #
      # Read through `cargo xtask cratestack-pin` rather than hardcoded
      # here — this step used to be the only place in this workflow with a
      # literal `--version 0.7.10`; #204's own `schema-drift` job needed
      # the identical install and, on the first cut, read the pin with its
      # own copy of the same sed expression rather than a hardcoded
      # literal — closing the value-drift risk but leaving the
      # *extraction* triplicated across this step, that job's matching
      # step, and the old `ci/assert-migrations-current.sh`.
      # `cargo xtask cratestack-pin` is now the one place that parses
      # Cargo.toml for this; both remaining call sites use it. This step
      # still needs no `dtolnay/rust-toolchain@stable`: it uses the `cargo`
      # already on GitHub's own ubuntu-latest runner. Note this is the only
      # reason this job touches Rust at all — the install step below no
      # longer needs a toolchain, but reading the pin does, and a second,
      # toolchain-free parser here would recreate exactly the triplicated
      # extraction the paragraph above describes closing.
      - name: Read the pinned cratestack version from Cargo.toml
        id: pin
        run: echo "version=$(cargo xtask cratestack-pin)" >> "$GITHUB_OUTPUT"
      # See the `schema-drift` job above for why this uses cratestack's own
      # composite action, and why its `@v0.8.3` ref is independent of the
      # `version:` input rather than a duplicated value that can drift.
      - name: Install cratestack CLI (matched to the library pin)
        uses: cratestack/cratestack/.github/actions/install-cratestack-cli@v0.8.3
        with:
          version: ${{ steps.pin.outputs.version }}
      # `just` is not preinstalled on GitHub runners, and no other job in this
      # workflow needed it — they call cargo and ci/*.sh directly. Installing
      # it keeps one definition of what generation and the route gate actually
      # run: inlining the recipes here would duplicate them and let CI drift
      # from what a developer runs locally.
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # `client-check` depends on `client-gen`, so this both generates the
      # client and asserts every route it calls is served by the pinned
      # gateway binary. Running them as separate steps would generate twice.
      - name: Generate the client and check its routes against the server
        run: just client-check

      - name: Typecheck and build
        run: pnpm turbo run typecheck build
      - name: Tests
        run: pnpm turbo run test

      # `pnpm turbo run test` above covers workspace packages only — `admin`
      # and `packages/*` — so it has never reached this one. That mattered:
      # AGENTS.md claims the webhook signature scheme is proven across two
      # languages by asserting both implementations against fixtures a third
      # tool (`openssl dgst -sha256 -hmac`) computed, and names `pnpm test`
      # as the gate for the TypeScript half. The Rust half really was gated
      # (`backends/crates/sms-webhook/tests/cross_language_fixtures.rs`, plain `cargo
      # test`); the TypeScript half had only ever been run by hand. A
      # cross-language agreement proof that only one side actually checks in
      # CI is the half that silently drifts.
      - name: Sample Node receiver — cross-language signature vectors
        run: pnpm install --ignore-workspace --frozen-lockfile && node --test
        working-directory: examples/node/webhook-receiver

      # `examples/node/demo-app` — the demo showcase's own evaluator (the
      # `demo-app` compose service) — carries a byte-for-byte copy of
      # `signature.ts`/`cross-language-vectors.test.ts` from the
      # webhook-receiver step just above, per that package's own README.
      # Gate it exactly the same way, plus a typecheck (this package has
      # no live-gateway run in CI — see `just demo`/`just e2e-integration`
      # for that — so a compile error is the one class of regression this
      # step can catch on its own): `verbatim-copy.test.ts` (part of `node
      # --test` below) is what actually proves the copy hasn't drifted
      # from the file the step above just tested.
      # `tsc` is invoked from node_modules directly rather than via `pnpm
      # run typecheck`: pnpm 11 verifies dependencies before every `run`,
      # and from a directory under the repo root — without
      # `--ignore-workspace` — that check resolves against the ROOT
      # workspace lockfile, which knows nothing about this standalone
      # package, and fails with ERR_PNPM_OUTDATED_LOCKFILE. Found on the
      # first CI run of this step; the install line above is unaffected
      # because it passes the flag.
      - name: Demo app — typecheck and cross-language signature vectors
        run: |
          pnpm install --ignore-workspace --frozen-lockfile
          node_modules/.bin/tsc --noEmit
          node --test
        working-directory: examples/node/demo-app

      # NOT `--ignore-workspace`, unlike the webhook-receiver step above.
      # That example is deliberately outside `pnpm-workspace.yaml` so an
      # integrator can copy it out and run it standalone; this SDK is a real
      # workspace member (`sdks/node/*`), already installed by the root
      # install at the top of this job.
      #
      # The distinction is load-bearing, not cosmetic: `--ignore-workspace`
      # also ignores the root `pnpm-workspace.yaml`'s `allowBuilds`, so
      # `@swc/core`'s native build stays blocked and the whole step dies with
      # `ERR_PNPM_IGNORED_BUILDS` before running a single test. A local
      # `pnpm-workspace.yaml` beside the package does not help either — the
      # flag ignores that too. Verified both, rather than reasoned about.
      # `npm pack --dry-run`, NOT `npm publish --dry-run`. The publish form
      # contacts the registry and refuses when the version already exists:
      #
      #   npm error You cannot publish over the previously published versions: 0.2.0.
      #
      # which is the *steady state* between a release and the next version
      # bump, not a defect — so it turned `main` red the moment
      # @vymalo/vsms-node@0.2.0 was published, and would do so after every
      # single release. `npm pack --dry-run` validates the same packaging
      # (files list, package.json shape) without asserting the version is
      # unpublished, which is the only part of that check CI actually wants.
      #
      # Checked rather than assumed that the Rust side needs no equivalent
      # change: `cargo publish --dry-run` packages, verifies the crate
      # builds from the packaged source, and aborts before upload — it
      # never asks crates.io whether the version exists. Run locally
      # against the already-published 0.2.0, it exits 0.
      - name: Official Node SDK (@vymalo/vsms-node) — test, typecheck and pack validation
        run: |
          pnpm --filter @vymalo/vsms-node run build
          pnpm --filter @vymalo/vsms-node run typecheck
          node --test
          npm pack --dry-run
        working-directory: sdks/node/vsms-sdk-node

  rules:
    name: R1, R2 and R6 — engineering rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This job called plain bash/Python scripts before the `xtask` PR and
      # needed no Rust toolchain at all — now every check here is
      # `cargo xtask <check>`, so this step is new.
      - uses: dtolnay/rust-toolchain@stable

      # R1: all data access goes through CrateStack delegates.
      - run: cargo xtask no-raw-sqlx

      # R2: the diagram everyone reads and the transition table the trigger
      # enforces must agree. Drift shows up in production as an SM001 on an
      # edge that looks legal in the documentation.
      - run: cargo xtask parity
      - run: cargo xtask sdk-schema-check

      # Every path a workflow names must exist. `release` runs only on
      # push to main and on v*.*.* tags, so no PR ever executes it — #271's
      # restructure left five stale Dockerfile paths there and main built
      # no images at all for four merges before anyone looked.
      - run: cargo xtask workflow-paths
      # ci/runner/Dockerfile's CRATESTACK_VERSION default is a second copy
      # of the Cargo.toml pin, and drifted once — see .xtask/src/runner_pin.rs.
      - run: cargo xtask runner-pin
      # R6: pages compose, smart components decide, dumb components style.
      # Prose alone does not hold — the `hasRole('system')` gap was found
      # seven times before it got a golden test, and seven more after. This
      # is R6's equivalent, and it is why the rule landed with a check
      # rather than after the first repeat.
      - run: cargo xtask r6

      # #252: `sdks/node/vsms-sdk-node/src/types.ts` hand-curates enum
      # unions (Encoding, OperatorCode, MessageClass, MessageState) out of
      # schemas/vsms.cstack rather than generating them — nothing else
      # here ever typechecks that hand-written copy against the schema it
      # was copied from, so a variant added, removed, or renamed on either
      # side goes unnoticed until an integrator hits it at runtime.
      - run: cargo xtask node-sdk-types-check

  diagrams:
    name: mermaid diagrams parse
    runs-on: ubuntu-latest

    # #179: this job used to install @mermaid-js/mermaid-cli, whose
    # puppeteer postinstall downloads a Chrome headless-shell build from an
    # upstream CDN on every run, at a version this repo doesn't pin. It
    # failed on #178 — a PR that touched no diagrams — purely because that
    # download failed, and had already been patched once before for a
    # puppeteer sandbox issue (the --no-sandbox flag this job used to pass).
    # Two fixes to the same browser-download problem is the unpinned-
    # moving-dependency-in-a-pipeline pattern AGENTS.md's release-engineering
    # notes warn about, so this is a durable fix rather than a third patch:
    # this job's stated purpose is "diagrams parse", not "diagrams render to
    # SVG", and ci/mermaid-parse/parse.mjs proves exactly that — via
    # mermaid.parse() over jsdom — with no browser, no CDN download, and no
    # puppeteer anywhere in the dependency tree. `mermaid`/`jsdom` are
    # pinned to exact versions in ci/mermaid-parse/package.json +
    # package-lock.json, so nothing here can fail for a reason unrelated to
    # the diagrams themselves.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install the parse-only checker
        working-directory: ci/mermaid-parse
        run: npm ci
      # Every doc with a mermaid block gets checked, not just the design doc:
      # a diagram nothing parses is a diagram that silently rots, which is
      # the whole reason this job exists.
      - name: Parse every diagram in the design doc (no browser)
        run: node ci/mermaid-parse/parse.mjs docs/architecture.md
      - name: Parse every diagram in the roadmap (no browser)
        run: node ci/mermaid-parse/parse.mjs docs/roadmap.md
