name: release

# Builds, packages, and publishes deployment artifacts (Docker images,
# Helm chart) and client SDKs (Rust on crates.io, Node.js on npm).
#
# Release Triggers:
#   - push v*.*.*        -> Production release:
#                           • Docker images: :<tag> and :latest
#                           • Helm chart: OCI semver <tag#v>
#                           • Rust SDK: cargo publish to crates.io
#                           • Node.js SDK: pnpm publish with provenance to npm
#   - push to main       -> Staging/Continuous delivery:
#                           • Docker images: :main and :sha-<12 hex>
#                           • Helm chart: 0.0.0-main.<sha>
#   - workflow_dispatch  -> Manual smoke test:
#                           • Docker images: :branch-<slug> and :sha-<12 hex>
#                           • Helm chart: 0.0.0-dev.<sha>
#                           • SDK dry runs on non-tag triggers

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write # required for npm provenance publishing

jobs:
  # One computation, reused by every image build and artifact publish job
  version:
    name: derive this trigger's tags and chart version
    runs-on: ubuntu-latest
    outputs:
      tag_primary: ${{ steps.v.outputs.tag_primary }}
      tag_secondary: ${{ steps.v.outputs.tag_secondary }}
      chart_version: ${{ steps.v.outputs.chart_version }}
      app_version: ${{ steps.v.outputs.app_version }}
      is_tag: ${{ steps.v.outputs.is_tag }}
    steps:
      - id: v
        run: |
          SHA_SHORT="${GITHUB_SHA:0:12}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            {
              echo "tag_primary=${TAG}"
              echo "tag_secondary=latest"
              echo "chart_version=${TAG#v}"
              echo "app_version=${TAG#v}"
              echo "is_tag=true"
            } >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            {
              echo "tag_primary=main"
              echo "tag_secondary=sha-${SHA_SHORT}"
              echo "chart_version=0.0.0-main.${SHA_SHORT}"
              echo "app_version=main-${SHA_SHORT}"
              echo "is_tag=false"
            } >> "$GITHUB_OUTPUT"
          else
            BRANCH_SLUG="$(printf '%s' "${GITHUB_REF#refs/heads/}" | tr -c 'a-zA-Z0-9' '-' | tr '[:upper:]' '[:lower:]')"
            {
              echo "tag_primary=branch-${BRANCH_SLUG}"
              echo "tag_secondary=sha-${SHA_SHORT}"
              echo "chart_version=0.0.0-dev.${SHA_SHORT}"
              echo "app_version=dev-${SHA_SHORT}"
              echo "is_tag=false"
            } >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: build and push ${{ matrix.image }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sms-gateway
            dockerfile: app/sms-gateway/Dockerfile
          - image: sms-worker
            dockerfile: app/sms-worker/Dockerfile
          - image: admin
            dockerfile: admin/Dockerfile
          - image: migrate
            dockerfile: app/sms-migrate/Dockerfile
          # compose-demo-ghcr: the GHCR-only showcase stack
          # (compose.demo.yaml) has no `build:` stanza for anything,
          # including the provider fake that gets a message past `routed`
          # to a visible `delivered` — see that file's own header comment.
          # This image is a development/demo tool, never a production
          # artifact (app/sms-fake-orange/src/main.rs's own module doc,
          # repeated at WARN on every start), but it needs a real published
          # image the same as the other four the moment any compose stack
          # stops building from source.
          - image: sms-fake-orange
            dockerfile: app/sms-fake-orange/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vsms-${{ matrix.image }}:${{ needs.version.outputs.tag_primary }}
            ghcr.io/${{ github.repository_owner }}/vsms-${{ matrix.image }}:${{ needs.version.outputs.tag_secondary }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.app_version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  publish-chart:
    name: package and push the vsms Helm chart
    needs: [version, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Build chart dependencies
        run: |
          helm repo add bjw-s-labs https://bjw-s-labs.github.io/helm-charts
          helm repo update bjw-s-labs
          helm dependency build deploy/charts/vsms

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package the chart
        run: |
          helm package deploy/charts/vsms \
            --version "${{ needs.version.outputs.chart_version }}" \
            --app-version "${{ needs.version.outputs.app_version }}" \
            --destination dist/

      - name: Push to GHCR as an OCI artifact
        run: |
          helm push dist/vsms-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"

  publish-rust-sdk:
    name: publish vsms-sdk-rust to crates.io
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify vendored schema is up to date
        run: cargo xtask sdk-schema-check

      - name: Cargo publish dry-run
        working-directory: sdks/rust/vsms-sdk-rust
        run: cargo publish --dry-run

      - name: Publish to crates.io
        if: needs.version.outputs.is_tag == 'true'
        working-directory: sdks/rust/vsms-sdk-rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish

  publish-node-sdk:
    name: publish @vsms/sdk to npm
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Enable corepack (pins pnpm)
        run: corepack enable

      - name: Install dependencies
        working-directory: sdks/node/vsms-sdk-node
        run: pnpm install --frozen-lockfile

      - name: Build and typecheck SDK
        working-directory: sdks/node/vsms-sdk-node
        run: |
          pnpm run build
          pnpm run typecheck
          pnpm run test

      - name: Package pack validation
        working-directory: sdks/node/vsms-sdk-node
        run: pnpm pack --dry-run

      - name: Publish dry-run
        working-directory: sdks/node/vsms-sdk-node
        run: pnpm publish --dry-run --no-git-checks

      - name: Publish to npm
        if: needs.version.outputs.is_tag == 'true'
        working-directory: sdks/node/vsms-sdk-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --provenance --no-git-checks
