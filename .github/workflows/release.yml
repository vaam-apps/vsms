name: release

# Builds, packages, and publishes deployment artifacts (Docker images,
# Helm chart) and client SDKs (Rust on crates.io, Node.js on npm).
#
# Release Triggers:
#   - push v*.*.*        -> Production release:
#                           • Docker images: :<tag> and :latest
#                             (every image a linux/amd64 + linux/arm64 manifest list)
#                           • Helm chart: OCI semver <tag#v>
#                           • Rust SDK: cargo publish to crates.io
#                           • Node.js SDK: pnpm publish with provenance to npm
#   - push to main       -> Staging/Continuous delivery:
#                           • Docker images: :main and :sha-<12 hex> (amd64 + arm64)
#                           • Helm chart: 0.0.0-main.<sha>
#   - workflow_dispatch  -> Manual smoke test:
#                           • Docker images: :branch-<slug> and :sha-<12 hex> (amd64 + arm64)
#                           • Helm chart: 0.0.0-dev.<sha>
#                           • SDK dry runs on non-tag triggers

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

# Serialise runs that would write the same image tag, and never cancel one.
#
# `cancel-in-progress: false` is the entire point — every job below either
# publishes (crates.io, npm, GHCR, the Helm chart) or gates something that
# does, and a publish interrupted halfway is the one failure in this repo
# that cannot be re-run into a clean state.
#
# The group is keyed on `github.ref`, not the workflow alone, and that is a
# deliberate narrowing rather than the obvious global lock. When a run is
# pending on a busy group and a newer one joins it, GitHub does not queue
# both — it CANCELS the older pending run. Under a global key that turns a
# routine push to `main` into a mechanism that can silently cancel a queued
# tag release, which would look exactly like a release that never happened.
# Keyed per ref, a tag shares a group with nothing: `refs/tags/v0.3.1` is
# its own key, so no release can ever be cancelled by anything else.
#
# What this does fix: repeated pushes to `main`, which all write the same
# floating `:main` tag and could otherwise interleave and leave it pointing
# at the older commit.
#
# Two residues, stated rather than papered over:
#   - Three pushes to `main` in quick succession still drop the middle
#     one's run while it is pending, so that commit gets no `:sha-<short>`
#     image. Acceptable for continuous delivery, where the newest build is
#     the one anybody wants — and much cheaper than the alternative above.
#   - Two DIFFERENT tags pushed close together still race for `:latest`,
#     because they are in different groups by construction. Fixing that
#     needs the global key this comment just argued against, so it stays
#     open on purpose. Cut one release at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write # required for npm provenance publishing

jobs:
  # One computation, reused by every image build and artifact publish job
  version:
    name: derive this trigger's tags and chart version
    runs-on: ubuntu-latest
    outputs:
      tag_primary: ${{ steps.v.outputs.tag_primary }}
      tag_secondary: ${{ steps.v.outputs.tag_secondary }}
      chart_version: ${{ steps.v.outputs.chart_version }}
      app_version: ${{ steps.v.outputs.app_version }}
      is_tag: ${{ steps.v.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v7
      # A tag names the version every artifact below ships as: images get
      # the tag verbatim, crates.io and npm get whatever the manifests say.
      # Nothing else compares the two, so a tag pushed against manifests
      # still at the previous version would publish images at vX while the
      # SDKs silently land as Y. Refuse that here, before any job runs.
      - name: tag matches the manifest versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          # `[^"]*".*$`, not `.*"$`. These lines carry a trailing
          # `# x-release-please-version` comment, so an end-anchored pattern
          # matches nothing and silently yields an EMPTY version — which is
          # exactly how v0.3.2 failed: `tag=0.3.2 workspace= rust-sdk=`,
          # every publish skipped. The node SDK line below needs no such fix
          # (JSON carries no comment). `cargo xtask release-versions` runs
          # these same three extractions on every PR now, because this job
          # only ever runs on a tag — i.e. after the release PR has merged.
          WS="$(sed -n 's/^version = "\([^"]*\)".*$/\1/p' Cargo.toml | head -1)"
          RUST_SDK="$(sed -n 's/^version = "\([^"]*\)".*$/\1/p' sdks/rust/vsms-sdk-rust/Cargo.toml | head -1)"
          NODE_SDK="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' sdks/node/vsms-sdk-node/package.json | head -1)"
          echo "tag=${TAG} workspace=${WS} rust-sdk=${RUST_SDK} node-sdk=${NODE_SDK}"
          for v in "$WS" "$RUST_SDK" "$NODE_SDK"; do
            [[ "$v" == "$TAG" ]] || { echo "::error::tag v${TAG} does not match a manifest version (see above)"; exit 1; }
          done
      - id: v
        run: |
          SHA_SHORT="${GITHUB_SHA:0:12}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            {
              echo "tag_primary=${TAG}"
              echo "tag_secondary=latest"
              echo "chart_version=${TAG#v}"
              echo "app_version=${TAG#v}"
              echo "is_tag=true"
            } >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            {
              echo "tag_primary=main"
              echo "tag_secondary=sha-${SHA_SHORT}"
              echo "chart_version=0.0.0-main.${SHA_SHORT}"
              echo "app_version=main-${SHA_SHORT}"
              echo "is_tag=false"
            } >> "$GITHUB_OUTPUT"
          else
            BRANCH_SLUG="$(printf '%s' "${GITHUB_REF#refs/heads/}" | tr -c 'a-zA-Z0-9' '-' | tr '[:upper:]' '[:lower:]')"
            {
              echo "tag_primary=branch-${BRANCH_SLUG}"
              echo "tag_secondary=sha-${SHA_SHORT}"
              echo "chart_version=0.0.0-dev.${SHA_SHORT}"
              echo "app_version=dev-${SHA_SHORT}"
              echo "is_tag=false"
            } >> "$GITHUB_OUTPUT"
          fi

  # Every image, for linux/amd64 AND linux/arm64 — see images.yml's own header
  # for how (native runners, no emulation) and for what is asserted. Each
  # architecture is pushed by digest, then `images.yml`'s `merge` job applies
  # the two tags below to a manifest list holding both and fails this run if
  # any tag is not exactly linux/amd64 + linux/arm64.
  #
  # This job used to be a single-architecture `build-and-push` matrix on
  # `ubuntu-latest`; every tag through v0.5.0 is a linux/amd64 image. The
  # first release cut after this change is the first with an arm64 image.
  build-and-push:
    name: build and push every image (amd64 + arm64)
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      push: true
      tag_primary: ${{ needs.version.outputs.tag_primary }}
      tag_secondary: ${{ needs.version.outputs.tag_secondary }}
      app_version: ${{ needs.version.outputs.app_version }}

  publish-chart:
    name: package and push the vsms Helm chart
    needs: [version, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Build chart dependencies
        run: |
          helm repo add bjw-s-labs https://bjw-s-labs.github.io/helm-charts
          helm repo update bjw-s-labs
          helm dependency build deploy/charts/vsms

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package the chart
        run: |
          helm package deploy/charts/vsms \
            --version "${{ needs.version.outputs.chart_version }}" \
            --app-version "${{ needs.version.outputs.app_version }}" \
            --destination dist/

      - name: Push to GHCR as an OCI artifact
        run: |
          helm push dist/vsms-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"

  publish-rust-sdk:
    name: publish vsms-sdk-rust to crates.io
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify vendored schema is up to date
        run: cargo xtask sdk-schema-check

      - name: Cargo publish dry-run
        working-directory: sdks/rust/vsms-sdk-rust
        run: cargo publish --dry-run

      - name: Publish to crates.io
        if: needs.version.outputs.is_tag == 'true'
        working-directory: sdks/rust/vsms-sdk-rust
        # The secret is named CARGO_REGISTRY_TOKEN, matching the env var
        # cargo itself reads. v0.2.0's publish failed with "please provide
        # a non-empty token" because this line referenced a differently
        # named secret (`CRATES_IO_TOKEN`) that was never created — and an
        # unset secret interpolates to the empty string rather than
        # failing the step, so the log showed a blank value instead of an
        # error naming the missing secret. Keep the two names identical;
        # the indirection bought nothing and cost a release.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  publish-node-sdk:
    name: publish @vaam-apps/vsms-node to npm
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - name: Enable corepack (pins pnpm)
        run: corepack enable

      - name: Install dependencies
        working-directory: sdks/node/vsms-sdk-node
        run: pnpm install --frozen-lockfile

      - name: Build and typecheck SDK
        working-directory: sdks/node/vsms-sdk-node
        run: |
          pnpm run build
          pnpm run typecheck
          pnpm run test

      - name: Package pack validation
        working-directory: sdks/node/vsms-sdk-node
        run: pnpm pack --dry-run

      - name: Publish dry-run
        working-directory: sdks/node/vsms-sdk-node
        run: pnpm publish --dry-run --no-git-checks

      # No `NODE_AUTH_TOKEN`. This publishes via npm Trusted Publishing
      # (OIDC), which `permissions: id-token: write` above enables and
      # pnpm 11 performs on its own — there is no npm token in this repo
      # and there is not meant to be one.
      #
      # Setting NODE_AUTH_TOKEN from an npm-token secret that does not
      # exist was actively harmful, not merely redundant:
      # `actions/setup-node`'s `registry-url` writes an `.npmrc` with
      # `_authToken=${NODE_AUTH_TOKEN}`, so an unset secret became an
      # *empty* token rather than no token. On v0.2.0 that turned a clean
      # "OIDC unavailable" into a misleading `E404 PUT
      # https://registry.npmjs.org/@vymalo%2fvsms-node` — npm masks a bad
      # credential as "not found" rather than confirming a package exists
      # to an unauthenticated caller, which sends whoever reads the log
      # hunting for a missing package instead of a missing publisher.
      - name: Publish to npm (Trusted Publishing / OIDC)
        if: needs.version.outputs.is_tag == 'true'
        working-directory: sdks/node/vsms-sdk-node
        run: pnpm publish --access public --provenance --no-git-checks
