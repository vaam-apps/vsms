[package]
name = "vsms-sdk-rust"
version = "0.9.0" # x-release-please-version
edition = "2021"
rust-version = "1.98.0"
license = "MIT"
description = "Rust client for vsms: signs every request with an Ed25519 key (COSE_Sign1) and verifies every answer, so integrators handle no tokens."
repository = "https://github.com/vaam-apps/vsms"
readme = "README.md"
# Kept separate from the product workspace (see the root Cargo.toml's
# `exclude` and this crate's own module doc) so it can be published to
# crates.io independently, on its own version and dependency schedule.
publish = true

[lib]
name = "vsms_sdk"
path = "src/lib.rs"

[dependencies]
# `include_client_schema!` (the compile-time generated typed surface for
# models/inputs/procedure stubs — see `src/lib.rs`'s module doc) lives in
# `cratestack-macros`. Through cratestack 0.7.8 the only way to reach it was
# the `cratestack-pg` facade (`cratestack = { package = "cratestack-pg" }`
# was the mandatory rename — generated code emits absolute `::cratestack::*`
# paths), which unconditionally dragged in `cratestack-axum` — a full axum
# server framework — regardless of `postgres`/`default-features`. That was
# filed upstream as
# [cratestack#490](https://github.com/cratestack/cratestack/issues/490);
# cratestack 0.7.10 fixes it with a fourth, client-only facade,
# `cratestack-client` ([cratestack#492](https://github.com/cratestack/cratestack/pull/492)),
# which re-exports `include_client_schema!` and the generated Rust client
# runtime with `cratestack-axum` structurally absent from its dependency
# graph. This crate moved onto it — same mandatory `cratestack` rename, same
# `codec-json` (for `cratestack::client_rust::JsonCodec`) and
# `decimal-rust-decimal` (for `SendMessageResult.estimatedCostXaf`) features,
# just a lighter facade underneath. Confirmed via `cargo tree --depth 1`:
# `axum`/`tower`/`hyper`/`tower-http`/`cratestack-axum` are gone from this
# crate's dependency tree — see the PR description for the before/after.
#
# `~0.16.0`, not `=0.16.0` — a range, not an exact pin, and the distinction
# is the whole difference between an application manifest and a published
# library's. Cargo resolves exactly one version per semver-compatible line
# for the entire graph, so an `=` requirement in a *library* is not "this
# library uses 0.11.0", it is "nobody in this dependency graph may use any
# other 0.11.x" — a constraint this crate has no standing to impose on a
# consumer it cannot see. That is not hypothetical: a downstream workspace
# on `cratestack-client = "=0.11.1"` could not add `vsms-sdk-rust = "0.3.1"`
# at all (`failed to select a version for cratestack-client` … `versions
# that meet the requirements =0.11.0 are: 0.11.0`) and had to downgrade its
# whole cratestack pin to adopt the SDK. `~0.16.0` (>=0.16.0, <0.17.0) says
# the thing that is actually true — the generated client surface needs the
# 0.16 line, and a patch inside it is fine — and lets the consumer's own
# lockfile pick which patch. The root `Cargo.toml` keeps `=0.16.0` for
# `cratestack-pg`, correctly: that workspace ships binaries, where an exact
# pin binds only itself. `cargo xtask cratestack-pin-check` still holds this
# floor to the root pin, it just accepts the `~` operator here.
#
# `cose` is the signed transport (VS-3/VS-6): it makes the generated `Client`
# seal every call and exposes `ClientEnvelope::seal_call` for `send_message`.
cratestack = { package = "cratestack-client", version = "~0.16.0", default-features = false, features = [
  "codec-json",
  "decimal-rust-decimal",
  "cose",
] }
# PKCS#8 PEM framing of the signing key (`SigningKey::from_pem`/`to_pem`) and
# the unpadded base64url the register commands and `server-keys` speak. Already
# in the graph through `cratestack-cose`.
base64 = "0.22"
# `cratestack-client-rust` 0.7.8 (pulled in via the `cratestack` facade
# above) forces the whole graph's `reqwest` to major 0.13 with
# `rustls-no-provider` (see its own Cargo.toml) — matched here rather than
# adding a second `reqwest` major, or a second TLS backend, to the graph.
# `rustls-no-provider` ships no crypto provider at all and PANICS at
# `Client::build()` unless one is installed first; `src/client.rs`'s
# `ensure_crypto_provider` installs `ring` (matching every other reqwest
# consumer in this repo — AGENTS.md's aws-lc-rs section) before building
# either this crate's own token-fetch client or the `CratestackClient`'s
# internal one, whichever runs first.
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "form",
  "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `SigningKey::generate`: 32 bytes straight from the operating system's CSPRNG.
getrandom = "0.4"
# The seed is wiped when a `SigningKey` is dropped. Already in the graph
# through the Ed25519 implementation.
zeroize = "1"

[dev-dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# A local stand-in for the gateway in tests/transport.rs: proves what the SDK
# puts on the wire (a sealed request, never a bearer) and what it does with an
# unsigned refusal (surfaces it after exactly one attempt) without a live
# stack. Same version pin the main vsms workspace uses (root Cargo.toml).
wiremock = "0.6"
