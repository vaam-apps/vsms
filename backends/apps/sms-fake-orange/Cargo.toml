[package]
name = "sms-fake-orange-bin"
description = "Standalone process wrapper around backends/crates/sms-fake-orange — a development/demo impersonation of Orange Cameroon's SMS API. Never a production binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Package name is `sms-fake-orange-bin`, not `sms-fake-orange` — that name
# already belongs to the library crate this binary depends on
# (`backends/crates/sms-fake-orange`), and Cargo package names must be unique
# workspace-wide. Same collision, same fix as `backends/apps/sms-worker`'s own
# `sms-worker-bin` (see that binary's module doc) — the `[[bin]]` override
# below is what makes the produced executable `sms-fake-orange` regardless.
[[bin]]
name = "sms-fake-orange"
path = "src/main.rs"

[dependencies]
# The whole point of this binary: run the library's fake as a long-lived
# process instead of only ever constructing it inside a #[tokio::test].
# This is the one place in the workspace where a *dev-only, test-shaped*
# dependency (sms-fake-orange itself pulls in wiremock — see its own
# Cargo.toml) ends up compiled into a binary target rather than a
# `[dev-dependencies]` block. Deliberate, and confined to this package:
# `app/` is otherwise production binaries, this one explicitly is not (see
# main.rs's own module doc), and no other package in `app/` depends on it.
sms-fake-orange.workspace = true

anyhow.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
dotenvy.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
