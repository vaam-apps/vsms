[package]
name = "sms-gateway"
description = "SMS gateway API server binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
sms-api.workspace = true
# VSA-3a: the OP's stores, keys and client provisioning (op.rs, the two commands).
sms-auth.workspace = true
# VSC-1: the YAML configuration `serve` and `mtn-subscribe-dlr` read.
sms-config.workspace = true
cratestack.workspace = true
axum.workspace = true
# op.rs hand-wires the token handler against authkestra-axum's functions, and the
# OpState carries an authkestra TokenManager and OpConfig.
authkestra-axum.workspace = true
authkestra-engine.workspace = true
authkestra-op.workspace = true
# token_rate_limit.rs reads `client_id` out of `/token`'s form body.
form_urlencoded.workspace = true
# dlr.rs's real dependency: the SmsProvider trait (#34), and the concrete
# adapters that exist to construct it from — two as of #61's MTN wiring.
sms-provider.workspace = true
sms-provider-orange-cm.workspace = true
sms-provider-mtn.workspace = true
sms-provider-aws-sms.workspace = true
# Only with the `fake-aws` feature, below.
sms-fake-aws = { workspace = true, optional = true }
# dlr.rs builds a test `MtnConfig`, whose price is money, never a float (see
# `MtnConfig::cost_per_segment_xaf`'s own doc).
rust_decimal.workspace = true

# commands/register_client.rs's `pack` for the client's scopes.
sms-core.workspace = true

anyhow.workspace = true
# op_bearer.rs: the BearerVerifier and KeyReload traits are async.
async-trait.workspace = true
clap.workspace = true
# op_bearer.rs (VSA-3b) verifies a machine token's RS256 signature and claims
# against the OP's own key set; machine_tokens_live_postgres.rs also signs a
# client assertion with it.
jsonwebtoken.workspace = true
dotenvy.workspace = true
# main.rs installs the process-wide default `CryptoProvider` before
# constructing any HTTP client — see that call site's own comment.
rustls.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

[features]
default = []
# Demo and test builds only: `providers[code=aws_sms].settings.fake_sns_cert_base` trusts SNS
# signing certificates served by `sms-fake-aws`, so `just demo` can show an
# AWS receipt arriving without an AWS account. Off by default; the release
# workflow builds every image without it, and a build without it refuses the
# key and has not the code (`commands/serve.rs`'s `aws_sms_receiver`). The
# Dockerfile's `CARGO_FEATURES` build argument is how compose.dev.yaml turns
# it on.
fake-aws = ["dep:sms-fake-aws"]

[dev-dependencies]
# The acceptance gates spawn the real `sms-gateway` binary
# (`CARGO_BIN_EXE_sms-gateway`, only available to an integration test inside
# this same package) and drive it over real HTTP with sealed requests.
base64.workspace = true
# pair_console_key_cli_live_postgres.rs mints a P-256 public key to enrol.
p256.workspace = true
rand.workspace = true
# op_bearer.rs's unit tests sign tokens with RSA keys they generate, so no
# private key is committed.
rsa.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# pair_console_key_cli_live_postgres.rs derives a distinct key per run.
sha2.workspace = true
# tests/m1_acceptance_gate_live_postgres.rs gets its DATABASE_URL from this
# instead of the environment.
sms-test-support.workspace = true
# dlr.rs's own unit tests drive its router via `tower::ServiceExt::oneshot`
# against an in-process router.
tower.workspace = true

[lints]
workspace = true
