[package]
name = "sms-fake-aws-bin"
description = "Standalone process wrapper around backends/crates/sms-fake-aws — a development/demo impersonation of AWS End User Messaging SMS and its SNS receipt topic. Never a production binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# `sms-fake-aws-bin`, not `sms-fake-aws`: that name belongs to the library
# this binary wraps. Same collision and fix as `sms-fake-orange-bin`.
[[bin]]
name = "sms-fake-aws"
path = "src/main.rs"

[dependencies]
sms-fake-aws.workspace = true

anyhow.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
rustls.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
