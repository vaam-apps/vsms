# framework. SubmitRequest carries an SmsEncoding rather than reinventing a
# third encoding enum alongside sms-encoding's and the schema's.
sms-encoding.workspace = true
async-trait.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true
