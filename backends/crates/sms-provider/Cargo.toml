[package]
name = "sms-provider"
description = "The SmsProvider trait every adapter (HTTP or SMPP) implements, plus the shared Capabilities and ProviderError types routing decisions read"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
