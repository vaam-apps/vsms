# Refused as NoWayIn until VSA-3b: the API accepts no bearer yet, so machine_tokens is not a
# way in on its own. VSA-3b is the change that flips this back to a legal list.
auth:
  methods: [machine_tokens]
op:
  issuer: https://sms.example.com
  token_rate_limit:
    burst: 10
    refill_per_second: 0.3333333333333333
  signing_key:
    refresh_interval_secs: 60
    rotation_overlap_secs: 1800
