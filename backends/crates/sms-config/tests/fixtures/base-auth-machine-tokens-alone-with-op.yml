# A legal list since VSA-3b: the API accepts a bearer, so machine_tokens is a way in on its own,
# and with its op: block it boots a gateway whose only way in is a token.
auth:
  methods: [machine_tokens]
op:
  issuer: https://sms.example.com
  token_rate_limit:
    burst: 10
    refill_per_second: 0.3333333333333333
  signing_key:
    refresh_interval_secs: 60
    rotation_overlap_secs: 1800
