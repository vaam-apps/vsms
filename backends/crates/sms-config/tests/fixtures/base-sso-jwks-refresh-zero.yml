op:
  issuer: https://sms.example.com
  token_rate_limit:
    burst: 10
    refill_per_second: 0.3333333333333333
  signing_key:
    refresh_interval_secs: 60
    rotation_overlap_secs: 1800
human_login:
  console_client:
    client_id: sms-console
    redirect_uris:
      - https://admin.example.com/api/auth/callback
  login_rate_limit:
    per_email:
      burst: 5
      refill_per_second: 0.1
    aggregate:
      burst: 10
      refill_per_second: 1.0
  sso:
    issuer: https://auth.example.org/realms/staff
    client_id: vsms-gateway
    client_secret: ${SMS_SSO_CLIENT_SECRET}
    scopes: [openid, email, profile]
    required_group: vsms-staff
    groups_claim: groups
    accepted_amr: [otp]
    accepted_acr: []
    jit_role: support
    jwks_min_refresh_secs: 0
    rate_limit: {burst: 30, refill_per_second: 1.0}
