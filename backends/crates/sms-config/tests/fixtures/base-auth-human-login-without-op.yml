auth:
  methods: [keypair, human_login]
human_login:
  console_client:
    client_id: sms-console
    redirect_uris:
      - https://admin.example.com/api/auth/callback
  login_rate_limit:
    per_email:
      burst: 5
      refill_per_second: 0.1
    aggregate:
      burst: 10
      refill_per_second: 1.0
