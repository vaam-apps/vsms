[package]
name = "sms-webhook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata]
description = "Outbound webhook delivery in its two modes - a sealed request (VS-8: the delivery contract, the route rule and the COSE_Sign1 sealer) or the legacy HMAC signature (#41) - pure, no schema coupling"

[dependencies]
# The `hmac` delivery mode (`hmac_v1`): the signature, its verification and the
# secret's generation.
hex.workspace = true
hmac.workspace = true
rand.workspace = true
# `cratestack::client_rust::ClientEnvelope::seal_call` builds the one binding a
# receiver's `EnvelopeLayer` rebuilds (audience, method, route, contract
# digest, payload type), and `cratestack::cose` holds the Ed25519 signer. The
# facade is the same one sms-api compiles against; this crate expands no
# schema, so it adds nothing to the build.
cratestack.workspace = true
sha2.workspace = true
thiserror.workspace = true
# `delivery_route` parses the endpoint URL: the route a delivery binds is its
# path, and a URL the receiver could not route is refused before anything is
# signed.
url.workspace = true

[dev-dependencies]
# tests/cross_language_fixtures.rs reads tests/fixtures/cross_language_vectors.json
# - the same fixture examples/node/webhook-receiver's own test reads - and
# needs nothing beyond a generic JSON value, so no serde derive is pulled in.
# tests/sealed_delivery.rs puts a real `EnvelopeLayer` (Required) in front of an
# axum router - the layer vaam runs on `/webhooks/vsms` - and posts the
# sealer's output to it. The receiver lives in sms-test-support so the worker's
# live suites open what the worker actually sent with the very same layer.
sms-test-support.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
