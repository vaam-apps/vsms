[package]
name = "sms-auth"
description = "authkestra-op ClientStore/ClientAssertionStore over oauth_clients/client_assertions (R1), and standing up the OP itself: key management, CompositeOpStore, OpConfig (#20)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
cratestack.workspace = true
sms-api.workspace = true
sms-core.workspace = true
authkestra-op.workspace = true
# TokenManager/Engine/MemoryStore — op.rs's key management and the stores
# CompositeOpStore's unused (client_credentials-only, #20) authorization
# code/refresh/device-code slots need to type-check.
authkestra-engine.workspace = true
rsa.workspace = true
rand.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The SSO broker (src/sso/*): vsms as an OIDC relying party toward the staff
# IdP. `reqwest` for discovery/JWKS/the code exchange, `jsonwebtoken` for the
# id_token signature, `sha2`/`hex` for the hashed single-use `state`, `subtle`
# for its constant-time comparison, `url` for the endpoint/redirect checks.
reqwest.workspace = true
jsonwebtoken.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
subtle.workspace = true
url.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# oidc_flow_live.rs's own live suite: a real in-process server, a real
# client keypair, a real HTTP round trip against it.
authkestra-axum.workspace = true
axum.workspace = true
# The SSO broker's tests run it against a scripted fake upstream IdP.
sms-fake-oidc.workspace = true
# The four live suites in tests/ get their DATABASE_URL from this instead
# of the environment.
sms-test-support.workspace = true

[lints]
workspace = true
