# A one-command showcase of the whole system, pulling every vsms image from
# GHCR — no `build:` stanza anywhere. This is a *third*, distinct compose
# file, alongside two that already exist for different purposes:
#
#   - `compose.yml` (repo root) — Postgres alone, for `cargo run`/a live test
#     suite/`psql` on a developer's own machine. No application binaries.
#   - `deploy/docker-compose.yml` — the production-shaped stack: a Caddy edge
#     terminating real TLS, every image built from source (`build: context:
#     ..`), a required `.env` of real secrets (`ORANGE_CM_CLIENT_SECRET`, the
#     envelope signing keys, ...), backups, Prometheus. Meant to be cloned
#     onto a VM an operator controls and configures for real traffic.
#   - `compose.demo.yaml` (this file) — a *showcase*: clone the repo, run one
#     command, open a working console, and watch a message reach a
#     terminal state, with no source build, no real Orange account, and no
#     secret an evaluator has to go find. Every application image is pulled
#     from GHCR, pinned to an explicit tag (never `:latest` — a showcase that
#     silently changes under the person demoing it is worse than one that is
#     a version behind). This file will never grow TLS, backups, or
#     Prometheus; that's what the other two are for.
#
# Usage — see docs/runbooks/showcase.adoc for the full walkthrough, including
# what to expect at each step and how to open the console:
#
#   VSMS_COMPOSER_PUBLIC_KEY="$(just dev-composer-public-key)" \
#     docker compose -f compose.demo.yaml --profile console up -d
#   docker compose -f compose.demo.yaml --profile console down -v   # reset
#
# The console profile needs the composer's public key (`register-composer`
# fails without it, and `admin` waits on that); the backend-only stack below
# does not, which is why the variable defaults to empty rather than `:?`.
#
# Backend-only (R4 — CONTRIBUTING.md: "the admin console is optional, the
# backend must run without it"): omit `--profile console` entirely. Every
# service the console needs (`admin`, `register-composer` and `provision-
# user`) carries `profiles: [console]` and is skipped outright — not
# started-then-idle, not present-but-unconfigured. `sms-gateway` and
# `sms-worker` come up healthy either way. A backend-only stack holds no
# client key: register your own with `sms-gateway register-client`, as an
# integrator would (docs/runbooks/showcase.adoc):
#
#   docker compose -f compose.demo.yaml up -d
#   docker compose -f compose.demo.yaml down -v
#
# `down -v` (not a bare `down`) is the documented reset: `-v` drops this
# file's own named volumes (never a bind mount onto the host, and never anything from
# `compose.yml`/`deploy/docker-compose.yml` — Compose scopes volumes to the
# project name below) so every `up` after a `down -v` starts genuinely
# fresh, the same guarantee `scripts/demo.sh down` gives by removing its own
# Postgres container outright.

name: vsms-demo

# The one thing an evaluator should ever need to change: bump
# VSMS_IMAGE_TAG (below, wherever it's interpolated) to showcase a newer
# release. gateway/worker/frontends/apps/admin/migrate are published together by
# .github/workflows/release.yml's `v*.*.*` trigger and always share one
# tag. (A YAML anchor was tried first and rejected: `*anchor` only
# resolves as a whole scalar node, never embedded inside a larger string
# like `image:-tag`, so `ghcr.io/...:*anchor` is parsed as the literal
# eight characters `*anchor` — confirmed with `docker compose config`,
# not assumed. Compose's own `${VAR:-default}` interpolation has no such
# restriction.)
#
# VSMS_IMAGE_OWNER (default `vaam-apps`) is the other half of every image
# reference below — this repository's GitHub owner has moved twice: every
# image through `v0.2.1` published under `ghcr.io/vymalo/...`; `v0.3.0`
# alone published under `ghcr.io/vaam-store/...`; `v0.3.1` and every tag
# after it lands under `ghcr.io/vaam-apps/...`, this file's own default
# now. `.github/workflows/release.yml` already publishes to
# `ghcr.io/${{ github.repository_owner }}/...` unconditionally (correct,
# untouched by either owner change). Showcasing an older release means
# setting the owner together with EVERY tag knob in this file —
# `VSMS_IMAGE_TAG`, `VSMS_DEMO_IMAGE_TAG`, `VSMS_FAKE_ORANGE_IMAGE_TAG`
# and `VSMS_DEMO_APP_IMAGE_TAG` — never a subset: no image was ever
# published under a mismatched pair, so a knob left at its `v0.3.1`
# default under `VSMS_IMAGE_OWNER=vymalo` (or `vaam-store`) fails at pull
# time with `manifest unknown`. docs/runbooks/showcase.adoc has the full
# command.
#
# **`v0.3.1` (this file's own default) is the release this PR prepares —
# the tag is cut immediately after this change merges, so at merge time
# these images do not exist under the new default until that tag
# workflow finishes (accepted; see AGENTS.md's own "Release v0.3.1" section
# for why this ordering is fine).** `v0.3.0` (the prior default) published
# successfully under `ghcr.io/vaam-store/...` (see AGENTS.md's own
# "Release v0.3.0" section). `v0.2.1` before it (production-readiness
# audit S2) was verified live before it became the default: `v0.2.0`'s
# own release run failed
# (`.github/workflows/release.yml`, tag `v0.2.0` — confirmed against the
# GHCR API); `v0.2.1`'s succeeded, and all six images this file
# references (the four production images plus `sms-fake-orange` and the
# demo seeder, both below) were confirmed to exist at that tag with
# `docker manifest inspect` before it replaced the earlier `v0.1.0`
# default (which predated flags this file's own bootstrap
# sequence depends on, and so never actually worked as written). Repeat
# that same `docker manifest inspect` check against `v0.3.1` once the tag
# workflow has actually run, rather than trusting this default blind.
#
# `seed-demo-app` (below) no longer shares `sms-gateway`'s own image at
# all — an image-hygiene PR moved its logic out of `sms-gateway` (it used
# to be `Command::SeedDemoApp`) into its own binary and its own image,
# `ghcr.io/vaam-apps/vsms/demo`, so that no demo-only fixture-seeding
# code ships inside the production gateway image any more. See that
# binary's own module doc (`backends/apps/vsms-demo-seed/src/main.rs`)
# for the full reasoning. It (`VSMS_DEMO_IMAGE_TAG`) and `sms-fake-orange`
# (`VSMS_FAKE_ORANGE_IMAGE_TAG`) are still versioned independently of the
# four production images — both are published on the identical `v*.*.*`
# cadence now (`release.yml`'s build-images matrix shares one
# `tag_primary`/`tag_secondary` across every matrix entry on a given
# trigger, this repo's nested pair included, confirmed live rather than
# assumed from reading the workflow alone), so both now default to
# `v0.3.1` too instead of being required with no default.
#
# `demo-app` (near the bottom of this file) is a THIRD non-production
# image, published at
# `ghcr.io/${VSMS_IMAGE_OWNER:-vaam-apps}/vsms/demo-app` since `v0.3.0`
# (`.github/workflows/release.yml`'s matrix entry for it — confirmed
# live with `docker manifest inspect`, not assumed). It follows the
# identical `image:` shape `VSMS_DEMO_IMAGE_TAG`/`VSMS_FAKE_ORANGE_IMAGE_TAG`
# already use, with its own `VSMS_DEMO_APP_IMAGE_TAG` knob, also
# defaulting to `v0.3.1`. Showcasing a tag before `v0.3.0` means
# `--profile demo` cannot be used at all — no `demo-app` image was ever
# published under an older tag, and this file has no `build:` fallback
# to fall back to (AGENTS.md's own "Release v0.3.0" section records this
# switch from `build:` to `image:` as the follow-up that landed it).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vsms
      POSTGRES_PASSWORD: vsms-demo-only
      POSTGRES_DB: vsms
    # NEVER publish this port. Every other service in this file reaches
    # Postgres over the compose network's own internal DNS (`postgres:5432`)
    # — nothing here needs it reachable from the host, and this machine may
    # already have an unrelated Postgres bound to 5432. If you're reading
    # this because you added a `ports:` block back in to debug something by
    # hand: use `docker compose -f compose.demo.yaml exec postgres psql -U
    # vsms` instead — it reaches the same database without ever putting it
    # on the host network, which is the property this comment exists to
    # protect. (`deploy/docker-compose.yml`'s own `postgres` service carries
    # the identical rule, for the identical reason.)
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vsms -d vsms']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - vsms_demo_pgdata:/var/lib/postgresql/data

  # One-shot: applies backends/migrations/postgres/{0001_init,0002_bootstrap}
  # exactly once each. See backends/apps/sms-migrate/src/main.rs's own module doc —
  # this is the same image `deploy/docker-compose.yml`'s `migrate` service
  # runs, just pulled from GHCR instead of built from source.
  migrate:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-apps}/vsms-migrate:${VSMS_IMAGE_TAG:-v0.9.0} # x-release-please-version
    # Every tag through v0.5.0 was built by a release.yml that published one
    # architecture (amd64) with no multi-arch manifest. Releases cut after
    # images.yml landed are amd64 + arm64, so these pins can go once the
    # default tag above points at one of those. Until then, pin every vsms
    # image to amd64 explicitly so this file
    # behaves the same on an Apple Silicon/ARM host as on amd64,
    # through Docker Desktop's own emulation, rather than failing
    # with a confusing "no matching manifest" the first time someone
    # without an amd64 host tries this file — reproduced for real
    # before adding this, not assumed.
    platform: linux/amd64
    environment:
      DATABASE_URL: postgres://vsms:vsms-demo-only@postgres:5432/vsms
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # sms-gateway also refuses to bind its listener without an `active`
  # `Provider` row keyed `orange_cm`, and `sms-worker`'s `dispatch` role
  # refuses to route anything without a matching, enabled `Route` pointing
  # at it (#62's routing engine — see docs/runbooks/getting-started.adoc's
  # own step 5 for the full "why", and backends/apps/sms-gateway/src/main.rs's
  # `SeedDispatch` doc comment for the fix-forward history).
  #
  # Chained after `migrate`, and every later seed/register step after this
  # one: a *fresh* database's first concurrent touch from two separate
  # connections can race on Postgres's own `pg_type` catalog (`duplicate
  # key value violates unique constraint "pg_type_typname_nsp_index"`),
  # the identical class of race `backends/crates/sms-test-support`'s own
  # per-binary mutex exists to serialize within one process — see
  # AGENTS.md's "ca653a1" note. That mutex can't reach across separate
  # one-shot *containers*, so the seed and register steps against this
  # fresh database are chained sequentially instead, trading a few
  # seconds of startup time for never hitting this race instead of
  # hoping not to.
  seed-dispatch:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-apps}/vsms-sms-gateway:${VSMS_IMAGE_TAG:-v0.9.0} # x-release-please-version
    platform: linux/amd64
    command: ['seed-dispatch']
    environment:
      DATABASE_URL: postgres://vsms:vsms-demo-only@postgres:5432/vsms
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  # The real gap a GHCR-only showcase has that `scripts/demo.sh` doesn't:
  # that script seeds its demo `App`+`SenderId` via `cargo run --example
  # send_test_message` (backends/crates/sms-api/examples/), which is never published
  # as a GHCR image — a `build:`-free compose file has no way to invoke it.
  # `vsms-demo-seed` (`backends/apps/vsms-demo-seed/`, its own crate and its
  # own image — see that binary's own module doc for why it isn't a
  # `sms-gateway` subcommand any more, and why it can't be a plain shell
  # script either) is the GHCR-only equivalent: the one `App` + approved
  # `SenderId` every message this showcase sends needs to exist before
  # `sendMessage` will accept anything. Every flag has a default matching
  # what the old `sms-gateway seed-demo-app` command used, so no `command:`
  # override is needed here — only `DATABASE_URL`. Deliberately
  # unconditional (never gated behind a profile, and never passes
  # `--webhook-url`) — R4: a backend-only deployment
  # (`docker compose -f compose.demo.yaml up -d`, no profiles at all)
  # needs the `App`/`SenderId` `sendMessage` requires, but must NOT get a
  # `WebhookEndpoint` pointed at a `demo-app` container that will never
  # exist — `seed-demo-webhook`, below, is the `--profile demo`-gated
  # sibling that seeds the endpoint, only when `demo-app` is actually
  # part of the stack.
  seed-demo-app:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-apps}/vsms/demo:${VSMS_DEMO_IMAGE_TAG:-v0.9.0} # x-release-please-version
    platform: linux/amd64
    environment:
      DATABASE_URL: postgres://vsms:vsms-demo-only@postgres:5432/vsms
    depends_on:
      seed-dispatch:
        condition: service_completed_successfully
    restart: 'no'

  # The `WebhookEndpoint` `demo-app` (below) needs — split out of
  # `seed-demo-app` into its own, separate, `--profile demo`-gated
  # service rather than a flag `seed-demo-app` always passes. Found
  # live, not assumed: an unconditional `WebhookEndpoint` pointed at
  # `http://demo-app:9000/webhooks` breaks R4 the moment a backend-only
  # `up -d` (no profiles at all) runs — `demo-app` never starts, that
  # hostname never resolves, and `hooks` marks every attempt `dead`,
  # opens the circuit, and logs an error every tick, forever, contrary
  # to this repo's own "not present-but-misconfigured" R4 claim about a
  # profile-skipped service. Same image as `seed-demo-app` (idempotent —
  # this run's own App/SenderId lookups just find what that service
  # already created), invoked a second time with
  # `--webhook-url`/`--webhook-audience` instead. VS-8: a delivery is sealed
  # with the gateway's own key, so there is no secret to hand `demo-app` any
  # more (the shared `vsms_demo_secrets` volume and its `secrets-init` fixup
  # are gone): `demo-app` pins the gateway's public keys
  # (`dev-keys/server-keys.txt`) and the audience this endpoint is created
  # with, `demo-app`.
  #
  # A real bootstrap gap through `v0.2.1`, closed as of `v0.3.0`:
  # `--webhook-url` did not exist in `v0.2.1` — it lands in `v0.3.0` and every tag since,
  # this file's current default, so no default-tag special-casing is
  # needed here any more. `--webhook-audience` and the worker's
  # `SMS_ENVELOPE_SIGNING_KEY_FILE` exist from the release that carries VS-8;
  # the default tags below move to it with release-please. Showcasing `v0.2.1` (`VSMS_IMAGE_OWNER=vymalo`
  # plus every tag knob — see the header) still hits the old gap:
  # `--profile demo` at that tag fails loudly at this one-shot
  # (`unexpected argument '--webhook-url'`) rather than at interpolation
  # time — accepted, since the fix is "use a newer tag," not something
  # this file can paper over for an older one.
  seed-demo-webhook:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-apps}/vsms/demo:${VSMS_DEMO_IMAGE_TAG:-v0.9.0} # x-release-please-version
    platform: linux/amd64
    profiles: [demo]
    command:
      - --webhook-url
      - http://demo-app:9000/webhooks
      - --webhook-audience
      - demo-app
      - --webhook-endpoint-id-out
      - /run/demo-endpoint/webhook-endpoint-id
    volumes:
      # The endpoint's id, which the gateway mints at creation and `demo-app`'s
      # opener is built with (the binding between a delivery and its receiver).
      - vsms_demo_endpoint:/run/demo-endpoint
    environment:
      DATABASE_URL: postgres://vsms:vsms-demo-only@postgres:5432/vsms
    depends_on:
      seed-demo-app:
        condition: service_completed_successfully
    restart: 'no'

  # The composer's own service key (VS-5b): the console sends through an
  # Ed25519 `AppClient` key of its own, registered with `register-client` (the
  # private half is `dev-keys/console-composer.pem`, mounted into `admin`; only
  # the public half is an argument here, from `VSMS_COMPOSER_PUBLIC_KEY`, which
  # `just demo-up` sets). Console-only: a backend-only `up -d` never runs it.
  #
  # Chained after `seed-demo-app` (it needs the `App`), like every seed/register
  # step — see `seed-dispatch`'s own comment.
  register-composer:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-apps}/vsms-sms-gateway:${VSMS_IMAGE_TAG:-v0.9.0} # x-release-please-version
    platform: linux/amd64
    command:
      - register-client
      - --app
      - vsms-demo
      - --client-name
      - console-composer
      - --label
      - console composer (compose.demo.yaml)
      - --scope
      - sms:send
      - --scope
      - sms:read
      - --public-key
      - ${VSMS_COMPOSER_PUBLIC_KEY:-}
    environment:
      DATABASE_URL: postgres://vsms:vsms-demo-only@postgres:5432/vsms
    depends_on:
      seed-demo-app:
        condition: service_completed_successfully
    restart: 'no'
    profiles: [console]

  # The demo app's own service key, registered the way an integrator's is: the
  # private half is `dev-keys/demo-app.pem` (mounted into `demo-app`), only the
  # public half is an argument here, from `VSMS_DEMO_APP_PUBLIC_KEY`, which
  # `just demo-up` sets. `profiles: [demo]`: a stack without `demo-app`
  # registers no key for it.
  register-demo-app:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-apps}/vsms-sms-gateway:${VSMS_IMAGE_TAG:-v0.9.0} # x-release-please-version
    platform: linux/amd64
    command:
      - register-client
      - --app
      - vsms-demo
      - --client-name
      - demo-app
      - --label
      - demo app (compose.demo.yaml)
      - --scope
      - sms:send
      - --scope
      - sms:read
      - --public-key
      - ${VSMS_DEMO_APP_PUBLIC_KEY:-}
    environment:
      DATABASE_URL: postgres://vsms:vsms-demo-only@postgres:5432/vsms
    depends_on:
      seed-demo-app:
        condition: service_completed_successfully
    restart: 'no'
    profiles: [demo]

  # The operator's `User` row. It holds no credential and prints none: the
  # console has no login, so a browser's key is paired to this account with
  # `pair-console-key` (docs/runbooks/showcase.adoc).
  #
  # Depends on `register-composer`, not just `migrate` — the last of the
  # chained seed/register one-shots.
  provision-user:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-apps}/vsms-sms-gateway:${VSMS_IMAGE_TAG:-v0.9.0} # x-release-please-version
    platform: linux/amd64
    command:
      - provision-user
      - --email
      - demo@vsms.local
      - --display-name
      - Demo Operator
      - --role-key
      - owner
    environment:
      DATABASE_URL: postgres://vsms:vsms-demo-only@postgres:5432/vsms
    depends_on:
      register-composer:
        condition: service_completed_successfully
    restart: 'no'
    profiles: [console]

  # A development/demo impersonation of Orange Cameroon's SMS API — see
  # backends/apps/sms-fake-orange/src/main.rs's own module doc. No production
  # deployment references this image; it exists only so this showcase can
  # move a message all the way to `delivered` without a real Orange
  # account. Stateless and DB-free, so it needs no `depends_on` of its own.
  # See this repo's PR description for exactly which published tag this
  # points at and why it can't yet share `VSMS_IMAGE_TAG` with the four
  # production images above. **Nested repository path** (`vsms/
  # sms-fake-orange`, not the flat `vsms-sms-fake-orange` this image
  # published under before the image-hygiene PR that renamed it): every
  # non-production image (this one, and `vsms-demo-seed` above) now lives
  # under `ghcr.io/vaam-apps/vsms/<name>`, so a glance at the registry
  # namespace tells you whether an image is a real release artifact
  # (`ghcr.io/vaam-apps/vsms-<name>`, flat) or a dev/demo tool (`ghcr.io/
  # vaam-apps/vsms/<name>`, nested) — the four production images
  # (`sms-gateway`/`sms-worker`/`admin`/`migrate`) were deliberately left
  # on the flat naming, unrenamed: they published at `v0.1.0` before this
  # convention existed and are already referenced by `compose.demo.yaml`
  # (below), the Helm chart, and `deploy/`, so renaming them is a separate
  # decision with real blast radius the maintainer hasn't made yet.
  sms-fake-orange:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-apps}/vsms/sms-fake-orange:${VSMS_FAKE_ORANGE_IMAGE_TAG:-v0.9.0} # x-release-please-version
    platform: linux/amd64
    restart: unless-stopped
    command:
      - --bind-addr
      - 0.0.0.0:8090
      - --dlr-endpoint
      - http://sms-gateway:8080/dlr/orange_cm
      - --sender-number
      - '+2370000'

  sms-gateway:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-apps}/vsms-sms-gateway:${VSMS_IMAGE_TAG:-v0.9.0} # x-release-please-version
    platform: linux/amd64
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://vsms:vsms-demo-only@postgres:5432/vsms
      # No real Orange account exists for this showcase — every submit
      # goes to sms-fake-orange instead (ORANGE_CM_BASE_URL below), which
      # accepts any credentials by default (see that image's own
      # `--reject-tokens` flag for the one mode where it doesn't).
      ORANGE_CM_CLIENT_ID: placeholder
      ORANGE_CM_CLIENT_SECRET: placeholder
      ORANGE_CM_SENDER_NUMBER: '+2370000'
      ORANGE_CM_BASE_URL: http://sms-fake-orange:8090
      # #134: obviously-demo value, 32+ bytes, never reused anywhere real.
      # The worker carries the identical value: a hash computed under one
      # pepper never equals one computed under another, and nothing
      # detects the mismatch.
      SMS_HASH_PEPPER: vsms-demo-hash-pepper-DO-NOT-USE-IN-PRODUCTION-1234567890
      # VS-3: every request is a COSE_Sign1 envelope and every response is
      # signed back, so the gateway will not boot without its two Ed25519
      # signing keys. They are DEV keys, minted by `just dev-keys` (which
      # `just demo-up` runs first) into the git-ignored `dev-keys/`; never
      # reuse them anywhere real.
      SMS_ENVELOPE_SIGNING_KEY_FILE: /run/envelope/current.pem
      SMS_ENVELOPE_NEXT_SIGNING_KEY_FILE: /run/envelope/next.pem
    volumes:
      - ./dev-keys/envelope-current.pem:/run/envelope/current.pem:ro
      - ./dev-keys/envelope-next.pem:/run/envelope/next.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed-dispatch:
        condition: service_completed_successfully
    # Overrides the image's own baked-in liveness-only HEALTHCHECK with a
    # readiness check (`/readyz`, a real `SELECT 1` against the pool) —
    # identical override, identical reasoning, to
    # `deploy/docker-compose.yml`'s own `sms-gateway` service: `admin`
    # should not start routing to a gateway that's up but can't reach its
    # database.
    healthcheck:
      test: ['CMD', '/usr/local/bin/sms-gateway', 'healthcheck', '--path', '/readyz']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    ports:
      # Loopback only. Not required for anything in this file to function
      # (admin reaches sms-gateway over the internal network exclusively) —
      # published purely so an evaluator can `curl http://127.0.0.1:.../healthz`
      # or exercise the REST API directly without a browser.
      - 127.0.0.1:${VSMS_DEMO_GATEWAY_PORT:-8280}:8080

  sms-worker:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-apps}/vsms-sms-worker:${VSMS_IMAGE_TAG:-v0.9.0} # x-release-please-version
    platform: linux/amd64
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://vsms:vsms-demo-only@postgres:5432/vsms
      # dispatch (submits/reroutes), scheduler (due recurring jobs), jobs
      # (expire_stale/reap_outbox/purge_retention/grey_route_watch) — the
      # same three roles `scripts/demo.sh` used to run — plus drain/hooks,
      # unconditionally, regardless of which profiles (if any) are
      # active: both roles just poll `WebhookEndpoint`/`WebhookAttempt`
      # rows that simply don't exist on a backend-only or
      # `--profile console`-only run (only `--profile demo`'s own
      # `seed-demo-webhook` ever creates one, see that service's own
      # comment) — an empty poll loop, not an error loop. That's the
      # R4-correct shape: the *role* is unconditional, like every other
      # role this worker runs, and what it finds to do is a function of
      # what's actually in the database, not of a profile flag threaded
      # into `SMS_WORKER_ROLES` itself.
      SMS_WORKER_ROLES: dispatch,scheduler,jobs,drain,hooks
      ORANGE_CM_CLIENT_ID: placeholder
      ORANGE_CM_CLIENT_SECRET: placeholder
      ORANGE_CM_SENDER_NUMBER: '+2370000'
      ORANGE_CM_BASE_URL: http://sms-fake-orange:8090
      # VS-8: a sealed webhook delivery is a request signed with the gateway's
      # own envelope signing key, so `hooks` needs the CURRENT key file (never
      # the `next` one, which signs nothing) to deliver a `sealed` endpoint (an
      # `hmac` endpoint needs none, VS-8R; the demo seeds a sealed one).
      # The very file the gateway signs its answers with, so a receiver pins
      # one pair of public keys (`dev-keys/server-keys.txt`) for both.
      SMS_ENVELOPE_SIGNING_KEY_FILE: /run/envelope/current.pem
    volumes:
      - ./dev-keys/envelope-current.pem:/run/envelope/current.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed-dispatch:
        condition: service_completed_successfully
      seed-demo-app:
        condition: service_completed_successfully
      sms-fake-orange:
        condition: service_started

  # R4: everything above this line is the whole backend, and it is
  # healthy with this service never started at all
  # (`docker compose -f compose.demo.yaml up -d`, no `--profile console`).
  admin:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-apps}/vsms-admin:${VSMS_IMAGE_TAG:-v0.9.0} # x-release-please-version
    platform: linux/amd64
    restart: unless-stopped
    profiles: [console]
    # This image's own `output: "standalone"` server.js hardcodes
    # `process.env.NODE_ENV = 'production'` as its second line — verified
    # directly (`docker run --entrypoint sh ... server.js`), not assumed —
    # so there is no environment variable this file can set that makes the
    # packaged image believe it is running in development. That, in turn,
    # trips @vsms/env's deploy-time rule (frontends/packages/env/src/index.ts's
    # `enforceDeploymentRules` block): `SMS_API_URL` must be `https://`
    # whenever `NODE_ENV === "production"`. A showcase reaching its gateway at
    # `http://sms-gateway:8080` with no TLS anywhere in this file is exactly
    # the case that rule exists to refuse — by design, for a real deployment.
    # `SKIP_ENV_VALIDATION=1` is the same escape hatch
    # `frontends/apps/admin/Dockerfile`'s own build stage already uses for the
    # identical reason at build time (its own comment: "next build sets
    # NODE_ENV=production, which would otherwise trip @vsms/env's deploy-
    # time rules... that only make sense at runtime, not compile time") —
    # here it's the runtime instance of the same problem. This is a real,
    # load-bearing trade this showcase makes, not a convenience default:
    # it disables *all* of @vsms/env's zod validation, so a genuine
    # misconfiguration here fails as a confusing runtime error deep in the
    # app rather than a clear startup message. Fronting this with a real
    # (even self-signed) TLS edge would let this image run in its own
    # intended mode instead — out of scope for a one-command, clone-and-run
    # showcase; tracked as follow-up work, not silently worked around.
    #
    # There is no login here (docs/design/console-pairing.md): no client id,
    # no session secret, no issuer, no public origin. A browser makes a key it
    # cannot export and pairs it (the gateway's `pair-console-key`, or a vaam
    # admin phone); the server only carries sealed bytes. What it is
    # configured with is where the gateway is, the gateway's two PUBLIC
    # sealing keys (the browser pins them), and the composer's own key.
    environment:
      SMS_API_URL: http://sms-gateway:8080
      # The composer's service key (registered by `register-composer`). The
      # gateway's two public sealing keys are derived from the dev envelope
      # keys in the entrypoint below; a browser pins them.
      SMS_COMPOSER_KEY_FILE: /run/envelope/console-composer.pem
      MESSAGE_STREAM_POLL_MS: '2000'
      # Every entry below has a zod `.default()` in `@vsms/env`, and every
      # one must still be set explicitly HERE, because `SKIP_ENV_VALIDATION=1`
      # (below) does not merely skip validation — it skips zod entirely, so
      # **its defaults are never applied either**. `MESSAGE_STREAM_POLL_MS`
      # above was already set explicitly and so always worked; these three
      # were not, and the Jobs screen rendered a literal "Refreshes every
      # NaNs" until someone opened it. That is the real cost of the escape
      # hatch, and it is quieter than this file elsewhere claims: not "a
      # confusing runtime error" on a misconfiguration, but silent
      # `undefined` on a correct one.
      DIAGNOSTICS_POLL_MS: '5000'
      DASHBOARD_REFETCH_INTERVAL_MS: '15000'
      AUDIT_LOG_PAGE_SIZE: '50'
      NEXT_PUBLIC_APP_NAME: vsms Admin Console (showcase)
      SKIP_ENV_VALIDATION: '1'
    volumes:
      - ./dev-keys/envelope-current.pem:/run/envelope/current.pem:ro
      - ./dev-keys/envelope-next.pem:/run/envelope/next.pem:ro
      - ./dev-keys/console-composer.pem:/run/envelope/console-composer.pem:ro
    # The browser pins the gateway's two PUBLIC sealing keys, and Compose has no
    # declarative way to derive them from the private PEMs this stack already
    # mounts into the gateway, so the entrypoint does: Node's own `crypto`
    # turns each PEM into the raw 32-byte public key as base64url
    # (`sms-gateway server-keys` prints the same two values). Dev keys only
    # (`just dev-keys`); a real deployment sets the two variables from
    # `sms-gateway server-keys`. `node:26-bookworm-slim` (this image's runtime
    # base, unlike the distroless gateway/worker/fake-orange images) has a real
    # `/bin/sh` to run this with — confirmed directly, not assumed. The only
    # place in this file that overrides an image's entrypoint.
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        pub() { node -e 'const c=require("node:crypto"),fs=require("node:fs");process.stdout.write(c.createPublicKey(c.createPrivateKey(fs.readFileSync(process.argv[1]))).export({format:"jwk"}).x)' "$$1"; }
        export SMS_ENVELOPE_SERVER_KEY_CURRENT="$$(pub /run/envelope/current.pem)"
        export SMS_ENVELOPE_SERVER_KEY_NEXT="$$(pub /run/envelope/next.pem)"
        exec node frontends/apps/admin/server.js
    depends_on:
      sms-gateway:
        condition: service_healthy
      register-composer:
        condition: service_completed_successfully
      provision-user:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:${VSMS_DEMO_CONSOLE_PORT:-3200}:8080

  # The demo showcase's own evaluator — `examples/node/demo-app`'s own
  # module doc has the full reasoning. Sends one OTP through
  # `@vaam-apps/vsms-node`, watches it reach a terminal state, and verifies
  # the `hooks` role's own signed webhook for it — the one piece of this
  # showcase nothing else exercises end to end.
  #
  # Published at `ghcr.io/${VSMS_IMAGE_OWNER:-vaam-apps}/vsms/demo-app`
  # since `v0.3.0` (`.github/workflows/release.yml`'s matrix entry for it,
  # confirmed live with `docker manifest inspect` — see AGENTS.md's own
  # "Release v0.3.0" section) — the same `image:` shape
  # `sms-fake-orange`/`seed-demo-app` already use, pinned via its own
  # `VSMS_DEMO_APP_IMAGE_TAG` knob (default `v0.3.1`). There is no
  # `build:` fallback in this file for a tag before `v0.3.0` — showcasing
  # one means `--profile demo` cannot be used at all, since no
  # `demo-app` image was ever published under an older tag.
  #
  # `profiles: [demo]` — its OWN profile, deliberately never `console`:
  # this is a backend proof (it talks to `sms-gateway` directly, the
  # same way `admin` itself does, never through the console), not a
  # console-only extra, so it must be reachable without ever starting
  # `admin`. `docker compose ... up -d --profile demo` (no `console`) is
  # itself a legitimate, documented way to run this proof — see
  # `docs/runbooks/showcase.adoc`'s own "The demo app" section. It still
  # needs its own service key (`register-demo-app`, which is
  # `profiles: [demo]` for exactly this reason, so it runs for either profile
  # alone).
  #
  # `restart: 'no'` — explicit, matching this file's own convention for
  # every other one-shot step, even though it's also Compose's default
  # when unspecified: this container is meant to run once and exit,
  # never be restarted by Compose itself. It DOES define a real
  # `HEALTHCHECK` in its own Dockerfile (`node -e ...:9000/healthz`,
  # used while the process is up so `docker compose ps` can show
  # `healthy` mid-run) — that's a liveness signal, not a restart policy.
  demo-app:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-apps}/vsms/demo-app:${VSMS_DEMO_APP_IMAGE_TAG:-v0.9.0} # x-release-please-version
    platform: linux/amd64
    profiles: [demo]
    restart: 'no'
    environment:
      VSMS_BASE_URL: http://sms-gateway:8080
      VSMS_SIGNING_KEY_PATH: /run/demo/demo-app.pem
      VSMS_SERVER_KEYS_PATH: /run/demo/server-keys.txt
      DEMO_WEBHOOK_AUDIENCE: demo-app
      DEMO_WEBHOOK_PORT: '9000'
    volumes:
      # The demo app's DEV signing key and the gateway's two public sealing
      # keys, both minted by `just dev-keys` into the git-ignored `dev-keys/`.
      - ./dev-keys/demo-app.pem:/run/demo/demo-app.pem:ro
      - ./dev-keys/server-keys.txt:/run/demo/server-keys.txt:ro
      # The id of the demo's `WebhookEndpoint`, written by `seed-demo-webhook`
      # (which `depends_on` below completes first): `DEMO_WEBHOOK_ENDPOINT_ID_PATH`.
      - vsms_demo_endpoint:/run/demo-endpoint:ro
    depends_on:
      sms-gateway:
        condition: service_healthy
      sms-worker:
        condition: service_started
      seed-demo-webhook:
        condition: service_completed_successfully
      register-demo-app:
        condition: service_completed_successfully

volumes:
  vsms_demo_pgdata:
  vsms_demo_endpoint:
