# A one-command showcase of the whole system, pulling every vsms image from
# GHCR — no `build:` stanza anywhere, with ONE flagged exception
# (`demo-app`, below, until its own GHCR image exists — see that
# service's own comment). This is a *third*, distinct compose
# file, alongside two that already exist for different purposes:
#
#   - `compose.yml` (repo root) — Postgres alone, for `cargo run`/a live test
#     suite/`psql` on a developer's own machine. No application binaries.
#   - `deploy/docker-compose.yml` — the production-shaped stack: a Caddy edge
#     terminating real TLS, every image built from source (`build: context:
#     ..`), a required `.env` of real secrets (`ORANGE_CM_CLIENT_SECRET`, a
#     real `SMS_OIDC_ISSUER`, ...), backups, Prometheus. Meant to be cloned
#     onto a VM an operator controls and configures for real traffic.
#   - `compose.demo.yaml` (this file) — a *showcase*: clone the repo, run one
#     command, sign into a working console, and watch a message reach a
#     terminal state, with no source build, no real Orange account, and no
#     secret an evaluator has to go find. Every application image is pulled
#     from GHCR, pinned to an explicit tag (never `:latest` — a showcase that
#     silently changes under the person demoing it is worse than one that is
#     a version behind). This file will never grow TLS, backups, or
#     Prometheus; that's what the other two are for.
#
# Usage — see docs/runbooks/showcase.adoc for the full walkthrough, including
# what to expect at each step and how to sign into the console:
#
#   docker compose -f compose.demo.yaml --profile console up -d
#   docker compose -f compose.demo.yaml --profile console down -v   # reset
#
# Backend-only (R4 — CONTRIBUTING.md: "the admin console is optional, the
# backend must run without it"): omit `--profile console` entirely. Every
# service the console needs (`admin`, `seed-console-client`, `provision-
# user`, and the tiny permission-fix step between `provision-client` and
# `admin`) carries `profiles: [console]` and is skipped outright — not
# started-then-idle, not present-but-unconfigured. `sms-gateway` and
# `sms-worker` come up healthy either way, and `provision-client` (a real,
# HTTP-usable client credential) is *not* gated behind the profile, since a
# working machine credential is exactly what a backend-only deployment
# needs to prove it's alive:
#
#   docker compose -f compose.demo.yaml up -d
#   docker compose -f compose.demo.yaml down -v
#
# `down -v` (not a bare `down`) is the documented reset: `provision-client`
# refuses to overwrite an existing private key (a real, intentional safety
# property — see backends/apps/sms-gateway/src/main.rs's own doc on `--key-out`), so a
# second `up` against the *same* named volumes fails loudly rather than
# silently reusing stale credentials. `-v` drops this file's own named
# volumes (never a bind mount onto the host, and never anything from
# `compose.yml`/`deploy/docker-compose.yml` — Compose scopes volumes to the
# project name below) so every `up` after a `down -v` starts genuinely
# fresh, the same guarantee `scripts/demo.sh down` gives by removing its own
# Postgres container outright.

name: vsms-demo

# The one thing an evaluator should ever need to change: bump
# VSMS_IMAGE_TAG (below, wherever it's interpolated) to showcase a newer
# release. gateway/worker/frontends/apps/admin/migrate are published together by
# .github/workflows/release.yml's `v*.*.*` trigger and always share one
# tag. (A YAML anchor was tried first and rejected: `*anchor` only
# resolves as a whole scalar node, never embedded inside a larger string
# like `image:-tag`, so `ghcr.io/...:*anchor` is parsed as the literal
# eight characters `*anchor` — confirmed with `docker compose config`,
# not assumed. Compose's own `${VAR:-default}` interpolation has no such
# restriction.)
#
# VSMS_IMAGE_OWNER (default `vaam-store`) is the other half of every image
# reference below — every image through `v0.2.1` published under
# `ghcr.io/vymalo/...`; this repository's own GitHub owner moved to
# `vaam-store` for this release, and `.github/workflows/release.yml`
# already publishes to `ghcr.io/${{ github.repository_owner }}/...`
# unconditionally (correct, untouched by this change), so `v0.3.0` and
# every tag after it lands under the new owner. Showcasing an older
# release means setting the owner together with EVERY tag knob in this
# file — `VSMS_IMAGE_TAG`, `VSMS_DEMO_IMAGE_TAG` and
# `VSMS_FAKE_ORANGE_IMAGE_TAG` — never a subset: no image was ever
# published under a mismatched pair, so a knob left at its `v0.3.0`
# default under `VSMS_IMAGE_OWNER=vymalo` fails at pull time with
# `manifest unknown`. docs/runbooks/showcase.adoc has the full command.
#
# **`v0.3.0` (this file's own default) is the release this PR prepares —
# the tag is cut immediately after this change merges, so at merge time
# these images do not exist under the new default until that tag
# workflow finishes (accepted; see AGENTS.md's own "Release v0.3.0" section
# for why this ordering is fine).** `v0.2.1` (the prior default,
# production-readiness audit S2) was verified live before it became the
# default: `v0.2.0`'s own release run failed
# (`.github/workflows/release.yml`, tag `v0.2.0` — confirmed against the
# GHCR API); `v0.2.1`'s succeeded, and all six images this file
# references (the four production images plus `sms-fake-orange` and the
# demo seeder, both below) were confirmed to exist at that tag with
# `docker manifest inspect` before it replaced the earlier `v0.1.0`
# default (which predated `provision-client`'s
# `--app-slug`/`--client-id-out` flags this file's own bootstrap
# sequence depends on, and so never actually worked as written). Repeat
# that same `docker manifest inspect` check against `v0.3.0` once the tag
# workflow has actually run, rather than trusting this default blind.
#
# `seed-demo-app` (below) no longer shares `sms-gateway`'s own image at
# all — an image-hygiene PR moved its logic out of `sms-gateway` (it used
# to be `Command::SeedDemoApp`) into its own binary and its own image,
# `ghcr.io/vaam-store/vsms/demo`, so that no demo-only fixture-seeding
# code ships inside the production gateway image any more. See that
# binary's own module doc (`backends/apps/vsms-demo-seed/src/main.rs`)
# for the full reasoning. It (`VSMS_DEMO_IMAGE_TAG`) and `sms-fake-orange`
# (`VSMS_FAKE_ORANGE_IMAGE_TAG`) are still versioned independently of the
# four production images — both are published on the identical `v*.*.*`
# cadence now (`release.yml`'s build-images matrix shares one
# `tag_primary`/`tag_secondary` across every matrix entry on a given
# trigger, this repo's nested pair included, confirmed live rather than
# assumed from reading the workflow alone), so both now default to
# `v0.3.0` too instead of being required with no default.
#
# `demo-app` (near the bottom of this file) is a THIRD non-production
# image, and does not fit either pattern above yet: no
# `ghcr.io/${VSMS_IMAGE_OWNER:-vaam-store}/vsms/demo-app` image has ever
# been published (its own `.github/workflows/release.yml` matrix entry is
# new in this PR — the next `v*.*.*` tag is the first one that will
# actually publish it), so this file builds it from source (`build:`,
# that service's own comment explains why this is the one deliberate
# exception to "every image pulled from GHCR"). Once a tag exists, its
# `image:` line should follow the identical
# `ghcr.io/${VSMS_IMAGE_OWNER:-vaam-store}/vsms/demo-app:${VSMS_DEMO_APP_IMAGE_TAG:?...}`
# shape `VSMS_DEMO_IMAGE_TAG`/`VSMS_FAKE_ORANGE_IMAGE_TAG` already use —
# not introduced here as a real variable, since nothing in this file
# reads it yet and an unused required variable would just be a second
# kind of dangling reference. Switching this service from `build:` to
# `image:` is a post-`v0.3.0` follow-up (AGENTS.md's own "Release v0.3.0"
# section), not attempted in this change.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vsms
      POSTGRES_PASSWORD: vsms-demo-only
      POSTGRES_DB: vsms
    # NEVER publish this port. Every other service in this file reaches
    # Postgres over the compose network's own internal DNS (`postgres:5432`)
    # — nothing here needs it reachable from the host, and this machine may
    # already have an unrelated Postgres bound to 5432. If you're reading
    # this because you added a `ports:` block back in to debug something by
    # hand: use `docker compose -f compose.demo.yaml exec postgres psql -U
    # vsms` instead — it reaches the same database without ever putting it
    # on the host network, which is the property this comment exists to
    # protect. (`deploy/docker-compose.yml`'s own `postgres` service carries
    # the identical rule, for the identical reason.)
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vsms -d vsms']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - vsms_demo_pgdata:/var/lib/postgresql/data

  # One-shot: applies backends/migrations/postgres/{0001_init,0002_bootstrap}
  # exactly once each. See backends/apps/sms-migrate/src/main.rs's own module doc —
  # this is the same image `deploy/docker-compose.yml`'s `migrate` service
  # runs, just pulled from GHCR instead of built from source.
  migrate:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-store}/vsms-migrate:${VSMS_IMAGE_TAG:-v0.3.0}
    # release.yml's build-and-push matrix publishes one architecture
    # (whatever the ubuntu-latest runner is, amd64) with no multi-arch
    # manifest — pin every vsms image to it explicitly so this file
    # behaves the same on an Apple Silicon/ARM host as on amd64,
    # through Docker Desktop's own emulation, rather than failing
    # with a confusing "no matching manifest" the first time someone
    # without an amd64 host tries this file — reproduced for real
    # before adding this, not assumed.
    platform: linux/amd64
    environment:
      DATABASE_URL: postgres://vsms:vsms-demo-only@postgres:5432/vsms
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # sms-gateway refuses to bind its listener at all without an active OP
  # signing key (AGENTS.md's own M1 section — found live in #139: it fails
  # at process start, not lazily on the first /token request), so this has
  # to complete before `sms-gateway` is ever started, not just before it's
  # expected to serve traffic.
  seed-signing-key:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-store}/vsms-sms-gateway:${VSMS_IMAGE_TAG:-v0.3.0}
    platform: linux/amd64
    command: ['rotate-signing-key']
    environment:
      DATABASE_URL: postgres://vsms:vsms-demo-only@postgres:5432/vsms
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  # sms-gateway also refuses to bind its listener without an `active`
  # `Provider` row keyed `orange_cm`, and `sms-worker`'s `dispatch` role
  # refuses to route anything without a matching, enabled `Route` pointing
  # at it (#62's routing engine — see docs/runbooks/getting-started.adoc's
  # own step 5 for the full "why", and backends/apps/sms-gateway/src/main.rs's
  # `SeedDispatch` doc comment for the fix-forward history).
  #
  # Depends on `seed-signing-key`, not just `migrate`, even though the two
  # write disjoint tables — found live, reproduced twice: a *fresh*
  # database's first concurrent touch from two separate connections can
  # race on Postgres's own `pg_type` catalog (`duplicate key value
  # violates unique constraint "pg_type_typname_nsp_index"`), the identical
  # class of race `backends/crates/sms-test-support`'s own per-binary mutex exists
  # to serialize within one process — see AGENTS.md's "ca653a1" note. That
  # mutex can't reach across separate one-shot *containers*, so every
  # seed/provision step against this fresh database is chained
  # sequentially instead, all the way through `provision-client` below,
  # trading a few seconds of startup time for never hitting this race
  # instead of hoping not to.
  seed-dispatch:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-store}/vsms-sms-gateway:${VSMS_IMAGE_TAG:-v0.3.0}
    platform: linux/amd64
    command: ['seed-dispatch']
    environment:
      DATABASE_URL: postgres://vsms:vsms-demo-only@postgres:5432/vsms
    depends_on:
      seed-signing-key:
        condition: service_completed_successfully
    restart: 'no'

  # The real gap a GHCR-only showcase has that `scripts/demo.sh` doesn't:
  # that script seeds its demo `App`+`SenderId` via `cargo run --example
  # send_test_message` (backends/crates/sms-api/examples/), which is never published
  # as a GHCR image — a `build:`-free compose file has no way to invoke it.
  # `vsms-demo-seed` (`backends/apps/vsms-demo-seed/`, its own crate and its
  # own image — see that binary's own module doc for why it isn't a
  # `sms-gateway` subcommand any more, and why it can't be a plain shell
  # script either) is the GHCR-only equivalent: the one `App` + approved
  # `SenderId` every message this showcase sends needs to exist before
  # `sendMessage` will accept anything. Every flag has a default matching
  # what the old `sms-gateway seed-demo-app` command used, so no `command:`
  # override is needed here — only `DATABASE_URL`. Deliberately
  # unconditional (never gated behind a profile, and never passes
  # `--webhook-url`) — R4: a backend-only deployment
  # (`docker compose -f compose.demo.yaml up -d`, no profiles at all)
  # needs the `App`/`SenderId` `sendMessage` requires, but must NOT get a
  # `WebhookEndpoint` pointed at a `demo-app` container that will never
  # exist — `seed-demo-webhook`, below, is the `--profile demo`-gated
  # sibling that seeds the endpoint, only when `demo-app` is actually
  # part of the stack.
  seed-demo-app:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-store}/vsms/demo:${VSMS_DEMO_IMAGE_TAG:-v0.3.0}
    platform: linux/amd64
    environment:
      DATABASE_URL: postgres://vsms:vsms-demo-only@postgres:5432/vsms
    depends_on:
      seed-dispatch:
        condition: service_completed_successfully
    restart: 'no'

  # The `WebhookEndpoint` `demo-app` (below) needs — split out of
  # `seed-demo-app` into its own, separate, `--profile demo`-gated
  # service rather than a flag `seed-demo-app` always passes. Found
  # live, not assumed: an unconditional `WebhookEndpoint` pointed at
  # `http://demo-app:9000/webhooks` breaks R4 the moment a backend-only
  # `up -d` (no profiles at all) runs — `demo-app` never starts, that
  # hostname never resolves, and `hooks` marks every attempt `dead`,
  # opens the circuit, and logs an error every tick, forever, contrary
  # to this repo's own "not present-but-misconfigured" R4 claim about a
  # profile-skipped service. Same image as `seed-demo-app` (idempotent —
  # this run's own App/SenderId lookups just find what that service
  # already created), invoked a second time with
  # `--webhook-url`/`--webhook-secret-out` instead. `--webhook-secret-out`
  # is what lets `demo-app` (`--profile demo` too) read the
  # freshly-generated `WebhookEndpoint.secret` — the identical "one
  # container's computed output, a sibling's input" problem
  # `provision-client`'s own `--client-id-out` already solves the same
  # way.
  #
  # A real bootstrap gap through `v0.2.1`, closed as of `v0.3.0`, same
  # shape as the one this file's own header used to name for
  # `provision-client`'s `--app-slug`/`--client-id-out` (fixed as of
  # `v0.2.1` — see the header): `--webhook-url`/`--webhook-secret-out`
  # did not exist in `v0.2.1` — they land in `v0.3.0`, this file's
  # default tag, for the first time, so no default-tag special-casing is
  # needed here any more. Showcasing `v0.2.1` (`VSMS_IMAGE_OWNER=vymalo`
  # plus every tag knob — see the header) still hits the old gap:
  # `--profile demo` at that tag fails loudly at this one-shot
  # (`unexpected argument '--webhook-url'`) rather than at interpolation
  # time — accepted, since the fix is "use a newer tag," not something
  # this file can paper over for an older one.
  seed-demo-webhook:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-store}/vsms/demo:${VSMS_DEMO_IMAGE_TAG:-v0.3.0}
    platform: linux/amd64
    profiles: [demo]
    command:
      - --webhook-url
      - http://demo-app:9000/webhooks
      - --webhook-secret-out
      - /secrets/webhook-secret
    environment:
      DATABASE_URL: postgres://vsms:vsms-demo-only@postgres:5432/vsms
    volumes:
      - vsms_demo_secrets:/secrets
    depends_on:
      seed-demo-app:
        condition: service_completed_successfully
      secrets-init:
        condition: service_completed_successfully
    restart: 'no'

  # Backend-only demo credential (R4: never gated behind `--profile
  # console` — a working machine credential is exactly what a backend-only
  # deployment should be able to prove it has). `provisionAppClient`
  # generates `clientId` itself (a random `appc_<uuid>`, never
  # caller-chosen — backends/crates/sms-api/src/procedures.rs), so nothing in this
  # compose file can know it in advance the way every other value here is
  # known up front. `--app-slug` (added to `ProvisionClient` alongside
  # `--client-id-out`, same PR as `seed-demo-app`) resolves the id
  # `seed-demo-app` created without shuttling it out of that container by
  # hand; `--client-id-out` writes the *result* — the one thing this
  # container computes that a sibling container (`admin`, if the console
  # profile is active) needs — to the shared `vsms_demo_secrets` volume,
  # since Compose has no other way to feed one service's computed output
  # into another service's environment.
  #
  # `user: "0:0"` overrides the image's own distroless-nonroot uid (65532)
  # deliberately: a fresh named volume is created root-owned, and this is
  # the only container that ever *creates* files in it — `secrets-fix-
  # perms` below (root by default, a stock `busybox` image) is what makes
  # the result readable by `admin`'s own non-root uid (10001) afterward.
  # `--key-out`'s own `0600` mode is unaffected either way — this only
  # changes who *owns* the resulting file, not how permissive its mode is.
  # (Chained after `seed-demo-app`, and both console-only steps below chain
  # after *this* — see `seed-dispatch`'s own comment on why every seed/
  # provision step against this fresh database runs sequentially rather
  # than in parallel. `provision-client` itself stays independent of
  # anything `profiles: [console]`-gated, so it still runs to completion in
  # backend-only mode.)
  provision-client:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-store}/vsms-sms-gateway:${VSMS_IMAGE_TAG:-v0.3.0}
    platform: linux/amd64
    user: '0:0'
    command:
      - provision-client
      - --app-slug
      - vsms-demo
      - --label
      - demo console (compose.demo.yaml)
      - --scope
      - sms:send
      - --scope
      - sms:read
      - --scope
      - job:read
      - --scope
      - job:enqueue
      - --scope
      - worker:read
      - --scope
      - provider:read
      - --scope
      - route:read
      - --scope
      - dashboard:read
      - --key-out
      - /secrets/console-client-key.pem
      - --client-id-out
      - /secrets/console-client-id
    environment:
      DATABASE_URL: postgres://vsms:vsms-demo-only@postgres:5432/vsms
      # #134: real secret material in production, minimum 32 bytes,
      # validated before anything else runs. This is an *obviously* demo
      # value — never reuse it anywhere real. See `sms-gateway`'s own
      # environment block below for the one place it's actually load-
      # bearing (Message.msisdnHash/bodyHash); provision-client only needs
      # it because `Procedures::new` takes a `HashPepper` unconditionally,
      # not because provisioning a client hashes anything itself.
      SMS_HASH_PEPPER: vsms-demo-hash-pepper-DO-NOT-USE-IN-PRODUCTION-1234567890
    volumes:
      - vsms_demo_secrets:/secrets
    depends_on:
      seed-demo-app:
        condition: service_completed_successfully
      secrets-init:
        condition: service_completed_successfully
    restart: 'no'

  # `chmod 0777` on a *fresh* named volume before `provision-client` (which
  # runs as uid 0, see above) ever writes to it — Compose creates a new
  # named volume root-owned at 0755, which blocks a write from any other
  # uid, and `provision-client` running as root sidesteps the read half of
  # that but this still has to exist so the directory itself is writable in
  # the first place. `busybox` (Docker Hub, not GHCR): the one non-GHCR
  # image in this file, alongside `postgres` above and `secrets-fix-perms`
  # below — small, stock, official infrastructure glue, not a vsms
  # application image. "Only pre-built images from GHCR, no `build:`
  # stanza" (this PR's own brief) is about never compiling vsms source
  # inside this file, not about refusing an off-the-shelf image for a
  # two-line permissions fixup, the same reading `deploy/docker-compose.yml`
  # already relies on for its own `postgres:16-alpine`.
  secrets-init:
    image: busybox:1.36
    command: ['sh', '-c', 'mkdir -p /secrets && chmod 0777 /secrets']
    volumes:
      - vsms_demo_secrets:/secrets
    restart: 'no'

  # The other half of the `provision-client`/`admin` handoff: `--key-out`'s
  # own `0600` mode (backends/apps/sms-gateway/src/main.rs, unchanged and correct —
  # "never store this anywhere else" is still the right default) means the
  # file is readable only by the uid that created it (root, per
  # `provision-client`'s own `user: "0:0"` override above), and `admin`
  # runs as its own baked-in non-root uid (10001, `frontends/apps/admin/Dockerfile`'s
  # `useradd --uid 10001`). Loosening the mode to `0644` — readable inside
  # this compose project's own internal Docker volume, never exposed to the
  # host or the network — is the trade this showcase makes so `admin` can
  # read a key it legitimately needs (to sign every `private_key_jwt`
  # assertion it sends to `sms-gateway`) without running as root itself or
  # `sms-gateway`'s own image gaining a chmod-capable shell it doesn't
  # otherwise need. `profiles: [console, demo]` — Compose starts a
  # service the moment ANY one of its own profiles is active (verified
  # directly: `docker compose --profile demo config --services` lists
  # this service, and so does `--profile console`), so this stays
  # skipped on a genuinely backend-only `up -d` (no profiles at all)
  # while running for either `admin` (`console`) or `demo-app` (`demo`)
  # alone, not just when both are requested together.
  secrets-fix-perms:
    image: busybox:1.36
    command: ['sh', '-c', 'chmod 0644 /secrets/console-client-key.pem /secrets/console-client-id']
    volumes:
      - vsms_demo_secrets:/secrets
    depends_on:
      provision-client:
        condition: service_completed_successfully
    restart: 'no'
    profiles: [console, demo]

  # Registers the `sms-console` OauthClient row #194's human login flow
  # needs. `--redirect-uri` must equal `${ADMIN_BASE_URL}/api/auth/callback`
  # character for character (RFC 6749 §3.1.2) — `localhost`, matching
  # `admin`'s own `ADMIN_BASE_URL` below and the host port this file
  # publishes `admin` on.
  #
  # Depends on `provision-client`, not just `migrate` — see `seed-dispatch`'s
  # own comment: every seed/provision step against this fresh database
  # chains sequentially, console-only steps included, rather than racing a
  # sibling container's first touch of the same catalog.
  seed-console-client:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-store}/vsms-sms-gateway:${VSMS_IMAGE_TAG:-v0.3.0}
    platform: linux/amd64
    command:
      - seed-console-client
      - --client-id
      - sms-console
      - --redirect-uri
      - http://localhost:${VSMS_DEMO_CONSOLE_PORT:-3200}/api/auth/callback
    environment:
      DATABASE_URL: postgres://vsms:vsms-demo-only@postgres:5432/vsms
    depends_on:
      provision-client:
        condition: service_completed_successfully
    restart: 'no'
    profiles: [console]

  # The human account to actually sign in with. `provision-user` generates
  # a random password and prints it exactly once, to this container's own
  # log — it is never stored anywhere and this file cannot know it in
  # advance any more than it can know `provision-client`'s clientId, so
  # read it back after `up` finishes:
  #
  #   docker compose -f compose.demo.yaml logs provision-user
  #
  # Depends on `seed-console-client`, not just `migrate` — same reasoning
  # as that service's own comment, chaining the last of the seed/provision
  # one-shots.
  provision-user:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-store}/vsms-sms-gateway:${VSMS_IMAGE_TAG:-v0.3.0}
    platform: linux/amd64
    command:
      - provision-user
      - --email
      - demo@vsms.local
      - --display-name
      - Demo Operator
      - --role-key
      - owner
    environment:
      DATABASE_URL: postgres://vsms:vsms-demo-only@postgres:5432/vsms
    depends_on:
      seed-console-client:
        condition: service_completed_successfully
    restart: 'no'
    profiles: [console]

  # A development/demo impersonation of Orange Cameroon's SMS API — see
  # backends/apps/sms-fake-orange/src/main.rs's own module doc. No production
  # deployment references this image; it exists only so this showcase can
  # move a message all the way to `delivered` without a real Orange
  # account. Stateless and DB-free, so it needs no `depends_on` of its own.
  # See this repo's PR description for exactly which published tag this
  # points at and why it can't yet share `VSMS_IMAGE_TAG` with the four
  # production images above. **Nested repository path** (`vsms/
  # sms-fake-orange`, not the flat `vsms-sms-fake-orange` this image
  # published under before the image-hygiene PR that renamed it): every
  # non-production image (this one, and `vsms-demo-seed` above) now lives
  # under `ghcr.io/vaam-store/vsms/<name>`, so a glance at the registry
  # namespace tells you whether an image is a real release artifact
  # (`ghcr.io/vaam-store/vsms-<name>`, flat) or a dev/demo tool (`ghcr.io/
  # vaam-store/vsms/<name>`, nested) — the four production images
  # (`sms-gateway`/`sms-worker`/`admin`/`migrate`) were deliberately left
  # on the flat naming, unrenamed: they published at `v0.1.0` before this
  # convention existed and are already referenced by `compose.demo.yaml`
  # (below), the Helm chart, and `deploy/`, so renaming them is a separate
  # decision with real blast radius the maintainer hasn't made yet.
  sms-fake-orange:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-store}/vsms/sms-fake-orange:${VSMS_FAKE_ORANGE_IMAGE_TAG:-v0.3.0}
    platform: linux/amd64
    restart: unless-stopped
    command:
      - --bind-addr
      - 0.0.0.0:8090
      - --dlr-endpoint
      - http://sms-gateway:8080/dlr/orange_cm
      - --sender-number
      - '+2370000'

  sms-gateway:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-store}/vsms-sms-gateway:${VSMS_IMAGE_TAG:-v0.3.0}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://vsms:vsms-demo-only@postgres:5432/vsms
      # Internal DNS, never the host-published port below — `admin` (when
      # the console profile is active) fetches JWKS/exchanges `/token`
      # against exactly this value, server-side, over the compose network;
      # the browser never talks to sms-gateway directly (see #194's own
      # "POST /login... the browser never talks to sms-gateway directly"
      # note). Every token this OP mints carries this as `iss`, so this
      # must be the *same* string `admin`'s own `SMS_AUTH_ISSUER` uses
      # below, not merely an equivalent one.
      SMS_OIDC_ISSUER: http://sms-gateway:8080
      # No real Orange account exists for this showcase — every submit
      # goes to sms-fake-orange instead (ORANGE_CM_BASE_URL below), which
      # accepts any credentials by default (see that image's own
      # `--reject-tokens` flag for the one mode where it doesn't).
      ORANGE_CM_CLIENT_ID: placeholder
      ORANGE_CM_CLIENT_SECRET: placeholder
      ORANGE_CM_SENDER_NUMBER: '+2370000'
      ORANGE_CM_BASE_URL: http://sms-fake-orange:8090
      # #134: obviously-demo value, 32+ bytes, never reused anywhere real
      # — see `provision-client`'s own environment block above for the
      # identical value and why it must match exactly (a hash computed
      # under one pepper never equals one computed under another, and
      # nothing detects the mismatch).
      SMS_HASH_PEPPER: vsms-demo-hash-pepper-DO-NOT-USE-IN-PRODUCTION-1234567890
      SMS_CONSOLE_OIDC_CLIENT_ID: sms-console
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed-signing-key:
        condition: service_completed_successfully
      seed-dispatch:
        condition: service_completed_successfully
    # Overrides the image's own baked-in liveness-only HEALTHCHECK with a
    # readiness check (`/readyz`, a real `SELECT 1` against the pool) —
    # identical override, identical reasoning, to
    # `deploy/docker-compose.yml`'s own `sms-gateway` service: `admin`
    # should not start routing to a gateway that's up but can't reach its
    # database.
    healthcheck:
      test: ['CMD', '/usr/local/bin/sms-gateway', 'healthcheck', '--path', '/readyz']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    ports:
      # Loopback only. Not required for anything in this file to function
      # (admin reaches sms-gateway over the internal network exclusively —
      # see SMS_OIDC_ISSUER's own comment above) — published purely so an
      # evaluator can `curl http://127.0.0.1:.../healthz` or exercise the
      # REST API directly without a browser.
      - 127.0.0.1:${VSMS_DEMO_GATEWAY_PORT:-8280}:8080

  sms-worker:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-store}/vsms-sms-worker:${VSMS_IMAGE_TAG:-v0.3.0}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://vsms:vsms-demo-only@postgres:5432/vsms
      # dispatch (submits/reroutes), scheduler (due recurring jobs), jobs
      # (expire_stale/reap_outbox/purge_retention/grey_route_watch) — the
      # same three roles `scripts/demo.sh` used to run — plus drain/hooks,
      # unconditionally, regardless of which profiles (if any) are
      # active: both roles just poll `WebhookEndpoint`/`WebhookAttempt`
      # rows that simply don't exist on a backend-only or
      # `--profile console`-only run (only `--profile demo`'s own
      # `seed-demo-webhook` ever creates one, see that service's own
      # comment) — an empty poll loop, not an error loop. That's the
      # R4-correct shape: the *role* is unconditional, like every other
      # role this worker runs, and what it finds to do is a function of
      # what's actually in the database, not of a profile flag threaded
      # into `SMS_WORKER_ROLES` itself.
      SMS_WORKER_ROLES: dispatch,scheduler,jobs,drain,hooks
      ORANGE_CM_CLIENT_ID: placeholder
      ORANGE_CM_CLIENT_SECRET: placeholder
      ORANGE_CM_SENDER_NUMBER: '+2370000'
      ORANGE_CM_BASE_URL: http://sms-fake-orange:8090
      ORANGE_CM_DLR_NOTIFY_URL: http://sms-gateway:8080/dlr/orange_cm
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed-dispatch:
        condition: service_completed_successfully
      seed-demo-app:
        condition: service_completed_successfully
      sms-fake-orange:
        condition: service_started

  # R4: everything above this line is the whole backend, and it is
  # healthy with this service never started at all
  # (`docker compose -f compose.demo.yaml up -d`, no `--profile console`).
  admin:
    image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-store}/vsms-admin:${VSMS_IMAGE_TAG:-v0.3.0}
    platform: linux/amd64
    restart: unless-stopped
    profiles: [console]
    # This image's own `output: "standalone"` server.js hardcodes
    # `process.env.NODE_ENV = 'production'` as its second line — verified
    # directly (`docker run --entrypoint sh ... server.js`), not assumed —
    # so there is no environment variable this file can set that makes the
    # packaged image believe it is running in development. That, in turn,
    # unconditionally trips two of @vsms/env's own deploy-time rules
    # (frontends/packages/env/src/index.ts's `enforceDeploymentRules` block):
    # `ADMIN_BASE_URL` and `SMS_API_URL` must both be `https://` whenever
    # `NODE_ENV === "production"`. A showcase reachable at `http://
    # localhost:...` with no TLS anywhere in this file is exactly the case
    # that rule exists to refuse — by design, for a real deployment.
    # `SKIP_ENV_VALIDATION=1` is the same escape hatch
    # `frontends/apps/admin/Dockerfile`'s own build stage already uses for the identical
    # reason at build time (its own comment: "next build sets
    # NODE_ENV=production, which would otherwise trip @vsms/env's deploy-
    # time rules... that only make sense at runtime, not compile time") —
    # here it's the runtime instance of the same problem. This is a real,
    # load-bearing trade this showcase makes, not a convenience default:
    # it disables *all* of @vsms/env's zod validation, not just the two
    # https checks, so a genuine misconfiguration here fails as a confusing
    # runtime error deep in the app rather than a clear startup message.
    # Fronting this with a real (even self-signed) TLS edge would let this
    # image run in its own intended mode instead — out of scope for a
    # one-command, clone-and-run showcase; tracked as follow-up work, not
    # silently worked around.
    #
    # **A second finding, found live while this file was first written —
    # fixed since, in #243/#244, not by this file.** At the time, every
    # mutating (POST) tRPC call through this console — the Composer's own
    # "Send message" included — was rejected with `cross-origin request
    # rejected: Origin "http://localhost:<port>" does not match
    # "http://0.0.0.0:8080"` by `frontends/packages/api/src/context.ts`'s
    # `assertSameOriginForMutations`. Root cause: the "expected" side of
    # that check was `new URL(req.url).origin`, which under this image's
    # `output: "standalone"` runtime resolves from the server's own
    # `HOSTNAME`/`PORT` bind (`0.0.0.0:8080`, required for Docker's own
    # port-publishing to reach it) rather than from anything a browser's
    # `Origin` could ever equal — and, since `next.config.ts`'s
    # `experimental.trustHostHeader` is `false`, no incoming `Host`/
    # `X-Forwarded-Host` header changed that either, so no reverse proxy in
    # front could have masked or fixed it. `#244` re-pinned the check to
    # `ADMIN_BASE_URL` instead — already the validated, documented "origin a
    # browser actually reaches" value below, needing no new trust — and
    # deliberately did *not* switch to trusting `X-Forwarded-Host` (see that
    # commit's own reasoning, echoing #163: this deployment has more than
    # one internal caller of the gateway, so there is no single trusted hop
    # to pin a header-based check to). A pulled `VSMS_IMAGE_TAG` built from
    # a commit before #244 (2026-08-14) still has the bug; one built after
    # does not — verified live against a source build of the same image in
    # this PR.
    environment:
      SMS_API_URL: http://sms-gateway:8080
      SMS_AUTH_ISSUER: http://sms-gateway:8080
      SMS_CONSOLE_PRIVATE_KEY_PATH: /secrets/console-client-key.pem
      SMS_CONSOLE_SCOPE: sms:send sms:read job:read job:enqueue worker:read provider:read route:read dashboard:read
      ADMIN_BASE_URL: http://localhost:${VSMS_DEMO_CONSOLE_PORT:-3200}
      SMS_CONSOLE_OIDC_CLIENT_ID: sms-console
      # 32+ chars, obviously a demo value — see @t3-oss/env-nextjs's own
      # `.min(32)` check on this field (real entropy in production; this
      # showcase has no real session to protect).
      SMS_CONSOLE_SESSION_SECRET: vsms-demo-session-secret-DO-NOT-USE-IN-PRODUCTION-abcdefgh
      MESSAGE_STREAM_POLL_MS: '2000'
      # Every entry below has a zod `.default()` in `@vsms/env`, and every
      # one must still be set explicitly HERE, because `SKIP_ENV_VALIDATION=1`
      # (below) does not merely skip validation — it skips zod entirely, so
      # **its defaults are never applied either**. `MESSAGE_STREAM_POLL_MS`
      # above was already set explicitly and so always worked; these three
      # were not, and the Jobs screen rendered a literal "Refreshes every
      # NaNs" until someone opened it. That is the real cost of the escape
      # hatch, and it is quieter than this file elsewhere claims: not "a
      # confusing runtime error" on a misconfiguration, but silent
      # `undefined` on a correct one.
      DIAGNOSTICS_POLL_MS: '5000'
      DASHBOARD_REFETCH_INTERVAL_MS: '15000'
      AUDIT_LOG_PAGE_SIZE: '50'
      NEXT_PUBLIC_APP_NAME: vsms Admin Console (showcase)
      SKIP_ENV_VALIDATION: '1'
    volumes:
      - vsms_demo_secrets:/secrets:ro
    # SMS_CONSOLE_CLIENT_ID is deliberately absent from `environment:`
    # above — `provision-client` generates it server-side and this file
    # cannot know it in advance (see that service's own comment). This
    # entrypoint override reads the value `--client-id-out` wrote to the
    # shared volume and exports it into the *same* shell that then execs
    # the image's own real entrypoint (`node frontends/apps/admin/server.js`, per
    # `frontends/apps/admin/Dockerfile`) — the only place in this file that overrides an
    # image's entrypoint, and only because Compose has no declarative way
    # to feed one container's computed output into a sibling container's
    # environment. `node:26-bookworm-slim` (this image's runtime base,
    # unlike the distroless gateway/worker/fake-orange images) has a real
    # `/bin/sh` to run this with — confirmed directly, not assumed.
    entrypoint: ['/bin/sh', '-c']
    command:
      - export SMS_CONSOLE_CLIENT_ID="$(cat /secrets/console-client-id)" && exec node frontends/apps/admin/server.js
    depends_on:
      sms-gateway:
        condition: service_healthy
      provision-client:
        condition: service_completed_successfully
      secrets-fix-perms:
        condition: service_completed_successfully
      seed-console-client:
        condition: service_completed_successfully
      provision-user:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:${VSMS_DEMO_CONSOLE_PORT:-3200}:8080

  # The demo showcase's own evaluator — `examples/node/demo-app`'s own
  # module doc has the full reasoning. Sends one OTP through
  # `@vymalo/vsms-node`, watches it reach a terminal state, and verifies
  # the `hooks` role's own signed webhook for it — the one piece of this
  # showcase nothing else exercises end to end.
  #
  # **`build:`, this file's ONE deliberate exception to its own "every
  # image pulled from GHCR, no `build:` stanza anywhere" header claim.**
  # No `ghcr.io/${VSMS_IMAGE_OWNER:-vaam-store}/vsms/demo-app` image
  # exists yet — `.github/workflows/release.yml`'s matrix entry for it
  # publishes on the `v0.3.0` tag, cut immediately after this PR merges
  # (see AGENTS.md's own "Release v0.3.0" section), at which point this
  # should switch to
  # `image: ghcr.io/${VSMS_IMAGE_OWNER:-vaam-store}/vsms/demo-app:${VSMS_DEMO_APP_IMAGE_TAG:?...}`
  # the same shape `sms-fake-orange`/`seed-demo-app` already use — a
  # post-`v0.3.0` follow-up, not attempted in this change. Until then,
  # building it is the only way this showcase can include it at all, and
  # the source it
  # builds from (`examples/node/demo-app`, a fully standalone package
  # with no path dependency into this checkout) is exactly what an
  # evaluator running `docker build` here would get regardless. Requires
  # `docker compose ... build demo-app` (or plain `up`, which builds
  # missing images automatically) before `up`, unlike every other
  # service in this file.
  #
  # `profiles: [demo]` — its OWN profile, deliberately never `console`:
  # this is a backend proof (it talks to `sms-gateway` directly, the
  # same way `admin` itself does, never through the console), not a
  # console-only extra, so it must be reachable without ever starting
  # `admin`. `docker compose ... up -d --profile demo` (no `console`) is
  # itself a legitimate, documented way to run this proof — see
  # `docs/runbooks/showcase.adoc`'s own "The demo app" section. It still
  # needs `secrets-fix-perms`'s output (the console-client PEM,
  # `0600`/root-owned until that step loosens it) to read the credential
  # it reuses from `provision-client` — that service is `profiles:
  # [console, demo]` for exactly this reason, so it runs for either
  # profile alone.
  #
  # `restart: 'no'` — explicit, matching this file's own convention for
  # every other one-shot step, even though it's also Compose's default
  # when unspecified: this container is meant to run once and exit,
  # never be restarted by Compose itself. It DOES define a real
  # `HEALTHCHECK` in its own Dockerfile (`node -e ...:9000/healthz`,
  # used while the process is up so `docker compose ps` can show
  # `healthy` mid-run) — that's a liveness signal, not a restart policy.
  demo-app:
    build:
      context: .
      dockerfile: examples/node/demo-app/Dockerfile
    profiles: [demo]
    restart: 'no'
    environment:
      VSMS_ISSUER: http://sms-gateway:8080
      VSMS_CLIENT_ID_PATH: /secrets/console-client-id
      VSMS_PRIVATE_KEY_PATH: /secrets/console-client-key.pem
      VSMS_SCOPE: sms:send sms:read
      DEMO_WEBHOOK_SECRET_PATH: /secrets/webhook-secret
      DEMO_WEBHOOK_PORT: '9000'
    volumes:
      - vsms_demo_secrets:/secrets:ro
    depends_on:
      sms-gateway:
        condition: service_healthy
      sms-worker:
        condition: service_started
      seed-demo-webhook:
        condition: service_completed_successfully
      secrets-fix-perms:
        condition: service_completed_successfully

volumes:
  vsms_demo_pgdata:
  vsms_demo_secrets:
