[package]
name = "sms-gateway"
description = "SMS gateway API server binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
sms-api.workspace = true
sms-auth.workspace = true
cratestack.workspace = true
# op.rs mounts the OP's routes directly against authkestra-axum's handler
# functions (#20) — see that module's own doc for why not the crate's
# all-in-one op_axum_router().
authkestra-axum = { workspace = true, features = ["op"] }
authkestra-engine.workspace = true
authkestra-op.workspace = true
axum.workspace = true
# token_rate_limit.rs's client_id extraction (#168) — see that module's
# own doc.
form_urlencoded.workspace = true
# dlr.rs's real dependency: the SmsProvider trait (#34), and the one
# concrete adapter that exists to construct it from.
sms-provider.workspace = true
sms-provider-orange-cm.workspace = true

# Command::ProvisionUser (#194)'s one-time password generation and hashing —
# #52/#58 moved `sms_core::password::{generate_password, hash_password}`
# below both `sms-api` and `sms-auth` so the console's own `provisionUser`
# procedure can call the identical logic; this binary now reaches it
# directly rather than through `sms-auth::login`, which no longer re-exports
# either function. See that module's own doc.
sms-core.workspace = true

anyhow.workspace = true
clap.workspace = true
dotenvy.workspace = true
# main.rs installs the process-wide default `CryptoProvider` before
# constructing any HTTP client — see that call site's own comment.
rustls.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# login.rs's LoginRequest/LoginResponse/LoginError (#194) — real
# dependencies now, not just the dev-only test-fixture use they had
# before this route existed.
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# #25's acceptance gate spawns the real `sms-gateway` binary as two
# separate OS processes (`CARGO_BIN_EXE_sms-gateway`, only available to an
# integration test inside this same package) and drives them over real
# HTTP — a real `private_key_jwt` client assertion, a real `/token`
# exchange, and one hand-signed test-only token standing in for a
# human-login path that doesn't exist yet (see
# `tests/m1_acceptance_gate_live_postgres.rs`'s own module doc).
base64.workspace = true
chrono.workspace = true
jsonwebtoken.workspace = true
rand.workspace = true
reqwest.workspace = true
# tests/tls_no_provider_live.rs's own reqwest client, deliberately a
# *second*, differently-configured instance of the same 0.13.4 already in
# this workspace's dependency graph (via authkestra's own pin) rather than
# the `reqwest.workspace` entry above — that one resolves 0.12 with
# `rustls-tls` (auto-installs `ring`), which can't exercise the
# `rustls-no-provider` code path this test exists to prove. `package =
# "reqwest"` under an alias is how two differently-featured resolutions of
# the same crate name coexist in one Cargo.toml.
reqwest-no-provider = { package = "reqwest", version = "0.13.4", default-features = false, features = [
  "rustls-no-provider",
] }
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
# login_flow_live_postgres.rs's own PKCE S256 challenge computation (#194) —
# the identical hash this suite's own /token exchange must match against,
# computed independently rather than imported from anywhere production
# code builds it (there is no such helper — authkestra-op computes it
# internally, unexported).
sha2.workspace = true
# tests/m1_acceptance_gate_live_postgres.rs gets its DATABASE_URL from this
# instead of the environment.
sms-test-support.workspace = true
# token_rate_limit.rs's own unit tests (#168) — tower::ServiceExt::oneshot
# against an in-process router.
tower.workspace = true

[lints]
workspace = true
