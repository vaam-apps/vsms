[package]
name = "sms-worker-bin"
description = "The role-selectable worker binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "sms-worker"
path = "src/main.rs"

[dependencies]
sms-worker.workspace = true
# Constructs the one Orange provider WorkerContext carries — #33's dispatch
# needs a real SmsProvider at startup, not just the trait sms-worker holds.
sms-provider.workspace = true
sms-provider-orange-cm.workspace = true
sms-api.workspace = true

anyhow.workspace = true
async-trait.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
cratestack.workspace = true
dotenvy.workspace = true
# main.rs installs the process-wide default `CryptoProvider` before
# constructing any HTTP client — see that call site's own comment.
rustls.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# kill9_reclaim_live.rs's own real Postgres timestamps and a delayed
# wiremock-backed Orange stand-in for the process it spawns and kills.
chrono.workspace = true
serde_json.workspace = true
wiremock.workspace = true
# hooks_node_receiver_live.rs (#44) polls a real, spawned Node receiver
# process's own diagnostic HTTP endpoint, and hooks_two_workers_live.rs
# (#44) polls a wiremock-backed mock customer endpoint's own request log —
# same real-HTTP-client need every other live suite here already has.
reqwest.workspace = true
# hooks_two_workers_live.rs (#44) reads the real X-Sms-Event-Id header
# name constant off the same crate `hooks.rs` itself signs with, rather
# than retyping the literal a second time — `crates/sms-worker`'s own
# `hooks_live_postgres.rs` does the identical thing (that crate already
# depends on sms-webhook directly; this binary crate does not, so it's
# named here as a dev-only dependency).
sms-webhook.workspace = true
# Gets DATABASE_URL from this instead of the environment.
sms-test-support.workspace = true

[lints]
workspace = true
