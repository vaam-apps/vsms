# Path-scoped Trivy suppressions. Each entry names a file and a reason; a bare
# global ignore of DS-0002 would also mute the six distroless images, where the
# rule is satisfied for real rather than excused.
misconfigurations:
  - id: AVD-DS-0002
    paths:
      - "deploy/caddy.Dockerfile"
    statement: >-
      Caddy binds :80 and :443 INSIDE the container (deploy/docker-compose.yml
      maps them to 8080/8443 on the host). Those are privileged ports, so the
      process needs root or CAP_NET_BIND_SERVICE. Adding a USER line without
      also granting that capability would break TLS termination for the whole
      deployment, and the ACME path here has never been exercised against a
      real certificate authority — so this is not a change to make blind.
  - id: AVD-DS-0002
    paths:
      - "deploy/backup.Dockerfile"
    statement: >-
      The backup container's uid is entangled with volume and mounted-secret
      permissions that were established by testing against real containers: a
      host-owned secrets dir is unreadable to a non-root container uid, and the
      rclone config is mounted in. Changing the runtime user risks breaking
      backups in a way only a real restore drill would surface. Revisit
      together with docs/runbooks/backup-restore.adoc, not on its own.

# The secret scanner's finding is real text but not a real secret.
secrets:
  - id: private-key
    paths:
      - "sdks/rust/vsms-sdk-rust/src/token.rs"
    statement: >-
      TEST_PRIVATE_KEY_PEM is a throwaway 2048-bit RSA keypair generated
      locally with `openssl genrsa` for this module's own `#[cfg(test)]`
      block, and its own comment says so. It is never registered against any
      real AppClient and never presented to any real server; the only
      load-bearing property is that the matching public key lets a test verify
      a signed assertion's claims without hand-decoding a JWT. Scoped to this
      one path rather than muting `private-key` repo-wide, because a real
      committed key anywhere else must still fail this gate.
