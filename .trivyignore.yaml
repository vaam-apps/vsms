# Path-scoped Trivy suppressions. Each entry names a file and a reason; a bare
# global ignore of DS-0002 would also mute the six distroless images, where the
# rule is satisfied for real rather than excused.
misconfigurations:
  - id: AVD-DS-0002
    paths:
      - "deploy/caddy.Dockerfile"
    statement: >-
      Caddy binds :80 and :443 INSIDE the container (deploy/docker-compose.yml
      maps them to 8080/8443 on the host). Those are privileged ports, so the
      process needs root or CAP_NET_BIND_SERVICE. Adding a USER line without
      also granting that capability would break TLS termination for the whole
      deployment, and the ACME path here has never been exercised against a
      real certificate authority — so this is not a change to make blind.
  - id: AVD-DS-0002
    paths:
      - "deploy/backup.Dockerfile"
    statement: >-
      The backup container's uid is entangled with volume and mounted-secret
      permissions that were established by testing against real containers: a
      host-owned secrets dir is unreadable to a non-root container uid, and the
      rclone config is mounted in. Changing the runtime user risks breaking
      backups in a way only a real restore drill would surface. Revisit
      together with docs/runbooks/backup-restore.adoc, not on its own.

# The secret scanner's finding is real text but not a real secret.
secrets:
  - id: private-key
    paths:
      - "backends/crates/sms-api/src/envelope.rs"
    statement: >-
      Two throwaway Ed25519 PKCS#8 keys generated locally for this module's
      own doctest and `#[cfg(test)]` block, which prove `ServerKeys` parses a
      current/next pair and refuses the same key twice, plus two deliberately
      malformed PEMs (an RSA header, a truncated body) that prove a wrong key
      type is refused. None is ever a gateway's envelope key: `serve` reads
      its keys from `--envelope-signing-key-file` and
      `--envelope-next-signing-key-file` only. Scoped to this one path rather
      than muting `private-key` repo-wide, because a real committed key
      anywhere else must still fail this gate.
  - id: private-key
    paths:
      - "sdks/rust/vsms-sdk-rust/src/signer.rs"
    statement: >-
      One throwaway Ed25519 PKCS#8 key generated locally for this module's
      `#[cfg(test)]` block, which proves the SDK's PEM signer loads a seed
      and derives its kid, plus one deliberately malformed RSA-headed PEM that
      proves a wrong key type is refused. Neither is registered against any
      real AppClient. Scoped to this one path rather than muting
      `private-key` repo-wide, because a real committed key anywhere else
      must still fail this gate.
  - id: private-key
    paths:
      - "backends/crates/sms-fake-oidc/src/keys.rs"
    statement: >-
      Four throwaway signing keys (three 2048-bit RSA, one P-256) generated
      locally with `openssl` for `sms-fake-oidc`, a dev/test-only fake
      upstream identity provider (`publish = false`; no production binary
      depends on it, and `sms-gateway` never loads it). They sign the
      deliberately malformed id_tokens the SSO broker's tests feed it; the
      fake publishes the matching public halves itself, and the "signed by a
      key the relying party has never seen" tests only work because these keys
      protect nothing. Committed as literals so a test run does not pay for RSA
      generation in a debug build. Scoped to this one path rather than muting
      `private-key` repo-wide, because a real committed key anywhere else must
      still fail this gate.
