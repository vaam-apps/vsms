# The from-source developer stack — everything `scripts/demo.sh` used to
# assemble by hand (a scratch Postgres, the migrations,
# an `App` + `Provider` + `Route` + `SenderId`, the demo app's service key, the
# console composer's service key, an operator's user row, `sms-fake-orange`,
# `sms-gateway`, `sms-worker`, and the admin console), now as one
# declarative compose file instead of a 300-line bash script driving
# `docker run`/backgrounded host processes/`pnpm exec next dev` by hand.
#
# This is the **third** distinct full-stack compose file in this repo, and
# deliberately not a merge of any of the other two — `compose.demo.yaml`'s
# own header comment already draws this exact three-way line, restated
# here from this file's own side of it:
#
#   - `compose.yml` (repo root) — Postgres alone, for `cargo run`/a live
#     test suite/`psql` on a developer's own machine. No application
#     binaries. This file does NOT reuse it (see "Why not include
#     compose.yml" below) even though the `postgres` service below is
#     nearly identical.
#   - `compose.demo.yaml` — a *showcase*: every vsms image pulled from
#     GHCR, pinned to a release tag, no source build. The right tool for
#     "let me see this work" with no Rust/Node toolchain at all.
#   - `compose.dev.yaml` (this file) — every vsms image **built from this
#     checkout's own source** (`build:` stanzas, `backends/apps/*/Dockerfile`
#     and `frontends/apps/admin/Dockerfile`, all pre-existing and untouched
#     by this file).
#     The right tool for "I'm changing this codebase and want to see the
#     change end to end." `just demo` is this file's own front door — see
#     the justfile.
#
# Usage — see docs/runbooks/local-development.adoc for the full walkthrough:
#
#   docker compose -f compose.dev.yaml --profile console up -d --build
#   docker compose -f compose.dev.yaml --profile console down -v   # reset
#
# Backend-only (R4 — CONTRIBUTING.md: "the admin console is optional, the
# backend must run without it"): omit `--profile console`. Every service
# the console needs (`admin`, `register-composer` and `provision-user`)
# carries `profiles: [console]` and is skipped outright. `sms-gateway` and
# `sms-worker` come up healthy either way. A backend-only stack holds no
# client key: register your own with `sms-gateway register-client`, as an
# integrator would (docs/runbooks/local-development.adoc).
#
# `down -v` (not a bare `down`) is the documented reset: it drops the named
# volumes, so every `up` after it starts from an empty database.
#
# Why not include `compose.yml` (`docker compose -f compose.yml -f
# compose.dev.yaml`) rather than duplicating its `postgres` service:
# considered first, since `compose.yml`'s own header comment predicted
# exactly this ("a later phase points scripts/demo.sh at this same file").
# Rejected once actually built: Compose's multi-file merge rules for
# list-typed keys (`ports`, in particular) are not simple concatenation in
# every Compose version, and this file wants to publish a *different* host
# port (`VSMS_DEMO_PG_PORT`, matching this file's own pre-existing
# convention and `docs/runbooks/local-development.adoc`'s documented output)
# than `compose.yml`'s own `VSMS_POSTGRES_PORT` default — verifying that
# merge behaves correctly across Compose versions was more fragile than
# the six-line duplication below, and `compose.demo.yaml` had already
# independently made the same call (it defines its own `postgres` service
# rather than referencing `compose.yml` too) for what is presumably the
# same reason. `compose.yml`'s own header comment is updated in this PR to
# stop asserting a plan this file didn't take.
#
# Where this file draws "nothing on the host": every *application*
# process (postgres, migrate, sms-gateway, sms-worker, sms-fake-orange,
# admin, and every one-shot seed/provision step) runs in a container built
# from a pinned base image, via the pre-existing `backends/apps/*/Dockerfile`/
# `frontends/apps/admin/Dockerfile` this repo already ships. `docker compose`
# itself, and
# the `just demo`/`just demo-down`/`just demo-status` recipes that
# shell out to it, run on the host — the same accepted exception `cargo
# xtask` already has (see AGENTS.md's xtask section and this PR's own
# description for the full "where the line is drawn" reasoning). What
# still runs natively on the host, and is called out explicitly rather
# than silently left as-is: `just e2e-integration`'s own verification
# tool (`ci/e2e-integration`) and its `cargo build`, for the same reason
# `examples/rust/sms-send` (an *integrator-facing example*, not vsms's own
# tooling) has always run bare — see that recipe's own comment.

name: vsms-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vsms
      POSTGRES_PASSWORD: vsms-dev-only
      POSTGRES_DB: vsms
    # Published on loopback, unlike `compose.demo.yaml`'s deliberately
    # unpublished Postgres — kept for continuity with this file's own
    # predecessor (`scripts/demo.sh` always published a host port so a
    # developer could `psql` straight in) and with
    # `docs/runbooks/local-development.adoc`'s documented output. Loopback
    # only, never `0.0.0.0` — same reasoning `compose.yml`'s own postgres
    # service already documents.
    ports:
      - '127.0.0.1:${VSMS_DEMO_PG_PORT:-15433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vsms -d vsms']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - vsms_dev_pgdata:/var/lib/postgresql/data

  # One-shot: applies both migrations. Same image `deploy/docker-compose.yml`
  # and `compose.demo.yaml`'s own `migrate` service run — built from source
  # here instead of built-at-release-time or pulled from GHCR. See
  # app/sms-migrate/src/main.rs's own module doc.
  migrate:
    build:
      context: .
      dockerfile: backends/apps/sms-migrate/Dockerfile
    environment:
      DATABASE_URL: postgres://vsms:vsms-dev-only@postgres:5432/vsms
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # A `Provider` + a catch-all `Route` — sms-gateway also refuses to bind
  # without the former, and `sms-worker`'s `dispatch` role routes nothing
  # without the latter (#62). Every seed/register step against this fresh
  # database chains sequentially from `migrate` — `compose.demo.yaml`'s own comment on this exact service has
  # the full mechanism (a genuinely fresh database's first concurrent touch
  # from two separate connections can race Postgres's own `pg_type`
  # catalog), reproduced here rather than re-derived independently.
  seed-dispatch:
    build:
      context: .
      dockerfile: backends/apps/sms-gateway/Dockerfile
      args:
        # See the `sms-gateway` service below: this stack's gateway trusts
        # `sms-fake-aws`'s receipt-signing certificate. Every service that
        # shares the `vsms-dev/sms-gateway:local` tag passes the same value,
        # so whichever one Compose builds, the image is the same.
        CARGO_FEATURES: fake-aws
    image: vsms-dev/sms-gateway:local
    command: ['seed-dispatch']
    environment:
      DATABASE_URL: postgres://vsms:vsms-dev-only@postgres:5432/vsms
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  # A second `Provider` + catch-all `Route`, for AWS End User Messaging
  # SMS (`aws_sms`), at the same priority and weight as Orange's above: the
  # routing engine (#62) draws between the two 50/50, so `just demo` sends
  # through both and each message's detail page names which one it took.
  # That is the go-live arrangement (AWS beside an operator) with the
  # weights left even; change them on the console's Routes screen.
  seed-dispatch-aws:
    build:
      context: .
      dockerfile: backends/apps/sms-gateway/Dockerfile
      args:
        CARGO_FEATURES: fake-aws
    image: vsms-dev/sms-gateway:local
    command:
      - seed-dispatch
      - --key
      - aws_sms
      - --display-name
      - AWS End User Messaging SMS (sms-fake-aws)
      - --kind
      - aggregator_http
      - --credential-ref
      - env:AWS_SMS_SECRET_ACCESS_KEY
      - --cost-per-segment-xaf
      - '30'
    environment:
      DATABASE_URL: postgres://vsms:vsms-dev-only@postgres:5432/vsms
    depends_on:
      seed-dispatch:
        condition: service_completed_successfully
    restart: 'no'

  # The one `App` + approved `SenderId` this file's own demo message needs
  # before `sendMessage` will accept anything. Not an `sms-gateway`
  # subcommand any more — #258 moved this fixture-seeding logic out of the
  # production gateway image into its own crate/image, `vsms-demo-seed`
  # (`backends/apps/vsms-demo-seed/src/main.rs`'s own module doc has the full
  # reasoning), the same binary `compose.demo.yaml`'s own `seed-demo-app`
  # service pulls pre-built from GHCR. This file builds it from source
  # instead, like every other service here. Every flag defaults to what
  # the old `sms-gateway seed-demo-app` command used (`--app-slug
  # vsms-demo` in particular, which `register-client --app` below names), so no `command:` override is needed — only
  # `DATABASE_URL`. Deliberately unconditional (never gated behind a
  # profile, and never passes `--webhook-url`) — R4: a backend-only
  # deployment needs the `App`/`SenderId` `sendMessage` requires, but
  # must NOT get a `WebhookEndpoint` pointed at a `demo-app` container
  # that will never exist. `seed-demo-webhook`, below, is the
  # `--profile demo`-gated sibling that seeds the endpoint, only when
  # `demo-app` is actually part of the stack.
  seed-demo-app:
    build:
      context: .
      dockerfile: backends/apps/vsms-demo-seed/Dockerfile
    environment:
      DATABASE_URL: postgres://vsms:vsms-dev-only@postgres:5432/vsms
    depends_on:
      seed-dispatch:
        condition: service_completed_successfully
    restart: 'no'

  # The `WebhookEndpoint` `demo-app` (below) needs — split out of
  # `seed-demo-app` into its own, separate, `--profile demo`-gated
  # service rather than a flag `seed-demo-app` always passes. Found
  # live, not assumed: an unconditional `WebhookEndpoint` pointed at
  # `http://demo-app:9000/webhooks` breaks R4 the moment a backend-only
  # `up -d` (no profiles at all) runs — `demo-app` never starts, that
  # hostname never resolves, and `hooks` marks every attempt `dead`,
  # opens the circuit, and logs an error every tick, forever, contrary
  # to `docs/runbooks/showcase.adoc`'s own documented "not
  # present-but-misconfigured" claim about a profile-skipped service.
  # Same binary as `seed-demo-app` (idempotent — this run's own
  # App/SenderId lookups just find what that service already created),
  # invoked a second time with `--webhook-url`/`--webhook-audience`
  # instead. VS-8: a delivery is sealed with the gateway's own key, so there is
  # no secret to hand `demo-app` any more (the old shared `vsms_dev_secrets`
  # volume and its `secrets-init` fixup are gone); `demo-app` pins the
  # gateway's public keys (`dev-keys/server-keys.txt`) and the audience this
  # endpoint is created with, `demo-app`.
  seed-demo-webhook:
    build:
      context: .
      dockerfile: backends/apps/vsms-demo-seed/Dockerfile
    profiles: [demo]
    command:
      - --webhook-url
      - http://demo-app:9000/webhooks
      - --webhook-audience
      - demo-app
      - --webhook-endpoint-id-out
      - /run/demo-endpoint/webhook-endpoint-id
    volumes:
      # The endpoint's id, which the gateway mints at creation and `demo-app`'s
      # opener is built with (the binding between a delivery and its receiver).
      - vsms_dev_endpoint:/run/demo-endpoint
    environment:
      DATABASE_URL: postgres://vsms:vsms-dev-only@postgres:5432/vsms
    depends_on:
      seed-demo-app:
        condition: service_completed_successfully
    restart: 'no'

  # The composer's own service key (VS-5b): the console sends through an
  # Ed25519 `AppClient` key of its own, registered with `register-client` (the
  # private half is `dev-keys/console-composer.pem`, mounted into `admin`; only
  # the public half is an argument here, from `VSMS_COMPOSER_PUBLIC_KEY`, which
  # `just demo-up` sets). Console-only: a backend-only `up -d` never runs it.
  register-composer:
    build:
      context: .
      dockerfile: backends/apps/sms-gateway/Dockerfile
      args:
        # See the `sms-gateway` service below: this stack's gateway trusts
        # `sms-fake-aws`'s receipt-signing certificate. Every service that
        # shares the `vsms-dev/sms-gateway:local` tag passes the same value,
        # so whichever one Compose builds, the image is the same.
        CARGO_FEATURES: fake-aws
    image: vsms-dev/sms-gateway:local
    command:
      - register-client
      - --app
      - vsms-demo
      - --client-name
      - console-composer
      - --label
      - console composer (compose.dev.yaml)
      - --scope
      - sms:send
      - --scope
      - sms:read
      - --public-key
      - ${VSMS_COMPOSER_PUBLIC_KEY:-}
    environment:
      DATABASE_URL: postgres://vsms:vsms-dev-only@postgres:5432/vsms
    depends_on:
      seed-demo-app:
        condition: service_completed_successfully
    restart: 'no'
    profiles: [console]

  # The demo app's own service key, registered the way an integrator's is: the
  # private half is `dev-keys/demo-app.pem` (mounted into `demo-app`), only the
  # public half is an argument here, from `VSMS_DEMO_APP_PUBLIC_KEY`, which
  # `just demo-up` sets. `demo-app` signs as its own `AppClient` with the two
  # scopes it uses. `profiles: [demo]`: a stack without `demo-app` registers no
  # key for it.
  register-demo-app:
    build:
      context: .
      dockerfile: backends/apps/sms-gateway/Dockerfile
      args:
        # See the `sms-gateway` service below: this stack's gateway trusts
        # `sms-fake-aws`'s receipt-signing certificate. Every service that
        # shares the `vsms-dev/sms-gateway:local` tag passes the same value,
        # so whichever one Compose builds, the image is the same.
        CARGO_FEATURES: fake-aws
    image: vsms-dev/sms-gateway:local
    command:
      - register-client
      - --app
      - vsms-demo
      - --client-name
      - demo-app
      - --label
      - demo app (compose.dev.yaml)
      - --scope
      - sms:send
      - --scope
      - sms:read
      - --public-key
      - ${VSMS_DEMO_APP_PUBLIC_KEY:-}
    environment:
      DATABASE_URL: postgres://vsms:vsms-dev-only@postgres:5432/vsms
    depends_on:
      seed-demo-app:
        condition: service_completed_successfully
    restart: 'no'
    profiles: [demo]

  # The operator's `User` row. It holds no credential and prints none: the
  # console has no login, so a browser's key is paired to this account with
  # `pair-console-key` (docs/runbooks/local-development.adoc).
  provision-user:
    build:
      context: .
      dockerfile: backends/apps/sms-gateway/Dockerfile
      args:
        # See the `sms-gateway` service below: this stack's gateway trusts
        # `sms-fake-aws`'s receipt-signing certificate. Every service that
        # shares the `vsms-dev/sms-gateway:local` tag passes the same value,
        # so whichever one Compose builds, the image is the same.
        CARGO_FEATURES: fake-aws
    image: vsms-dev/sms-gateway:local
    command:
      - provision-user
      - --email
      - demo@vsms.local
      - --display-name
      - Demo Operator
      - --role-key
      - owner
    environment:
      DATABASE_URL: postgres://vsms:vsms-dev-only@postgres:5432/vsms
    depends_on:
      register-composer:
        condition: service_completed_successfully
    restart: 'no'
    profiles: [console]

  # A development/demo impersonation of Orange Cameroon's SMS API — see
  # app/sms-fake-orange/src/main.rs's own module doc. **Never point a
  # real deployment at this.**
  sms-fake-orange:
    build:
      context: .
      dockerfile: backends/apps/sms-fake-orange/Dockerfile
    restart: unless-stopped
    command:
      - --bind-addr
      - 0.0.0.0:8090
      - --dlr-endpoint
      - http://sms-gateway:8080/dlr/orange_cm
      - --sender-number
      - '+2370000'
    # Loopback-published, unlike `compose.demo.yaml` (which never publishes
    # it — nothing external needs it there). Kept here for continuity with
    # `scripts/demo.sh`'s own documented behaviour (its summary printed
    # this as a directly-reachable URL) and because a developer debugging
    # the fake's own fault-injection modes benefits from being able to
    # `curl` it directly.
    ports:
      - '127.0.0.1:${VSMS_DEMO_ORANGE_PORT:-8090}:8090'

  # A development/demo impersonation of AWS End User Messaging SMS and of
  # the SNS topic its receipts arrive through — see
  # backends/apps/sms-fake-aws/src/main.md. It checks the worker's
  # Signature Version 4 signing and posts receipts it signs itself to the
  # gateway, which accepts them only because this stack builds it with the
  # `fake-aws` feature. **Never point a real deployment at this.**
  sms-fake-aws:
    build:
      context: .
      dockerfile: backends/apps/sms-fake-aws/Dockerfile
    restart: unless-stopped
    command:
      - --bind-addr
      - 0.0.0.0:8095
      - --dlr-endpoint
      - http://sms-gateway:8080/dlr/aws_sms
    ports:
      - '127.0.0.1:${VSMS_DEMO_AWS_PORT:-8095}:8095'

  sms-gateway:
    build:
      context: .
      dockerfile: backends/apps/sms-gateway/Dockerfile
      args:
        # See the `sms-gateway` service below: this stack's gateway trusts
        # `sms-fake-aws`'s receipt-signing certificate. Every service that
        # shares the `vsms-dev/sms-gateway:local` tag passes the same value,
        # so whichever one Compose builds, the image is the same.
        CARGO_FEATURES: fake-aws
    image: vsms-dev/sms-gateway:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://vsms:vsms-dev-only@postgres:5432/vsms
      # VSC-1: the providers are the `dev` profile of the YAML configuration
      # (`config/application-dev.yml`, baked into the image): the fake Orange,
      # which every submit goes to because no real account exists for this
      # stack, and the fake AWS - the topic the fake publishes to, and the
      # `fake_sns_cert_base` that fetches its receipt-signing certificate from
      # the fake instead of from AWS (a `fake-aws`-build-only key; every other
      # check on a receipt still applies).
      SMS_PROFILE: dev
      # Read by the base file as `${SMS_HASH_PEPPER}` (`security.hash_pepper`).
      SMS_HASH_PEPPER: vsms-dev-hash-pepper-DO-NOT-USE-IN-PRODUCTION-1234567890
      # VS-3: every request is a COSE_Sign1 envelope and every response is
      # signed back, so the gateway will not boot without its two Ed25519
      # signing keys. They are DEV keys, minted by `just dev-keys` (which
      # `just demo-up` runs first) into the git-ignored `dev-keys/`; never
      # reuse them anywhere real.
      SMS_ENVELOPE_SIGNING_KEY_FILE: /run/envelope/current.pem
      SMS_ENVELOPE_NEXT_SIGNING_KEY_FILE: /run/envelope/next.pem
    volumes:
      - ./dev-keys/envelope-current.pem:/run/envelope/current.pem:ro
      - ./dev-keys/envelope-next.pem:/run/envelope/next.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed-dispatch:
        condition: service_completed_successfully
      # The DLR route refuses to start without a Provider row per adapter.
      seed-dispatch-aws:
        condition: service_completed_successfully
    # Readiness, not the image's own baked-in liveness-only HEALTHCHECK —
    # same override, same reasoning as `deploy/docker-compose.yml`'s own
    # `sms-gateway` service and `compose.demo.yaml`'s identical override.
    healthcheck:
      test: ['CMD', '/usr/local/bin/sms-gateway', 'healthcheck', '--path', '/readyz']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    ports:
      # Host access for `curl` (`GET /healthz`), `examples/rust/sms-send` and
      # this file's own `ci/e2e-integration` tool.
      - '127.0.0.1:${VSMS_DEMO_GATEWAY_PORT:-8080}:8080'

  sms-worker:
    build:
      context: .
      dockerfile: backends/apps/sms-worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://vsms:vsms-dev-only@postgres:5432/vsms
      # dispatch/scheduler/jobs — the same three roles `scripts/demo.sh`
      # used to run — plus drain/hooks, unconditionally, regardless of
      # which profiles (if any) are active: `drain`/`hooks` both poll
      # `WebhookEndpoint`/`WebhookAttempt` rows that simply don't exist
      # on a backend-only or `--profile console`-only run (only
      # `--profile demo`'s own `seed-demo-webhook` ever creates one, see
      # that service's own comment) — an empty poll loop, not an error
      # loop. That's the R4-correct shape: the *role* is unconditional,
      # like every other role this worker runs, and what it finds to do
      # is a function of what's actually in the database, not of a
      # profile flag threaded into `SMS_WORKER_ROLES` itself.
      SMS_WORKER_ROLES: dispatch,scheduler,jobs,drain,hooks
      # The same `dev` profile as the gateway's: the fake Orange, and the fake
      # AWS's public demo account (`sms_fake_aws::DEFAULT_*`, accepted by
      # nothing but the fake).
      SMS_PROFILE: dev
      # No SMS_HASH_PEPPER: the worker does not load `security.*` and is not
      # given the secret.
      # VS-8: a sealed webhook delivery is a request signed with the gateway's
      # own envelope signing key, so `hooks` needs the CURRENT key file (never
      # the `next` one, which signs nothing) to deliver a `sealed` endpoint (an
      # `hmac` endpoint needs none, VS-8R; the demo seeds a sealed one).
      # The very file the gateway signs its answers with, so a receiver pins
      # one pair of public keys (`dev-keys/server-keys.txt`) for both.
      SMS_ENVELOPE_SIGNING_KEY_FILE: /run/envelope/current.pem
    volumes:
      - ./dev-keys/envelope-current.pem:/run/envelope/current.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed-dispatch:
        condition: service_completed_successfully
      seed-dispatch-aws:
        condition: service_completed_successfully
      seed-demo-app:
        condition: service_completed_successfully
      sms-fake-orange:
        condition: service_started
      sms-fake-aws:
        condition: service_started

  # R4: everything above this line is the whole backend, and it is healthy
  # with this service never started at all (`up -d`, no `--profile
  # console`).
  admin:
    build:
      context: .
      dockerfile: frontends/apps/admin/Dockerfile
    restart: unless-stopped
    profiles: [console]
    environment:
      SMS_API_URL: http://sms-gateway:8080
      # The composer's service key (registered by `register-composer`). The
      # gateway's two public sealing keys are derived from the dev envelope keys
      # in the entrypoint below; a browser pins them.
      SMS_COMPOSER_KEY_FILE: /run/envelope/console-composer.pem
      MESSAGE_STREAM_POLL_MS: '2000'
      # Every entry below has a zod `.default()` in `@vsms/env`, and every
      # one must still be set explicitly HERE, because `SKIP_ENV_VALIDATION=1`
      # (below) does not merely skip validation — it skips zod entirely, so
      # **its defaults are never applied either**. `MESSAGE_STREAM_POLL_MS`
      # above was already set explicitly and so always worked; these three
      # were not, and the Jobs screen rendered a literal "Refreshes every
      # NaNs" until someone opened it. That is the real cost of the escape
      # hatch, and it is quieter than this file elsewhere claims: not "a
      # confusing runtime error" on a misconfiguration, but silent
      # `undefined` on a correct one.
      DIAGNOSTICS_POLL_MS: '5000'
      DASHBOARD_REFETCH_INTERVAL_MS: '15000'
      AUDIT_LOG_PAGE_SIZE: '50'
      NEXT_PUBLIC_APP_NAME: vsms Admin Console (dev)
      # Same trade `compose.demo.yaml`'s own `admin` service documents at
      # length: the packaged image's own `next.config.ts` hardcodes
      # `NODE_ENV=production`, which trips @vsms/env's https-only deploy
      # rules for a loopback, no-TLS stack. See that file's own comment for
      # the full mechanism.
      SKIP_ENV_VALIDATION: '1'
    volumes:
      - ./dev-keys/envelope-current.pem:/run/envelope/current.pem:ro
      - ./dev-keys/envelope-next.pem:/run/envelope/next.pem:ro
      - ./dev-keys/console-composer.pem:/run/envelope/console-composer.pem:ro
    # The browser pins the gateway's two PUBLIC sealing keys, and Compose has no
    # declarative way to derive them from the private PEMs this stack already
    # mounts into the gateway, so the entrypoint does: Node's own `crypto`
    # turns each PEM into the raw 32-byte public key as base64url
    # (`sms-gateway server-keys` prints the same two values). Dev keys only; a
    # real deployment sets the two variables from `sms-gateway server-keys`.
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        pub() { node -e 'const c=require("node:crypto"),fs=require("node:fs");process.stdout.write(c.createPublicKey(c.createPrivateKey(fs.readFileSync(process.argv[1]))).export({format:"jwk"}).x)' "$$1"; }
        export SMS_ENVELOPE_SERVER_KEY_CURRENT="$$(pub /run/envelope/current.pem)"
        export SMS_ENVELOPE_SERVER_KEY_NEXT="$$(pub /run/envelope/next.pem)"
        exec node frontends/apps/admin/server.js
    depends_on:
      sms-gateway:
        condition: service_healthy
      register-composer:
        condition: service_completed_successfully
      provision-user:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:${VSMS_DEMO_CONSOLE_PORT:-3100}:8080'

  # The demo showcase's own evaluator — `examples/node/demo-app`'s own
  # module doc has the full reasoning. Sends one OTP through
  # `@vaam-apps/vsms-node`, watches it reach a terminal state, and verifies
  # the `hooks` role's own signed webhook for it — the one piece of this
  # stack nothing else exercises end to end.
  #
  # `profiles: [demo]` — its OWN profile, deliberately never `console`:
  # this is a backend proof (it talks to `sms-gateway` directly, the
  # same way `admin` itself does, never through the console), not a
  # console-only extra, so it must be reachable without ever starting
  # `admin`. `just demo`/`just demo-app` pass `--profile console
  # --profile demo` together; `--profile demo` alone (no console) is
  # itself a legitimate, documented way to run this proof — see
  # `docs/runbooks/showcase.adoc`'s own "The demo app" section. It still
  # needs its own service key (`register-demo-app`, which is
  # `profiles: [demo]` for exactly this reason, so it runs for either profile
  # alone).
  #
  # `restart: 'no'` — explicit, matching this file's own convention for
  # every other one-shot step, even though it's also Compose's default
  # when unspecified: this container is meant to run once and exit,
  # never be restarted by Compose itself. It DOES define a real
  # `HEALTHCHECK` in its own Dockerfile (`node -e ...:9000/healthz`,
  # used while the process is up so `docker compose ps` can show
  # `healthy` mid-run) — that's a liveness signal, not a restart policy.
  demo-app:
    build:
      context: .
      dockerfile: examples/node/demo-app/Dockerfile
    profiles: [demo]
    restart: 'no'
    environment:
      VSMS_BASE_URL: http://sms-gateway:8080
      VSMS_SIGNING_KEY_PATH: /run/demo/demo-app.pem
      VSMS_SERVER_KEYS_PATH: /run/demo/server-keys.txt
      DEMO_WEBHOOK_AUDIENCE: demo-app
      DEMO_WEBHOOK_PORT: '9000'
    volumes:
      # The demo app's DEV signing key and the gateway's two public sealing
      # keys, both minted by `just dev-keys` into the git-ignored `dev-keys/`.
      - ./dev-keys/demo-app.pem:/run/demo/demo-app.pem:ro
      - ./dev-keys/server-keys.txt:/run/demo/server-keys.txt:ro
      # The id of the demo's `WebhookEndpoint`, written by `seed-demo-webhook`
      # (which `depends_on` below completes first): `DEMO_WEBHOOK_ENDPOINT_ID_PATH`.
      - vsms_dev_endpoint:/run/demo-endpoint:ro
    depends_on:
      sms-gateway:
        condition: service_healthy
      sms-worker:
        condition: service_started
      seed-demo-webhook:
        condition: service_completed_successfully
      register-demo-app:
        condition: service_completed_successfully

volumes:
  vsms_dev_pgdata:
  vsms_dev_endpoint:
