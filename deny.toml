[licenses]
unused-allowed-license = "warn"
confidence-threshold = 0.95
allow = [
  "Zlib",
  "ISC",
  "Unicode-3.0",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "BlueOak-1.0.0",
  "CDLA-Permissive-2.0",
]

[advisories]
# RUSTSEC-2023-0071 — Marvin Attack: potential key recovery through timing
# sidechannels in `rsa` (no fixed version exists; upstream tracking issue:
# https://github.com/RustCrypto/RSA/issues/626).
#
# Re-verified 2026-10-27, after VS-4 deleted the embedded OpenID Provider and
# with it `authkestra` and `jsonwebtoken`, which were how `rsa` used to reach
# production code (RS256 signing of the OP's tokens, JWK derivation for
# `private_key_jwt`). What is left, measured with
# `cargo tree --workspace -i rsa -e normal,build,dev`:
#
#   - `rsa 0.9.10` enters through `sms-fake-aws` alone, the dev/demo fake of
#     AWS End User Messaging SMS and its SNS topic, and so only through
#     `sms-fake-aws-bin` and `sms-worker`'s dev-dependencies. No production
#     binary (`sms-gateway`, `sms-worker-bin`, `sms-migrate`) links it.
#   - Its one use is *signing* a fake SNS notification with a key it generates
#     itself, and publishing the matching certificate. No decrypt call exists.
#
# The Marvin Attack is specifically a *decryption*-oracle timing attack: an
# attacker submits chosen ciphertext and observes response timing to learn
# whether PKCS#1 v1.5 padding validated. Signing data the fake chooses itself
# gives no network attacker that oracle.
#
# Accepted, not silenced: if a decrypt path is ever added in `sms-fake-aws`, or
# a fixed `rsa` ships, this entry must be revisited. Time-boxed: re-run this
# analysis by 2026-12-04, or sooner if `rsa` publishes a patched release.
# RUSTSEC-2023-0089 — `atomic-polyfill` is unmaintained (the author archived
# the repository; the advisory's own "Solution: No safe upgrade is available!"
# is accurate, there is no patched release to bump to).
#
# New with multi-country stage 1, which added `phonenumber` to
# backends/crates/sms-msisdn. Reachability, measured rather than argued:
#
#   - The chain is `phonenumber 0.3.10` -> `postcard 1.1.3` -> `heapless
#     0.7.17` -> `atomic-polyfill 1.0.3`, on both a build-dependency and a
#     normal edge (phonenumber lists `postcard` in both sections; the
#     build script serialises the libphonenumber metadata, the library
#     deserialises it).
#   - `heapless 0.7.17`'s own manifest makes `atomic-polyfill` a dependency
#     **only** on targets without native atomic compare-and-swap, named one
#     by one: `cfg(target_arch = "avr")`, `riscv32i-unknown-none-elf`,
#     `riscv32imc-unknown-none-elf`, `thumbv6m-none-eabi` and
#     `xtensa-esp32s2-none-elf`. Read out of the vendored manifest, not
#     inferred from the crate's description.
#   - This workspace builds x86_64/aarch64 Linux only: every shipped binary
#     comes from `rust:1.98-alpine3.22` (musl) in `backends/apps/*/Dockerfile`,
#     and CI and developer machines are gnu on the same two architectures.
#     None is in that list, so the crate is never compiled here.
#   - Confirmed empirically, both directions: `cargo tree -i atomic-polyfill`
#     reports "nothing to print" for the host target, while
#     `cargo tree -i atomic-polyfill --target all` prints the chain above.
#     `cargo deny` evaluates every target by default, which is why it sees
#     what no build of this repository ever will.
#
# There is no downstream fix. `postcard`'s default `heapless-cas` feature is
# what enables `heapless/cas`, and Cargo features are additive — naming
# `postcard` here with `default-features = false` would not remove a feature
# `phonenumber` itself asks for. `heapless 0.8` replaced `atomic-polyfill`
# with `portable-atomic`; closing this properly means `postcard` moving to
# it upstream.
#
# Accepted, not silenced, and scoped to this one advisory id so any other
# advisory — including any future one on `heapless` or `postcard`
# themselves — still fails this job. Time-boxed: revisit by 2026-12-04
# (alongside the RUSTSEC-2023-0071 entry above, so both are checked in one
# pass), or sooner if `phonenumber` is bumped, since a bump is the moment
# this chain could change shape. The alternative considered and not taken
# was a `[graph] targets` list restricting cargo-deny to the platforms this
# repository actually builds. That is arguably the more correct fix — it
# states a true fact rather than excusing an advisory — but it silently
# narrows advisory scope for the *whole* graph, which is a wider decision
# than this one crate warrants and belongs to the maintainer, not to a
# dependency addition.
# RUSTSEC-2024-0449 — `unsafe-libyaml` is unmaintained (the repository was
# archived on 2024-03-25; the last release is 0.2.11). An "unmaintained" notice,
# not a vulnerability: no exploitable defect is named.
#
# New with VSC-1, which added the YAML deployment configuration:
#
#     unsafe-libyaml <- serde_yaml 0.9 (deprecated) <- figment <- sms-config
#     unsafe-libyaml <- serde_yaml_ng 0.10 <- sms-config
#
# so it is linked into `sms-gateway` and `sms-worker`. What it parses is the
# deployment's own configuration document, written by the operator and mounted
# from the image, a compose bind or a ConfigMap - never a request body, a
# webhook payload or anything a caller controls. vpay accepts the same advisory
# for the same chain (`vpay-config`), for the same reason.
#
# There is no drop-in: removing it means replacing figment's YAML provider and
# `serde_yaml_ng` with a parser that does not sit on libyaml (the advisory names
# `saphyr` and `noyalib`), which changes how every deployment's configuration is
# read and belongs in its own reviewed change, ideally made alongside vpay's.
#
# Accepted, not silenced, and scoped to this one advisory id so any other
# advisory - including a vulnerability, not only "unmaintained", published
# against `unsafe-libyaml` under a different id - still fails this job.
# Time-boxed: revisit by 2026-12-04, with the two entries below, or sooner if
# vpay replaces its parser.
ignore = [
  { id = "RUSTSEC-2024-0449", reason = "`unsafe-libyaml` is unmaintained (archived 2024-03-25), an unmaintained notice and not a vulnerability. It enters only through serde_yaml (figment) and serde_yaml_ng, which sms-config uses to read the operator-written deployment configuration; nothing a caller controls is parsed by it. No drop-in replacement exists short of changing the YAML parser, which vpay has deferred for the same reason. See the comment above for the full analysis and revisit date." },
  { id = "RUSTSEC-2023-0071", reason = "Marvin Attack (timing sidechannel) only affects RSA PKCS#1v1.5 *decryption*. This graph's only `rsa` usage is sms-fake-aws (a dev/demo fake, linked by no production binary), which only signs — no decrypt call exists anywhere in the reachable code. Re-verified 2026-10-27 after authkestra left the graph. See the comment above for the full analysis and revisit date." },
  { id = "RUSTSEC-2023-0089", reason = "`atomic-polyfill` is unmaintained with no patched release. It enters only via phonenumber -> postcard -> heapless 0.7, and heapless gates it to AVR/RISC-V/thumbv6m/Xtensa targets — none of which this workspace builds (x86_64 and aarch64 Linux only). `cargo tree -i atomic-polyfill` finds nothing for the host target; only `--target all` reaches it. See the comment above for the full analysis and revisit date." },
]
