[licenses]
unused-allowed-license = "warn"
confidence-threshold = 0.95
allow = [
  "Zlib",
  "ISC",
  "Unicode-3.0",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "BlueOak-1.0.0",
  "CDLA-Permissive-2.0",
]

[advisories]
# RUSTSEC-2023-0071 — Marvin Attack: potential key recovery through timing
# sidechannels in `rsa` (no fixed version exists; upstream tracking issue:
# https://github.com/RustCrypto/RSA/issues/626).
#
# Re-verified 2026-09 against authkestra `=0.8.0` (bumped from `=0.5.4`;
# AGENTS.md's authkestra-0.8 section has the full upgrade). Honest bookkeeping
# first: this entry's own original time-box ("or sooner if authkestra bumps
# past 0.3.3") fired the moment the 0.5.x bump landed and was never acted on
# until now — the two intervening authkestra bumps (0.3.3 -> 0.5.0 -> 0.5.4)
# both moved this dependency without this file being revisited, the identical
# "nobody re-checked a standing condition" shape AGENTS.md's own doc-drift
# incidents already catalogue elsewhere. This re-check closes that gap rather
# than extending it further.
#
# Reachability analysis (#174, originally; re-run here against the vendored
# 0.8.0 source directly, not re-stated from memory):
#
#   - `rsa` enters through `authkestra-engine 0.8.0`'s own direct dependency
#     (`rsa = "0.9.6"` in authkestra-engine's own Cargo.toml — a caret
#     requirement, not a pin; resolves to `rsa 0.9.10` in this workspace's
#     own Cargo.lock, verified rather than assumed) and
#     transitively through `jsonwebtoken 11.0.0`'s `rust_crypto` backend —
#     both reached via `authkestra-op`/`authkestra-axum`/`authkestra-resource`,
#     which all depend on `authkestra-engine` as of 0.8.0's restructuring
#     (`ClientStore`/`ClientAssertionStore`/`ClientRegistration` moved there
#     too — see item A3) -> the OP that signs every access token and
#     verifies `private_key_jwt` client assertions (RS256).
#   - `jsonwebtoken`'s rsa backend
#     (jsonwebtoken-11.0.0/src/crypto/rust_crypto/rsa.rs — unchanged file,
#     same jsonwebtoken version as before this bump) still calls only
#     `Pkcs1v15Sign`/`Pss` `Signer::sign_with_rng` (private key) and
#     `Verifier::verify` (public key, no private-key operation at all). No
#     `Decryptor`, no `decrypt`/`decrypt_blinded` call anywhere in the file.
#   - `authkestra-engine`'s own direct `rsa::` use
#     (authkestra-engine-0.8.0/src/token/mod.rs, `TokenManager::new_asymmetric`
#     — same function name and same PEM-parse-then-publish-JWK shape 0.3.3
#     had) only parses a PEM-encoded RSA private key to read `n`/`e` and
#     publish the public JWK. No decrypt call either.
#
# The Marvin Attack is specifically a *decryption*-oracle timing attack:
# an attacker submits chosen ciphertext and observes response timing to
# learn whether PKCS#1 v1.5 padding validated, recovering the private key
# (CVSS vector confirms this: C:H/I:N/A:N — confidentiality-only impact).
# RSA *signing* exponentiates with the private key over data this service
# chooses itself (not attacker-supplied ciphertext), and verification only
# ever touches the public key, so neither operation gives a network
# attacker the decryption oracle the attack requires. This codebase has
# no reachable `rsa` decryption call — grep confirms it, re-run against the
# 0.8.0 vendored source specifically, not just the 0.3.3 source these lines
# originally described
# (`rg -i 'rsa::.*[Dd]ecrypt|Oaep.*decrypt|Pkcs1v15Encrypt|Decryptor'` across
# authkestra-engine-0.8.0's and jsonwebtoken-11.0.0's own sources returns
# nothing).
#
# Accepted, not silenced: if `authkestra` ever adds a decrypt path through
# `rsa`, or a fixed `rsa` release ships, this entry must be revisited.
# Time-boxed: re-run this analysis by 2026-12-04, or sooner if `authkestra`
# bumps past `0.8.0` or `rsa` publishes a patched release — and, learning
# from this entry's own history above, actually re-run it at the next bump
# rather than carrying the pin number forward unchecked.
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "Marvin Attack (timing sidechannel) only affects RSA PKCS#1v1.5 *decryption*. This graph's only `rsa` usage (via jsonwebtoken's RS256 backend and authkestra-engine's JWK derivation) is signing/verification and PEM parsing — no decrypt call exists anywhere in the reachable code. Re-verified against authkestra 0.8.0. See the comment above for the full analysis and revisit date." },
]
