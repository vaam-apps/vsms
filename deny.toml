  "BSL-1.0",
  "BlueOak-1.0.0",
  "CDLA-Permissive-2.0",
]

[advisories]
# RUSTSEC-2023-0071 — Marvin Attack: potential key recovery through timing
# sidechannels in `rsa` (no fixed version exists; upstream tracking issue:
# https://github.com/RustCrypto/RSA/issues/626).
#
# Re-verified 2026-10-30, when VSA-3a restored the embedded OpenID Provider and
# with it `authkestra` `=0.8.0` (the pin #446 removed) and `jsonwebtoken`, which
# is how `rsa` is again linked into production code: `sms-gateway` signs the
# OP's tokens with RS256 and `provision-client` generates client keypairs.
# `cargo tree --workspace -i rsa -e normal,build,dev` finds `rsa 0.9.10` under
# `sms-auth`, `authkestra-engine` and `jsonwebtoken 11.1.0`, as well as
# `sms-fake-aws`. The analysis below was done against the vendored 0.8.0 source
# when authkestra was last in this tree and is re-run here, unchanged in its
# conclusion: `jsonwebtoken` moved 11.0.0 -> 11.1.0 and its rsa backend stayed
# `Pkcs1v15Sign`/`Pss` signing and verification only (the grep below returns nothing for 11.1.0 as well).
#
# Reachability analysis (#174, originally; re-run against the vendored 0.8.0 source
# directly, not re-stated from memory):
#
#   - `sms-auth` itself calls `RsaPrivateKey::new` (key generation) and
#     `to_pkcs8_pem` (encoding) for the OP's signing keys and the client
#     keypairs: no `decrypt`, no `Oaep`, no `Pkcs1v15Encrypt`.
#   - `rsa` enters through `authkestra-engine 0.8.0`'s own direct dependency
#     (`rsa = "0.9.6"` in authkestra-engine's own Cargo.toml — a caret
#     requirement, not a pin; resolves to `rsa 0.9.10` in this workspace's
#     own Cargo.lock, verified rather than assumed) and
#     transitively through `jsonwebtoken 11.0.0`'s `rust_crypto` backend —
#     both reached via `authkestra-op`/`authkestra-axum`/`authkestra-resource`,
#     which all depend on `authkestra-engine` as of 0.8.0's restructuring
#     (`ClientStore`/`ClientAssertionStore`/`ClientRegistration` moved there
#     too — see item A3) -> the OP that signs every access token and
#     verifies `private_key_jwt` client assertions (RS256).
#   - `jsonwebtoken`'s rsa backend
#     (jsonwebtoken-11.0.0/src/crypto/rust_crypto/rsa.rs — unchanged file,
#     same jsonwebtoken version as before this bump) still calls only
#     `Pkcs1v15Sign`/`Pss` `Signer::sign_with_rng` (private key) and
#     `Verifier::verify` (public key, no private-key operation at all). No
#     `Decryptor`, no `decrypt`/`decrypt_blinded` call anywhere in the file.
#   - `authkestra-engine`'s own direct `rsa::` use
#     (authkestra-engine-0.8.0/src/token/mod.rs, `TokenManager::new_asymmetric`
#     — same function name and same PEM-parse-then-publish-JWK shape 0.3.3
#     had) only parses a PEM-encoded RSA private key to read `n`/`e` and
#     publish the public JWK. No decrypt call either.
#
# The Marvin Attack is specifically a *decryption*-oracle timing attack:
# an attacker submits chosen ciphertext and observes response timing to
# learn whether PKCS#1 v1.5 padding validated, recovering the private key
# (CVSS vector confirms this: C:H/I:N/A:N — confidentiality-only impact).
# RSA *signing* exponentiates with the private key over data this service
# chooses itself (not attacker-supplied ciphertext), and verification only
# ever touches the public key, so neither operation gives a network
# attacker the decryption oracle the attack requires. This codebase has
# no reachable `rsa` decryption call — grep confirms it, re-run against the
# 0.8.0 vendored source specifically, not just the 0.3.3 source these lines
# originally described
# (`rg -i 'rsa::.*[Dd]ecrypt|Oaep.*decrypt|Pkcs1v15Encrypt|Decryptor'` across
# authkestra-engine-0.8.0's and jsonwebtoken-11.0.0's own sources returns
# nothing).
#
# Accepted, not silenced: if `authkestra` ever adds a decrypt path through
# `rsa`, or a fixed `rsa` release ships, this entry must be revisited.
# Time-boxed: re-run this analysis by 2026-12-04, or sooner if `authkestra`
# bumps past `0.8.0` or `rsa` publishes a patched release — and, learning
# from this entry's own history above, actually re-run it at the next bump
# rather than carrying the pin number forward unchecked.
# RUSTSEC-2023-0089 — `atomic-polyfill` is unmaintained (the author archived
# the repository; the advisory's own "Solution: No safe upgrade is available!"
# is accurate, there is no patched release to bump to).
#
# New with multi-country stage 1, which added `phonenumber` to
# backends/crates/sms-msisdn. Reachability, measured rather than argued:
#
#   - The chain is `phonenumber 0.3.10` -> `postcard 1.1.3` -> `heapless
#     0.7.17` -> `atomic-polyfill 1.0.3`, on both a build-dependency and a
#     normal edge (phonenumber lists `postcard` in both sections; the
#     build script serialises the libphonenumber metadata, the library
#     deserialises it).
#   - `heapless 0.7.17`'s own manifest makes `atomic-polyfill` a dependency
#     **only** on targets without native atomic compare-and-swap, named one
#     by one: `cfg(target_arch = "avr")`, `riscv32i-unknown-none-elf`,
#     `riscv32imc-unknown-none-elf`, `thumbv6m-none-eabi` and
#     `xtensa-esp32s2-none-elf`. Read out of the vendored manifest, not
#     inferred from the crate's description.
#   - This workspace builds x86_64/aarch64 Linux only: every shipped binary
#     comes from `rust:1.98-alpine3.22` (musl) in `backends/apps/*/Dockerfile`,
#     and CI and developer machines are gnu on the same two architectures.
#     None is in that list, so the crate is never compiled here.
#   - Confirmed empirically, both directions: `cargo tree -i atomic-polyfill`
#     reports "nothing to print" for the host target, while
#     `cargo tree -i atomic-polyfill --target all` prints the chain above.
#     `cargo deny` evaluates every target by default, which is why it sees
#     what no build of this repository ever will.
#
# There is no downstream fix. `postcard`'s default `heapless-cas` feature is
# what enables `heapless/cas`, and Cargo features are additive — naming
# `postcard` here with `default-features = false` would not remove a feature
# `phonenumber` itself asks for. `heapless 0.8` replaced `atomic-polyfill`
# with `portable-atomic`; closing this properly means `postcard` moving to
# it upstream.
#
# Accepted, not silenced, and scoped to this one advisory id so any other
# advisory — including any future one on `heapless` or `postcard`
# themselves — still fails this job. Time-boxed: revisit by 2026-12-04
# (alongside the RUSTSEC-2023-0071 entry above, so both are checked in one
# pass), or sooner if `phonenumber` is bumped, since a bump is the moment
# this chain could change shape. The alternative considered and not taken
# was a `[graph] targets` list restricting cargo-deny to the platforms this
# repository actually builds. That is arguably the more correct fix — it
# states a true fact rather than excusing an advisory — but it silently
# narrows advisory scope for the *whole* graph, which is a wider decision
# than this one crate warrants and belongs to the maintainer, not to a
# dependency addition.
#
# RUSTSEC-2024-0449 — `unsafe-libyaml` is unmaintained (the repository was
# archived on 2024-03-25; the last release is 0.2.11). An "unmaintained" notice,
# not a vulnerability: no exploitable defect is named.
#
# New with VSC-1, which added the YAML deployment configuration:
#
#     unsafe-libyaml <- serde_yaml 0.9 (deprecated) <- figment <- sms-config
#     unsafe-libyaml <- serde_yaml_ng 0.10 <- sms-config
#
# so it is linked into `sms-gateway` and `sms-worker`. What it parses is the
# deployment's own configuration document, written by the operator and mounted
# from the image, a compose bind or a ConfigMap - never a request body, a
# webhook payload or anything a caller controls. vpay accepts the same advisory
# for the same chain (`vpay-config`), for the same reason.
#
# There is no drop-in: removing it means replacing figment's YAML provider and
# `serde_yaml_ng` with a parser that does not sit on libyaml (the advisory names
# `saphyr` and `noyalib`), which changes how every deployment's configuration is
# read and belongs in its own reviewed change, ideally made alongside vpay's.
#
# Accepted, not silenced, and scoped to this one advisory id so any other
# advisory - including a vulnerability, not only "unmaintained", published
# against `unsafe-libyaml` under a different id - still fails this job.
# Time-boxed: revisit by 2026-12-04, with the RUSTSEC-2023-0071 and
# RUSTSEC-2023-0089 entries above (all three in one pass), or sooner if vpay
# replaces its parser.#
# RUSTSEC-2026-0387 — crypto-bigint 0.5.5: timing variability in operations
# meant to be constant-time. Only 0.7.6+ is fixed, and 0.5.5 enters through
# elliptic-curve 0.13 <- p256/p384 0.13 <- jsonwebtoken 11 <- authkestra 0.8
# (sms-auth's OP, sms-gateway); jsonwebtoken 11.1.0, its newest release, still
# needs p256 ^0.13, so no release clears it. Measured, not assumed, when VSA-3a
# restored it: `cargo deny check` reports exactly this one advisory and
# `cargo tree -i crypto-bigint@0.5.5` ends at jsonwebtoken. Moving authkestra to
# its newest release (0.13.1, which vpay runs) does not help: it depends on the
# same jsonwebtoken 11. (The 0.7 line, via cratestack-cose's p256 0.14, is at
# 0.7.10 and clean.)
# What the P-256/P-384 code does here: vsms's own OP and every AppClient sign
# RS256 with RSA, and the P-256/P-384 code in jsonwebtoken is only reached to
# VERIFY ES256/ES384 signatures against PUBLIC keys (the OP's `private_key_jwt`
# check of a client assertion, whose registered keys are RSA JWKs we generated).
# A timing leak in a public-key verification exposes no secret. Same reasoning
# and decision as vpay's entry (vaam-apps/vpay 55e848f). Goes when authkestra and
# jsonwebtoken reach elliptic-curve 0.14, or when cargo-deny reports the entry as
# no longer matching.
ignore = [
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 via jsonwebtoken 11 <- authkestra 0.8; no release clears it (jsonwebtoken 11.1.0 still needs p256 0.13). P-256/P-384 only verify signatures against public keys here; vsms signs RS256 with RSA. See the comment above." },
  { id = "RUSTSEC-2023-0071", reason = "Marvin Attack (timing sidechannel) only affects RSA PKCS#1v1.5 *decryption*. This graph's `rsa` usage (the OP's RS256 signing, client keypair generation, jsonwebtoken's RS256 backend, authkestra-engine's JWK derivation, and sms-fake-aws) is signing/verification and PEM parsing, no decrypt call exists anywhere in the reachable code. Re-verified 2026-10-30 against authkestra 0.8.0. See the comment above for the full analysis and revisit date." },
  { id = "RUSTSEC-2023-0089", reason = "`atomic-polyfill` is unmaintained with no patched release. It enters only via phonenumber -> postcard -> heapless 0.7, and heapless gates it to AVR/RISC-V/thumbv6m/Xtensa targets — none of which this workspace builds (x86_64 and aarch64 Linux only). `cargo tree -i atomic-polyfill` finds nothing for the host target; only `--target all` reaches it. See the comment above for the full analysis and revisit date." },
  { id = "RUSTSEC-2024-0449", reason = "`unsafe-libyaml` is unmaintained (archived 2024-03-25), an unmaintained notice and not a vulnerability. It enters only through serde_yaml (figment) and serde_yaml_ng, which sms-config uses to read the operator-written deployment configuration; nothing a caller controls is parsed by it. No drop-in replacement exists short of changing the YAML parser, which vpay has deferred for the same reason. See the comment above for the full analysis and revisit date." },
]
